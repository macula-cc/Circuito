<!doctype html>
<html lang="pt-BR">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --serif: 'Instrument Serif', Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --ink:#111; --line: rgba(0,0,0,0.15); --gray:#6b6b6b; --hover:#f0f0f0; --paper:#fff;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; color:var(--ink); font-family:var(--sans); background:var(--paper); }
  a{ color:inherit; text-decoration:none; }
  button, select{ font:inherit; touch-action:manipulation; }

  .nav{ display:flex; gap:2px; font-family:var(--mono); font-size:0.75rem;
        background:#f4f4f4; border:1px solid var(--line); border-radius:999px; padding:3px; width:max-content; margin-bottom:1.6rem; }
  .nav a{ padding:0.5rem 0.9rem; border-radius:999px; color:var(--gray); }
  .nav a.active{ background:#111; color:#fff; }
  .nav a:not(.active):hover{ background:var(--hover); color:var(--ink); }

  .wrap{ display:grid; grid-template-columns:400px 1fr; min-height:100vh; }
  @media (max-width:900px){ .wrap{ grid-template-columns:1fr; } }

  .panel{ padding:calc(1.6rem + env(safe-area-inset-top)) 1.6rem 2rem; border-right:1px solid var(--line);
          overflow-y:auto; max-height:100vh; }
  @media (max-width:900px){ .panel{ border-right:none; border-bottom:1px solid var(--line); max-height:none; } }

  h1{ font-family:var(--serif); font-weight:400; font-size:2.1rem; line-height:1.05; margin:0 0 0.2rem; }
  .sub{ font-family:var(--mono); font-size:0.79rem; color:var(--gray); margin-bottom:1.6rem; }

  .field{ margin-bottom:1.6rem; }
  .field label{ display:block; font-family:var(--mono); font-size:0.73rem; text-transform:uppercase;
                letter-spacing:0.04em; color:var(--gray); margin-bottom:0.5rem; }
  select{ width:100%; padding:0.65rem 0.7rem; border:1px solid var(--ink); border-radius:0; background:#fff;
          color:var(--ink); font-family:var(--sans); font-size:0.94rem; }

  .row-btns{ display:flex; gap:0.5rem; flex-wrap:wrap; }
  .btn{ font-family:var(--mono); font-size:0.79rem; background:#fff; color:var(--ink); border:1px solid var(--ink);
        padding:0.6rem 0.9rem; cursor:pointer; border-radius:0; transition:background 0.15s ease, color 0.15s ease; }
  .btn:hover{ background:var(--ink); color:#fff; }
  .btn.active{ background:var(--ink); color:#fff; }
  .btn.primary{ background:var(--ink); color:#fff; flex:1; padding:0.85rem; font-size:0.83rem; }
  .btn.primary:hover{ opacity:0.8; }
  .btn:disabled{ opacity:0.35; cursor:default; pointer-events:none; }

  .count-note{ font-family:var(--mono); font-size:0.73rem; color:var(--gray); margin-top:0.5rem; line-height:1.4; }
  .status{ font-family:var(--mono); font-size:0.75rem; color:var(--gray); margin-top:0.9rem; min-height:1.2em; line-height:1.4; }
  .status.error{ color:#9A3324; }

  .stage{ display:flex; align-items:center; justify-content:center; padding:2.4rem; }
  .canvas-frame{ width:min(74vh, 100%); max-width:640px; aspect-ratio:1/1; border:1px solid var(--line);
                 box-shadow:0 12px 40px rgba(0,0,0,0.08); background:#fff; }
  #art{ width:100%; height:100%; display:block; }
</style>

<body>

<div class="wrap">
  <div class="panel">
    <div class="nav">
      <a href="ferramentas.html">ferramentas</a>
      <a href="gerador-marca.html">marca</a>
      <a href="gerador-mascara.html" class="active">máscara</a>
      <a href="gerador-circuito.html">circuito vivo</a>
    </div>

    <h1>Gerador de<br>Máscara</h1>
    <div class="sub">Circuito Paralelo — Ateliês do Centro do Rio</div>

    <div class="field">
      <label for="artist-select">Artista</label>
      <select id="artist-select"><option>carregando…</option></select>
    </div>

    <div class="field">
      <label>Pontos dos ateliês</label>
      <div class="row-btns">
        <button class="btn" id="pins-on">mostrar</button>
        <button class="btn active" id="pins-off">esconder</button>
      </div>
    </div>

    <div class="field">
      <label>Forma da máscara</label>
      <div class="count-note" id="count-note">o contorno passa por todos os ateliês, em uma ordem nova a cada geração — tudo que fica dentro dele vira a máscara</div>
      <div class="row-btns" style="margin-top:0.7rem;">
        <button class="btn primary" id="btn-shuffle" style="flex:1;">gerar nova</button>
      </div>
    </div>

    <div class="field">
      <label>Exportar</label>
      <div class="row-btns">
        <button class="btn primary" id="btn-download-svg">SVG</button>
        <button class="btn primary" id="btn-download-png">PNG</button>
        <button class="btn primary" id="btn-download-pdf">PDF</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="stage">
    <div class="canvas-frame">
      <svg id="art" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
</div>

<script>
/* ============================================================
   dados
   ============================================================ */
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1Zjux0r3uVJ8ua1ZXpWd68lOSP5Kj0XkU/gviz/tq?tqx=out:csv&sheet=Circuito';
const LOGICAL = 1000;
const FONT_IMPORT = "https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap";
const BOX = { x: 60, y: 60, w: 880, h: 600 }; // área onde a máscara/foto vive

function parseCSV(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\r'){ /* ignore */ }
      else if (c === '\n'){ row.push(field); field = ''; rows.push(row); row = []; }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

async function loadLocationsFromSheet(){
  const res = await fetch(SHEET_CSV_URL);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const table = parseCSV(text).filter(r => r.some(c => c !== undefined && c.trim() !== ''));
  if (table.length < 2) throw new Error('planilha vazia');
  const headers = table[0].map(h => h.trim());
  const hIdx = {}; headers.forEach((h,i)=>hIdx[h]=i);
  const get = (row, name) => { const i = hIdx[name]; return (i!=null && row[i]!=null) ? row[i].trim() : ''; };
  const locMap = {}; const order = [];
  table.slice(1).forEach(row => {
    const local = get(row,'Local / Coletivo');
    const endereco = get(row,'Endereço');
    const nome = get(row,'Nome do Artista');
    if (!endereco && !nome) return;
    const instagram = get(row,'Instagram').replace(/^@/, '');
    const foto = get(row,'Foto do trabalho (URL)');
    const latRaw = get(row,'Latitude');
    const lngRaw = get(row,'Longitude');
    const key = endereco;
    if (!locMap[key]){
      locMap[key] = {
        id: 'loc' + order.length, local, endereco,
        lat: latRaw ? parseFloat(latRaw.replace(',', '.')) : null,
        lng: lngRaw ? parseFloat(lngRaw.replace(',', '.')) : null,
        artistas: []
      };
      order.push(key);
    }
    locMap[key].artistas.push({ nome, instagram, foto });
  });
  return order.map(k => locMap[k]);
}

function initials(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

/* ============================================================
   posiciona os pontos de acordo com as coordenadas reais, dentro
   da área reservada pra máscara (BOX) — sem nenhum mapa desenhado
   ============================================================ */
function project(lat, lon){
  const x = (lon + 180) / 360;
  const rad = lat * Math.PI/180;
  const y = (1 - Math.log(Math.tan(rad) + 1/Math.cos(rad)) / Math.PI) / 2;
  return { x, y };
}
function expandBounds(b, factor){
  const cLat = (b.minLat+b.maxLat)/2, cLng = (b.minLng+b.maxLng)/2;
  const spanLat = Math.max((b.maxLat-b.minLat)*factor, 0.002);
  const spanLng = Math.max((b.maxLng-b.minLng)*factor, 0.002);
  return { minLat:cLat-spanLat/2, maxLat:cLat+spanLat/2, minLng:cLng-spanLng/2, maxLng:cLng+spanLng/2 };
}
let proj = null;
function computeProjection(bounds, boxW, boxH, margin, padFactor){
  const expanded = expandBounds(bounds, padFactor);
  const p1 = project(expanded.maxLat, expanded.minLng);
  const p2 = project(expanded.minLat, expanded.maxLng);
  const worldW = p2.x - p1.x, worldH = p2.y - p1.y;
  const scale = Math.min((boxW - margin*2)/worldW, (boxH - margin*2)/worldH);
  const offsetX = (boxW - worldW*scale)/2, offsetY = (boxH - worldH*scale)/2;
  return { p1, scale, offsetX, offsetY };
}
function pixelOf(lat, lon){
  const p = project(lat, lon);
  return {
    x: BOX.x + proj.offsetX + (p.x - proj.p1.x)*proj.scale,
    y: BOX.y + proj.offsetY + (p.y - proj.p1.y)*proj.scale
  };
}

/* ============================================================
   caminho reto/curvo entre dois pontos
   ============================================================ */
function buildLegPath(a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  if (Math.random() < 0.35 || len < 90){
    return [ { x:a.x, y:a.y }, { x:b.x, y:b.y } ];
  }
  const nx = -dy/len, ny = dx/len;
  const side = Math.random() < 0.5 ? 1 : -1;
  const offset = len * (0.08 + Math.random()*0.14) * side;
  const mx = (a.x+b.x)/2 + nx*offset;
  const my = (a.y+b.y)/2 + ny*offset;
  const N = Math.max(18, Math.round(len/16));
  const pts = [];
  for (let i=0;i<=N;i++){
    const t = i/N;
    const it = 1-t;
    pts.push({
      x: it*it*a.x + 2*it*t*mx + t*t*b.x,
      y: it*it*a.y + 2*it*t*my + t*t*b.y
    });
  }
  return pts;
}

function escapeXML(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ============================================================
   estado
   ============================================================ */
let LOCATIONS = [];
let PTS = [];
let FLAT_ARTISTS = [];
let alphaNum = {};
let shapePoints = []; // pontos concatenados do contorno fechado atual
let maskPoints = []; // fecho convexo suavizado — a máscara de verdade
let currentArtist = null;
let photoOk = false;

const svgEl = document.getElementById('art');
const artistSelect = document.getElementById('artist-select');
const countNote = document.getElementById('count-note');
const statusEl = document.getElementById('status');
const pinsOnBtn = document.getElementById('pins-on');
const pinsOffBtn = document.getElementById('pins-off');

let showPins = false;

function setStatus(msg, isError){
  statusEl.textContent = msg || '';
  statusEl.classList.toggle('error', !!isError);
}

pinsOnBtn.addEventListener('click', () => { showPins = true; pinsOnBtn.classList.add('active'); pinsOffBtn.classList.remove('active'); draw(); });
pinsOffBtn.addEventListener('click', () => { showPins = false; pinsOffBtn.classList.add('active'); pinsOnBtn.classList.remove('active'); draw(); });

function renderArtistSelect(){
  artistSelect.innerHTML = '';
  FLAT_ARTISTS.forEach((a, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${a.nome} — ${a.loc.local || a.loc.endereco}`;
    artistSelect.appendChild(opt);
  });
  if (FLAT_ARTISTS.length){ artistSelect.value = 0; setArtist(0); }
}
function setArtist(idx){
  currentArtist = FLAT_ARTISTS[idx];
  photoOk = false;
  if (currentArtist && currentArtist.foto){
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { photoOk = true; draw(); };
    img.onerror = () => { photoOk = false; draw(); };
    img.src = currentArtist.foto;
  } else {
    draw();
  }
}
artistSelect.addEventListener('change', () => setArtist(parseInt(artistSelect.value, 10)));

// fecho convexo (monotone chain) — garante um contorno simples, sem
// auto-interseção, então o preenchimento nunca fica com buracos
function convexHull(points){
  const pts = [...points].sort((a,b) => a.x === b.x ? a.y-b.y : a.x-b.x);
  const cross = (o,a,b) => (a.x-o.x)*(b.y-o.y) - (a.y-o.y)*(b.x-o.x);
  const lower = [];
  for (const p of pts){
    while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length-1; i >= 0; i--){
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}

// arredonda os cantos de um polígono fechado (Chaikin), pra suavizar as
// pontas do fecho convexo
function chaikinSmoothClosed(points, iterations){
  let pts = points;
  for (let it = 0; it < iterations; it++){
    const next = [];
    const n = pts.length;
    for (let i = 0; i < n; i++){
      const p0 = pts[i], p1 = pts[(i+1) % n];
      next.push({ x: p0.x*0.8 + p1.x*0.2, y: p0.y*0.8 + p1.y*0.2 });
      next.push({ x: p0.x*0.2 + p1.x*0.8, y: p0.y*0.2 + p1.y*0.8 });
    }
    pts = next;
  }
  return pts;
}

function generateNewShape(){
  const withCoords = LOCATIONS.filter(l => l.lat != null && l.lng != null);
  const order = [...withCoords].sort(() => Math.random()-0.5);
  const orderPts = order.map(loc => PTS.find(p => p.loc.id === loc.id)).filter(Boolean);
  const closed = [...orderPts, orderPts[0]];

  const pts = [ { x: closed[0].x, y: closed[0].y } ];
  for (let i = 1; i < closed.length; i++){
    buildLegPath(closed[i-1], closed[i]).slice(1).forEach(pt => pts.push(pt));
  }
  shapePoints = pts;
  // a máscara de verdade é só o contorno externo desse traçado, suavizado —
  // nunca tem "buraco" porque é sempre um polígono simples
  maskPoints = chaikinSmoothClosed(convexHull(shapePoints), 3);
  draw();
}
document.getElementById('btn-shuffle').addEventListener('click', generateNewShape);

function buildShapePathD(){
  if (maskPoints.length < 3) return '';
  let d = 'M' + maskPoints[0].x.toFixed(2) + ' ' + maskPoints[0].y.toFixed(2) + ' ';
  for (let i = 1; i < maskPoints.length; i++){
    d += 'L' + maskPoints[i].x.toFixed(2) + ' ' + maskPoints[i].y.toFixed(2) + ' ';
  }
  d += 'Z';
  return d;
}

/* ============================================================
   desenho
   ============================================================ */
function buildContentSVG(){
  let s = '';
  const shapeD = buildShapePathD();

  s += `<defs><clipPath id="maskClip"><path d="${shapeD}" fill-rule="nonzero"/></clipPath></defs>`;

  if (shapeD){
    if (currentArtist && currentArtist.foto && photoOk){
      s += `<image href="${currentArtist.foto}" x="${BOX.x}" y="${BOX.y}" width="${BOX.w}" height="${BOX.h}" preserveAspectRatio="xMidYMid slice" clip-path="url(#maskClip)"/>`;
    } else {
      s += `<rect x="${BOX.x}" y="${BOX.y}" width="${BOX.w}" height="${BOX.h}" fill="#e4e4e4" clip-path="url(#maskClip)"/>`;
      s += `<text x="${BOX.x+BOX.w/2}" y="${BOX.y+BOX.h/2}" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="48" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" clip-path="url(#maskClip)">${currentArtist ? initials(currentArtist.nome) : '—'}</text>`;
    }
  }

  if (showPins){
    PTS.forEach(p => {
      s += `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="10" fill="#111" stroke="#fff" stroke-width="1.5"/>`;
      s += `<text x="${p.x.toFixed(2)}" y="${(p.y+0.5).toFixed(2)}" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#fff" text-anchor="middle" dominant-baseline="middle">${String(alphaNum[p.loc.id]).padStart(2,'0')}</text>`;
    });
  }

  const textY = BOX.y + BOX.h + 70;
  s += `<text x="${BOX.x}" y="${textY}" font-family="'Instrument Serif', Georgia, serif" font-size="46" fill="#111">${escapeXML(currentArtist ? currentArtist.nome : '—')}</text>`;
  const addrLine = currentArtist
    ? (currentArtist.loc.local ? `${currentArtist.loc.local} — ${currentArtist.loc.endereco}` : currentArtist.loc.endereco)
    : '—';
  s += `<text x="${BOX.x}" y="${textY+38}" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#6b6b6b">${escapeXML(addrLine)}</text>`;

  return s;
}

function draw(){
  svgEl.innerHTML = buildContentSVG();
}

function buildFullSVGString(){
  const content = buildContentSVG();
  return `<?xml version="1.0" encoding="UTF-8"?>\n` +
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${LOGICAL} ${LOGICAL}" width="${LOGICAL}" height="${LOGICAL}">` +
    `<defs><style>@import url('${FONT_IMPORT.replace(/&/g,'&amp;')}');</style></defs>` +
    content +
    `</svg>`;
}

/* ============================================================
   exportação — SVG (vetorial), PNG e PDF (rasterizados do SVG)
   ============================================================ */
document.getElementById('btn-download-svg').addEventListener('click', () => {
  setStatus('');
  const blob = new Blob([buildFullSVGString()], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'circuito-paralelo-mascara.svg';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

function rasterizeSVG(scale){
  return new Promise((resolve, reject) => {
    const svgBlob = new Blob([buildFullSVGString()], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = LOGICAL * scale;
      c.height = LOGICAL * scale;
      const cctx = c.getContext('2d');
      try{
        cctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c);
      } catch(err){
        URL.revokeObjectURL(url);
        reject(err);
      }
    };
    img.onerror = (err) => { URL.revokeObjectURL(url); reject(err); };
    img.src = url;
  });
}

document.getElementById('btn-download-png').addEventListener('click', async () => {
  setStatus('gerando PNG em alta resolução…');
  try{
    const c = await rasterizeSVG(3);
    c.toBlob(blob => {
      if (!blob){ setStatus('Não foi possível gerar o PNG.', true); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'circuito-paralelo-mascara.png';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      setStatus('');
    }, 'image/png');
  } catch(err){
    console.error(err);
    setStatus('Exportação bloqueada — provavelmente a foto deste artista não libera CORS. Tente outro artista, ou baixe o SVG.', true);
  }
});

document.getElementById('btn-download-pdf').addEventListener('click', async () => {
  setStatus('gerando PDF…');
  try{
    const c = await rasterizeSVG(3);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'px', format: [LOGICAL, LOGICAL] });
    doc.addImage(c.toDataURL('image/png'), 'PNG', 0, 0, LOGICAL, LOGICAL);
    doc.save('circuito-paralelo-mascara.pdf');
    setStatus('');
  } catch(err){
    console.error(err);
    setStatus('Não foi possível gerar o PDF agora — tente o SVG.', true);
  }
});

/* ============================================================
   boot
   ============================================================ */
async function boot(){
  try{ await document.fonts.load("46px 'Instrument Serif'"); } catch(e){}
  try{
    LOCATIONS = await loadLocationsFromSheet();
  } catch(err){
    console.error(err);
    setStatus('Não foi possível carregar os dados da planilha agora. Recarregue a página em instantes.', true);
    return;
  }

  const withCoords = LOCATIONS.filter(l => l.lat != null && l.lng != null);
  if (withCoords.length < 3){
    setStatus('poucos ateliês com coordenadas preenchidas ainda — é preciso pelo menos 3 pra fechar uma forma.', true);
    return;
  }
  const bounds = {
    minLat: Math.min(...withCoords.map(l=>l.lat)),
    maxLat: Math.max(...withCoords.map(l=>l.lat)),
    minLng: Math.min(...withCoords.map(l=>l.lng)),
    maxLng: Math.max(...withCoords.map(l=>l.lng)),
  };
  proj = computeProjection(bounds, BOX.w, BOX.h, 20, 1.0);

  PTS = withCoords.map(loc => {
    const { x, y } = pixelOf(loc.lat, loc.lng);
    return { loc, x, y };
  });

  const sortedForNum = [...withCoords].sort((a,b) =>
    (a.local||a.endereco).localeCompare(b.local||b.endereco, 'pt-BR', {sensitivity:'base'}));
  alphaNum = {};
  sortedForNum.forEach((loc,i) => { alphaNum[loc.id] = i+1; });

  LOCATIONS.forEach(loc => loc.artistas.forEach(art => {
    if (art.nome) FLAT_ARTISTS.push({ ...art, loc });
  }));
  FLAT_ARTISTS.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{sensitivity:'base'}));

  renderArtistSelect();
  generateNewShape();
}
boot();
</script>
