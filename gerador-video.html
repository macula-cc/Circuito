<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gerador de Vídeo — Circuito de Ateliês do Centro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">

<style>
  :root{
    --serif: 'Instrument Serif', Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --ink:#111; --line: rgba(0,0,0,0.15); --gray:#6b6b6b; --hover:#f0f0f0; --paper:#fff;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; color:var(--ink); font-family:var(--sans); background:var(--paper); }
  a{ color:inherit; text-decoration:none; }
  button, select{ font:inherit; touch-action:manipulation; }

  .nav{ display:flex; gap:2px; font-family:var(--mono); font-size:0.75rem;
        background:#f4f4f4; border:1px solid var(--line); border-radius:999px; padding:3px; width:max-content; margin-bottom:1.6rem; }
  .nav a{ padding:0.5rem 0.9rem; border-radius:999px; color:var(--gray); }
  .nav a.active{ background:#111; color:#fff; }
  .nav a:not(.active):hover{ background:var(--hover); color:var(--ink); }

  .wrap{ display:grid; grid-template-columns:400px 1fr; min-height:100vh; }
  @media (max-width:900px){ .wrap{ grid-template-columns:1fr; } }

  .panel{ padding:calc(1.6rem + env(safe-area-inset-top)) 1.6rem 2rem; border-right:1px solid var(--line);
          overflow-y:auto; max-height:100vh; }
  @media (max-width:900px){ .panel{ border-right:none; border-bottom:1px solid var(--line); max-height:none; } }

  h1{ font-family:var(--serif); font-weight:400; font-size:2.1rem; line-height:1.05; margin:0 0 0.2rem; }
  .sub{ font-family:var(--mono); font-size:0.79rem; color:var(--gray); margin-bottom:1.6rem; }

  .field{ margin-bottom:1.6rem; }
  .field label{ display:block; font-family:var(--mono); font-size:0.73rem; text-transform:uppercase;
                letter-spacing:0.04em; color:var(--gray); margin-bottom:0.5rem; }

  .row-btns{ display:flex; gap:0.5rem; flex-wrap:wrap; }
  .btn{ font-family:var(--mono); font-size:0.79rem; background:#fff; color:var(--ink); border:1px solid var(--ink);
        padding:0.6rem 0.9rem; cursor:pointer; border-radius:0; transition:background 0.15s ease, color 0.15s ease; }
  .btn:hover{ background:var(--ink); color:#fff; }
  .btn.active{ background:var(--ink); color:#fff; }
  .btn.primary{ background:var(--ink); color:#fff; flex:1; padding:0.85rem; font-size:0.83rem; }
  .btn.primary:hover{ opacity:0.8; }
  .btn:disabled{ opacity:0.35; cursor:default; pointer-events:none; }

  .divider{ border:none; border-top:1px solid var(--line); margin:1.8rem 0; }

  .status{ font-family:var(--mono); font-size:0.75rem; color:var(--gray); margin-top:0.9rem; min-height:1.2em; line-height:1.4; }
  .status.error{ color:#9A3324; }
  .note{ font-family:var(--mono); font-size:0.73rem; color:var(--gray); line-height:1.4; }

  .stage{ display:flex; align-items:center; justify-content:center; padding:2.4rem; }
  /* tamanho real (width/height) calculado em JS — ver resizeCanvasFrame().
     CSS puro (height fixo + max-width) não dá conta de preservar a
     proporção certa quando o max-width é o lado que aperta primeiro. */
  .canvas-frame{ border:1px solid var(--line);
                 box-shadow:0 12px 40px rgba(0,0,0,0.08); background:#fff; position:relative; }
  #art{ width:100%; height:100%; display:block; }
  .rec-dot{ position:absolute; top:14px; right:14px; width:10px; height:10px; border-radius:50%; background:#c0392b;
            box-shadow:0 0 0 3px rgba(192,57,43,0.25); display:none; animation:rec-pulse 1.1s ease-in-out infinite; }
  .rec-dot.on{ display:block; }
  @keyframes rec-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="panel">
    <div class="nav">
      <a href="gerador-marca.html">marca</a>
      <a href="gerador-mascara.html">post</a>
      <a href="gerador-video.html" class="active">vídeo</a>

    </div>

      <div class="row-btns" id="tipo-row">
        <button class="btn active" id="tipo-circuito" data-tipo="circuito">cobrinha</button>
        <button class="btn" id="tipo-marcas" data-tipo="marcas">troca de marcas</button>

  <div class="stage">

<!-- mapa MapLibre real, renderizado fora da tela — usado só como fonte da
     imagem de fundo (buildBasemapMapLibre) e da projeção geográfica exata
     dos pontos (map.project), nunca mostrado/interagido diretamente -->
<div id="map-offscreen" style="position:fixed; left:-99999px; top:0; width:1000px; height:1000px; pointer-events:none;"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* ============================================================
   dados
   ============================================================ */
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1Zjux0r3uVJ8ua1ZXpWd68lOSP5Kj0XkU/gviz/tq?tqx=out:csv&sheet=Circuito';
const LOGICAL_W = 1000;
let LOGICAL_H = 1000; // 1000 = quadrado (1:1); ~1778 = stories (9:16) — ver applyCanvasFormat()
const SANS_DISPLAY = "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
const EVENT_EYEBROW = 'Ateliês abertos';
const EVENT_DATES = '18 – 19 de Setembro';
// título grande é o par tagline/data (serifado, 2ª linha em itálico), sempre
// ancorado no topo — mesma diagramação do gerador de post
const EVT_TITLE_L1 = EVENT_EYEBROW; // 'Ateliês abertos'
const EVT_TITLE_L2 = EVENT_DATES;   // '18 – 19 de Setembro' (itálico)
// tamanhos de referência (formato quadrado) — no stories (9:16) o artboard
// fica bem mais alto sem crescer em largura. Um multiplicador fixo não
// funciona porque as linhas têm larguras bem diferentes entre si ("18 – 19
// de Setembro" é bem mais larga que "Ateliês abertos" no mesmo tamanho) —
// em vez disso, cada linha é ajustada pro maior tamanho que cabe numa
// margem segura da largura do artboard (função fitSizeToWidth), e o título
// usa o menor resultado entre as duas linhas (senão a mais larga estoura)
const EVT_TITLE_SIZE_BASE = 104;
const STATS_SIZE_BASE = 40;
const STORIES_FILL_RATIO = 0.86; // fração da largura do artboard que a linha mais larga pode ocupar
let EVT_TITLE_SIZE = EVT_TITLE_SIZE_BASE;
let STATS_SIZE = STATS_SIZE_BASE;
let EVT_TITLE_Y1 = 126;
let EVT_TITLE_Y2 = 224;
function fitSizeToWidth(text, fontAtSize, targetWidth){
  ctx.font = fontAtSize(100);
  const w100 = ctx.measureText(text).width;
  return w100 > 0 ? (targetWidth / w100) * 100 : 100;
}
// proporção de referência tirada do print do design: título 50pt,
// estatísticas 30pt, label (nome do evento) 22pt — usada só no stories,
// calculada a partir do título (que é ajustado pra largura logo abaixo)
const STORIES_STATS_RATIO = 30/50;
const STORIES_LABEL_RATIO = 22/50;
function updateTextSizes(){
  if (videoFormat === 'stories'){
    const targetW = LOGICAL_W * STORIES_FILL_RATIO;
    const serifFont = s => `${s}px 'Instrument Serif', Georgia, serif`;
    const serifItalicFont = s => `italic ${s}px 'Instrument Serif', Georgia, serif`;
    const size1 = fitSizeToWidth(EVT_TITLE_L1, serifFont, targetW);
    const size2 = fitSizeToWidth(EVT_TITLE_L2, serifItalicFont, targetW);
    EVT_TITLE_SIZE = Math.min(size1, size2);
    STATS_SIZE = EVT_TITLE_SIZE * STORIES_STATS_RATIO;
    LABEL_SIZE = EVT_TITLE_SIZE * STORIES_LABEL_RATIO;
    // trava de segurança: a proporção do print pode não bastar se o texto
    // real (números/nome do evento) for mais largo que o do mockup original
    ctx.font = `${STATS_SIZE}px 'Instrument Serif', Georgia, serif`;
    const statsW = ctx.measureText(`${numAddresses} Endereços – ${numArtists} Artistas`).width;
    if (statsW > targetW) STATS_SIZE *= targetW / statsW;
    ctx.font = `${LABEL_WEIGHT} ${LABEL_SIZE}px ${SANS_DISPLAY}`;
    const labelW = ctx.measureText(LABEL_L).width;
    if (labelW > targetW) LABEL_SIZE *= targetW / labelW;
  } else {
    EVT_TITLE_SIZE = EVT_TITLE_SIZE_BASE;
    STATS_SIZE = STATS_SIZE_BASE;
    // LABEL_SIZE calculado em computeLabelSize() (cap-height x serifado)
  }
  const titleScale = EVT_TITLE_SIZE / EVT_TITLE_SIZE_BASE;
  EVT_TITLE_Y1 = 126 * titleScale;
  EVT_TITLE_Y2 = EVT_TITLE_Y1 + EVT_TITLE_SIZE * (98/104); // mesma proporção de entrelinha de antes
}
const EVT_TITLE_X = LOGICAL_W / 2; // centralizado no artboard
const MAP_BOX = { x: 0, y: 0, w: LOGICAL_W, h: LOGICAL_H }; // .h atualizado em applyCanvasFormat()
const MARK_WIDTH = 30;
// infos secundárias: as duas linhas centralizadas no artboard — estatísticas
// (serifado) em cima, nome do evento em caixa alta (sans) embaixo, uma
// linha só cada, ancoradas na base do artboard (por isso dependem da altura,
// que muda com o formato — ver updateBottomLayout())
const LABEL_L = 'CIRCUITO DE ATELIÊS DO CENTRO';
const LABEL_WEIGHT = 400;
// tamanho calculado a partir da altura de caixa alta do serifado das
// estatísticas (ver computeLabelSize, chamada no boot() e em
// applyCanvasFormat() sempre que o formato muda) — 0.85x o match exato,
// igual no gerador de post
const LABEL_SIZE_FACTOR = 0.85;
let LABEL_SIZE = 26;
let EVT_LABEL_Y = LOGICAL_H - 70;
let EVT_STATS_Y = EVT_LABEL_Y - 44;
function updateBottomLayout(){
  EVT_LABEL_Y = LOGICAL_H - 70;
  EVT_STATS_Y = EVT_LABEL_Y - STATS_SIZE * 1.1; // mesma proporção de entrelinha de antes (44/40)
}
function computeLabelSize(){
  // no stories o LABEL_SIZE já foi calculado em updateTextSizes(), pela
  // proporção do print (22/50 do título) — só o quadrado usa o casamento de
  // altura de caixa alta com o serifado das estatísticas
  if (videoFormat === 'stories') return;
  ctx.font = `${STATS_SIZE}px 'Instrument Serif', Georgia, serif`;
  const serifCap = ctx.measureText('E').actualBoundingBoxAscent;
  ctx.font = `${LABEL_WEIGHT} 100px ${SANS_DISPLAY}`;
  const sansCapPer100 = ctx.measureText('E').actualBoundingBoxAscent / 100;
  LABEL_SIZE = (serifCap / sansCapPer100) * LABEL_SIZE_FACTOR;
}

function parseCSV(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\r'){ /* ignore */ }
      else if (c === '\n'){ row.push(field); field = ''; rows.push(row); row = []; }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

// alguns endereços chegam da planilha com coordenada mal digitada (ex:
// sem separador decimal, tipo "-229115" em vez de "-22,9115") — passar
// isso direto pro MapLibre derruba o mapa inteiro (ele lança exceção e
// nenhum pino aparece, nem os de outros endereços válidos). Em vez disso,
// tratamos como coordenada ainda não preenchida.
// valida o FORMATO inteiro (não só o valor numérico) antes de aceitar: sem
// isso, algo como "-22.917.173" (pontos demais, geralmente formatação de
// milhar aplicada por engano em cima de uma vírgula decimal original) passa
// pelo parseFloat, que lê só até o segundo ponto e trunca silenciosamente
// pra "-22.917" — um valor plausível mas ERRADO, que fica dentro do
// intervalo válido e por isso não seria pego pelo teste de min/max sozinho.
function parseCoord(raw, min, max){
  if (!raw) return null;
  const normalized = raw.trim().replace(',', '.');
  if (!/^-?\d{1,3}(\.\d+)?$/.test(normalized)) return null;
  const n = parseFloat(normalized);
  return (isNaN(n) || n < min || n > max) ? null : n;
}

async function loadLocationsFromSheet(){
  const res = await fetch(`${SHEET_CSV_URL}&_=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const table = parseCSV(text).filter(r => r.some(c => c !== undefined && c.trim() !== ''));
  if (table.length < 2) throw new Error('planilha vazia');
  const headers = table[0].map(h => h.trim());
  const hIdx = {}; headers.forEach((h,i)=>hIdx[h]=i);
  const get = (row, name) => { const i = hIdx[name]; return (i!=null && row[i]!=null) ? row[i].trim() : ''; };
  const locMap = {}; const order = [];
  table.slice(1).forEach(row => {
    const local = get(row,'Local / Coletivo');
    const endereco = get(row,'Endereço');
    const nome = get(row,'Nome do Artista');
    if (!endereco && !nome) return;
    const latRaw = get(row,'Latitude');
    const lngRaw = get(row,'Longitude');
    const key = endereco;
    if (!locMap[key]){
      locMap[key] = {
        id: 'loc' + order.length, local, endereco,
        lat: parseCoord(latRaw, -90, 90),
        lng: parseCoord(lngRaw, -180, 180),
        artistas: []
      };
      order.push(key);
    }
    if (nome) locMap[key].artistas.push(nome);
  });
  return order.map(k => locMap[k]);
}

/* ============================================================
   mapa real (MapLibre GL, mesmo estilo xerox do index.html) — o mapa
   é renderizado fora da tela num container escondido, e serve pra duas
   coisas: (1) fonte da imagem de fundo (buildBasemapMapLibre) e (2) fonte
   da projeção geográfica exata dos pontos (mlMap.project), garantindo por
   construção que os pinos caiam exatamente em cima das ruas certas — sem
   reimplementar a matemática de projeção Mercator/zoom de tiles à mão.
   ============================================================ */
function expandBounds(b, factor){
  const cLat = (b.minLat+b.maxLat)/2, cLng = (b.minLng+b.maxLng)/2;
  const spanLat = Math.max((b.maxLat-b.minLat)*factor, 0.002);
  const spanLng = Math.max((b.maxLng-b.minLng)*factor, 0.002);
  return { minLat:cLat-spanLat/2, maxLat:cLat+spanLat/2, minLng:cLng-spanLng/2, maxLng:cLng+spanLng/2 };
}

// mesma paleta/lógica de recoloração do index.html — ver comentários lá
const MONO_COLORS = {
  background: '#ececec', water: '#f8f8f8', landuse: '#ececec',
  building: '#ececec', buildingOutline: '#ececec',
  road: '#ffffff', roadCasing: '#ffffff', boundary: '#cccccc',
  text: '#111111', textHalo: '#ffffff'
};
function applyMonochromeStyle(mlMap){
  const layers = mlMap.getStyle().layers || [];
  let buildingSource = null, buildingSourceLayer = null;
  let firstSymbolId = null;
  layers.forEach(layer => {
    const id = layer.id.toLowerCase();
    const sl = (layer['source-layer'] || '').toLowerCase();
    const isWater = id.includes('water') || sl.includes('water');
    const isBuilding = sl === 'building' || id.includes('building');
    const isRoad = sl === 'transportation' && layer.type === 'line';
    const isCasing = id.includes('casing');
    const isBoundary = sl === 'boundary';
    if (isBuilding && layer.type === 'fill'){ buildingSource = layer.source; buildingSourceLayer = layer['source-layer']; }
    if (layer.type === 'symbol' && firstSymbolId === null){ firstSymbolId = layer.id; }
    try{
      if (layer.type === 'fill-extrusion'){
        mlMap.setLayoutProperty(layer.id, 'visibility', 'none');
      } else if (layer.type === 'background'){
        mlMap.setPaintProperty(layer.id, 'background-color', MONO_COLORS.background);
      } else if (layer.type === 'fill'){
        const color = isWater ? MONO_COLORS.water : (isBuilding ? MONO_COLORS.building : MONO_COLORS.landuse);
        mlMap.setPaintProperty(layer.id, 'fill-color', color);
      } else if (layer.type === 'line'){
        let color = MONO_COLORS.landuse;
        if (isWater) color = MONO_COLORS.water;
        else if (isBoundary) color = MONO_COLORS.boundary;
        else if (isRoad) color = isCasing ? MONO_COLORS.roadCasing : MONO_COLORS.road;
        mlMap.setPaintProperty(layer.id, 'line-color', color);
      } else if (layer.type === 'symbol'){
        const isGenericPoi = sl === 'poi' && /^poi_r\d+$/.test(id);
        const isTransitPoi = id === 'poi_transit';
        if (isGenericPoi || isTransitPoi){
          mlMap.setLayoutProperty(layer.id, 'visibility', 'none');
          return;
        }
        mlMap.setPaintProperty(layer.id, 'text-color', MONO_COLORS.text);
        mlMap.setPaintProperty(layer.id, 'text-halo-color', MONO_COLORS.textHalo);
        mlMap.setPaintProperty(layer.id, 'icon-opacity', 0);
      }
    } catch(e){ /* propriedade pode não existir nessa camada específica — ignora */ }
  });
  if (buildingSource && !mlMap.getLayer('building_outline_xerox')){
    mlMap.addLayer({
      id: 'building_outline_xerox', type: 'line',
      source: buildingSource, 'source-layer': buildingSourceLayer,
      paint: { 'line-color': MONO_COLORS.buildingOutline, 'line-width': 1 }
    }, firstSymbolId || undefined);
  }
}

let mlMap = null; // instância MapLibre viva — pixelOf() projeta através dela
function pixelOf(lat, lon){
  const p = mlMap.project([lon, lat]);
  return { x: MAP_BOX.x + p.x, y: MAP_BOX.y + p.y };
}

let basemapCanvas = null;
let basemapLoading = false;
async function buildBasemapMapLibre(bounds, margin){
  if (basemapLoading) return;
  basemapLoading = true;
  const expanded = expandBounds(bounds, 1.0);
  if (mlMap){ mlMap.remove(); mlMap = null; }

  const container = document.getElementById('map-offscreen');
  container.style.width = MAP_BOX.w + 'px';
  container.style.height = MAP_BOX.h + 'px';
  container.innerHTML = '';

  mlMap = new maplibregl.Map({
    container,
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [(expanded.minLng+expanded.maxLng)/2, (expanded.minLat+expanded.maxLat)/2],
    zoom: 15,
    pitch: 0,
    maxPitch: 0,
    attributionControl: false,
    interactive: false,
    // sem isso o WebGL limpa o buffer de desenho antes da gente conseguir
    // ler os pixels via drawImage — necessário pra capturar o canvas depois
    preserveDrawingBuffer: true
  });

  await new Promise(resolve => mlMap.on('load', resolve));
  applyMonochromeStyle(mlMap);
  mlMap.fitBounds(
    [[expanded.minLng, expanded.minLat], [expanded.maxLng, expanded.maxLat]],
    { padding: margin, duration: 0 }
  );
  // 'idle' garante que o estilo recolorido E o enquadramento (fitBounds)
  // já renderizaram pelo menos um quadro antes da gente projetar pontos
  // (pixelOf) ou capturar o canvas
  await new Promise(resolve => mlMap.once('idle', resolve));

  const off = document.createElement('canvas');
  off.width = MAP_BOX.w; off.height = MAP_BOX.h;
  const octx = off.getContext('2d');
  octx.drawImage(mlMap.getCanvas(), 0, 0, MAP_BOX.w, MAP_BOX.h);
  basemapCanvas = off;
  basemapLoading = false;
}

/* ============================================================
   caminho reto/curvo entre dois pontos, comprimento, sub-trechos
   ============================================================ */
function computeFitTransform(points, box, fillFraction){
  const xs = points.map(p=>p.x), ys = points.map(p=>p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const w = (maxX-minX) || 1, h = (maxY-minY) || 1;
  const scale = Math.min(box.w*fillFraction/w, box.h*fillFraction/h);
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  const boxCx = box.x + box.w/2, boxCy = box.y + box.h/2;
  return { scale, cx, cy, boxCx, boxCy };
}
function applyFitTransform(points, t){
  return points.map(p => ({ ...p, x: t.boxCx + (p.x-t.cx)*t.scale, y: t.boxCy + (p.y-t.cy)*t.scale }));
}
function buildLegPath(a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  if (Math.random() < 0.35 || len < 90){
    return [ { x:a.x, y:a.y }, { x:b.x, y:b.y } ];
  }
  const nx = -dy/len, ny = dx/len;
  const side = Math.random() < 0.5 ? 1 : -1;
  const offset = len * (0.08 + Math.random()*0.14) * side;
  const mx = (a.x+b.x)/2 + nx*offset;
  const my = (a.y+b.y)/2 + ny*offset;
  const N = Math.max(18, Math.round(len/16));
  const pts = [];
  for (let i=0;i<=N;i++){
    const t = i/N;
    const it = 1-t;
    pts.push({
      x: it*it*a.x + 2*it*t*mx + t*t*b.x,
      y: it*it*a.y + 2*it*t*my + t*t*b.y
    });
  }
  return pts;
}
function pathLength(points){
  let len = 0;
  for (let i=1;i<points.length;i++) len += Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
  return len;
}
function pointAtDistance(points, dist){
  let d = 0;
  for (let i = 1; i < points.length; i++){
    const seg = Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
    if (d + seg >= dist){
      const t = seg === 0 ? 0 : (dist-d)/seg;
      return {
        x: points[i-1].x + (points[i].x-points[i-1].x)*t,
        y: points[i-1].y + (points[i].y-points[i-1].y)*t,
        angle: Math.atan2(points[i].y-points[i-1].y, points[i].x-points[i-1].x)
      };
    }
    d += seg;
  }
  const last = points[points.length-1];
  return { x:last.x, y:last.y, angle:0 };
}
// sub-trecho do INÍCIO até `dist`
function subPathUpTo(points, dist){
  const out = [points[0]];
  let d = 0;
  for (let i = 1; i < points.length; i++){
    const seg = Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
    if (d + seg >= dist){
      const t = seg === 0 ? 0 : (dist-d)/seg;
      out.push({ x: points[i-1].x + (points[i].x-points[i-1].x)*t, y: points[i-1].y + (points[i].y-points[i-1].y)*t });
      return out;
    }
    out.push(points[i]);
    d += seg;
  }
  return out;
}
// sub-trecho de `dist` até o FIM — o espelho do de cima; é o que permite
// "apagar" o traço a partir do ponto onde a cobrinha começou a desenhar
function subPathFrom(points, dist){
  if (dist <= 0) return points;
  let d = 0;
  for (let i = 1; i < points.length; i++){
    const seg = Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
    if (d + seg >= dist){
      const t = seg === 0 ? 0 : (dist-d)/seg;
      const cut = { x: points[i-1].x + (points[i].x-points[i-1].x)*t, y: points[i-1].y + (points[i].y-points[i-1].y)*t };
      return [cut, ...points.slice(i)];
    }
    d += seg;
  }
  return [points[points.length-1]];
}
// trecho visível entre duas distâncias absolutas ao longo do caminho
function extractRange(points, dStart, dEnd){
  return subPathFrom(subPathUpTo(points, dEnd), dStart);
}
function shuffledIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for (let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

const RENDER_SCALE = 2;
// muda a altura do artboard conforme o formato (a largura nunca muda) —

// posições que dependem da altura (infos secundárias, ancoradas na base)
function applyCanvasFormat(){

// calcula width/height reais do frame na tela em px, sempre preservando a
// proporção do artboard (LOGICAL_W:LOGICAL_H) dentro do espaço disponível —
// feito em JS porque CSS puro (height fixo + max-width) não ajusta a altura
// quando é a largura que aperta primeiro, e o quadrado acaba virando retângulo
function resizeCanvasFrame(){
  const maxW = Math.min(window.innerWidth * 0.9, 640);
  const maxH = Math.min(window.innerHeight * 0.78, 760);
  const ratio = LOGICAL_W / LOGICAL_H;
  let w = maxW, h = w / ratio;
  if (h > maxH){ h = maxH; w = h * ratio; }
  canvasFrameEl.style.width = w + 'px';
  canvasFrameEl.style.height = h + 'px';
}

function drawTitleLayer(ctx2d){

}
function drawStatsLayer(ctx2d){

}
// mesmo tratamento visual do .pin/.pin::before do site (index.html): sem
// anel/contorno sólido — miolo com borda suave via blur, na mesma proporção
// do CSS (inset:2px + blur:2px numa base de 24px de diâmetro/12px de raio),
// escalada pro raio de cada pino aqui (r=15)
function drawPinsLayer(ctx2d, pins){
  const theme = THEMES[currentTheme];
  const r = 15, coreR = r * (10/12), blurPx = r * (2/12);
  (pins || PTS).forEach((p) => {
    ctx2d.save();
    ctx2d.filter = `blur(${blurPx.toFixed(2)}px)`;
    ctx2d.beginPath();
    ctx2d.arc(p.x, p.y, coreR, 0, Math.PI*2);
    ctx2d.fillStyle = theme.mark;
    ctx2d.fill();
    ctx2d.restore();
    ctx2d.fillStyle = theme.bg;
    ctx2d.font = "12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
    ctx2d.textAlign = 'center'; ctx2d.textBaseline = 'middle';
    ctx2d.fillText(String(alphaNum[p.id]).padStart(2,'0'), p.x, p.y+0.5);
    ctx2d.textAlign = 'left'; ctx2d.textBaseline = 'alphabetic';
  });
}
// "negativo": onde a fita cruza o título, revela o título na cor do fundo —
// como se a fita fosse uma máscara pra uma versão invertida do texto por baixo
function applyTitleNegativeMask(ctx2d, visiblePoints){
  if (!visiblePoints || visiblePoints.length < 2) return;
  const theme = THEMES[currentTheme];
  const off = document.createElement('canvas');
  off.width = LOGICAL_W; off.height = LOGICAL_H;
  const octx = off.getContext('2d');
  octx.fillStyle = theme.bg;
  octx.textAlign = 'center'; octx.textBaseline = 'alphabetic';
  octx.font = `${EVT_TITLE_SIZE}px 'Instrument Serif', Georgia, serif`;
  octx.fillText(EVT_TITLE_L1, EVT_TITLE_X, EVT_TITLE_Y1);
  octx.font = `italic ${EVT_TITLE_SIZE}px 'Instrument Serif', Georgia, serif`;
  octx.fillText(EVT_TITLE_L2, EVT_TITLE_X, EVT_TITLE_Y2);
  octx.globalCompositeOperation = 'destination-in';
  octx.lineWidth = MARK_WIDTH;
  octx.lineCap = 'round';
  octx.lineJoin = 'round';
  octx.strokeStyle = '#000';
  octx.beginPath();
  visiblePoints.forEach((p, i) => { if (i === 0) octx.moveTo(p.x, p.y); else octx.lineTo(p.x, p.y); });
  octx.stroke();
  ctx2d.drawImage(off, 0, 0, LOGICAL_W, LOGICAL_H);
}
// texto seguindo o caminho — mesmo estilo alternado (sans em caixa alta /
// serifado com a data em itálico) da fita do gerador de marca e do post do
// evento. Calculado sempre a partir da distância absoluta 0..total — assim,
// ao "apagar" o começo (dStart > 0), os caracteres que continuam visíveis
// não mudam de posição (sem reflow)
const RIBBON_SEP = '   ·   ';
function buildRibbonRuns(serifFontSize){
  function xAscent(fontSize, fontFamily, weight){
    ctx.font = `${weight ? weight+' ' : ''}${fontSize}px ${fontFamily}`;
    return ctx.measureText('x').actualBoundingBoxAscent;
  }
  const serifFamily = "'Instrument Serif', Georgia, serif";
  const serifAscent = xAscent(serifFontSize, serifFamily, '400');
  const sansAscentAtSerifSize = xAscent(serifFontSize, SANS_DISPLAY, '350');
  const sansFontSize = serifFontSize * (serifAscent / sansAscentAtSerifSize) * 0.85;
  const sansLabel = LABEL_L;
  return [
    { text: sansLabel, fontFamily: SANS_DISPLAY, weight:'350', fontSize: sansFontSize },
    { text: RIBBON_SEP, fontFamily: SANS_DISPLAY, weight:'350', fontSize: sansFontSize },
    { text: `${EVENT_EYEBROW} `, fontFamily: serifFamily, weight:'400', fontSize: serifFontSize },
    { text: EVENT_DATES, fontFamily: serifFamily, weight:'400', fontSize: serifFontSize, italic:true },
    { text: RIBBON_SEP, fontFamily: serifFamily, weight:'400', fontSize: serifFontSize }
  ];
}
function drawRibbonAlongRange(ctx2d, points, serifFontSize, dStart, dEnd, color){
  const total = pathLength(points);
  if (total < serifFontSize) return;
  const runs = buildRibbonRuns(serifFontSize);
  const chars = [];
  runs.forEach(run => { for (const ch of run.text) chars.push({ ch, run }); });
  ctx2d.fillStyle = color;
  ctx2d.textAlign = 'left'; ctx2d.textBaseline = 'middle';
  let d = 0, charPos = 0, safety = 0;
  while (d < total && safety < 4000){
    const item = chars[charPos % chars.length];
    const run = item.run;
    ctx2d.font = `${run.italic ? 'italic ' : ''}${run.weight ? run.weight+' ' : ''}${run.fontSize}px ${run.fontFamily}`;
    const w = ctx2d.measureText(item.ch).width;
    if (d >= dStart && d <= dEnd){
      const pt = pointAtDistance(points, d);
      ctx2d.save();
      ctx2d.translate(pt.x, pt.y);
      ctx2d.rotate(pt.angle);
      ctx2d.fillText(item.ch, 0, 0);
      ctx2d.restore();
    }
    d += w;
    charPos++;
    safety++;
  }
}
// desenha as pernas (legs) de uma marca, cada uma só na faixa visível
// [dStart,dEnd] — usado tanto na "troca de marcas" (dStart=0) quanto no
// "circuito vivo" (dStart avança conforme a cobrinha se apaga)
function strokeLegsInRange(ctx2d, legs, dStart, dEnd){
  const theme = THEMES[currentTheme];
  let offset = 0;
  legs.forEach(leg => {
    if (leg.length < 2) { return; }
    const legLen = pathLength(leg);
    const localStart = Math.max(0, dStart - offset);
    const localEnd = Math.min(legLen, dEnd - offset);
    if (localEnd > localStart){
      const sub = extractRange(leg, localStart, localEnd);
      if (sub.length >= 2){
        ctx2d.lineWidth = MARK_WIDTH;
        ctx2d.lineCap = 'round';
        ctx2d.lineJoin = 'round';
        if (markFill === 'degrade'){
          const a = leg[0], b = leg[leg.length-1];
          const grad = ctx2d.createLinearGradient(a.x, a.y, b.x, b.y);
          grad.addColorStop(0, '#000000');
          grad.addColorStop(1, '#ffffff');
          ctx2d.strokeStyle = grad;
        } else {
          ctx2d.strokeStyle = theme.mark;
        }
        ctx2d.beginPath();
        sub.forEach((p,i) => { if (i===0) ctx2d.moveTo(p.x,p.y); else ctx2d.lineTo(p.x,p.y); });
        ctx2d.stroke();
      }
    }
    offset += legLen;
  });
}
function flattenLegs(legs){
  const out = [];
  legs.forEach(leg => { if (leg.length) out.push(...(out.length ? leg.slice(1) : leg)); });
  return out;
}
function totalLegsLength(legs){ return legs.reduce((s,leg) => s + pathLength(leg), 0); }

/* ============================================================
   tipo 1 — "troca de marcas": mesma lógica de antes (marca
   fechada aleatória, fit numa caixa, trocando a cada 500ms)
   ============================================================ */
const SLIDE_COUNT = 20;
const SLIDE_MS = 500;

function buildRandomMark(){
  const order = [...PTS].sort(() => Math.random()-0.5);
  const closed = [...order, order[0]];
  const rawLegs = [];
  for (let i = 1; i < closed.length; i++) rawLegs.push(buildLegPath(closed[i-1], closed[i]));
  // o enquadramento usa só os pontos reais (order), não as curvas dos
  // trechos — essas variam a cada troca (reta ou curva, sorteado em
  // buildLegPath), e enquadrar por elas faria os pinos "balançarem" de
  // quadro em quadro mesmo representando os mesmos endereços
  const t = computeFitTransform(order, MAP_BOX, 0.82);
  const legs = rawLegs.map(leg => applyFitTransform(leg, t));
  const pins = applyFitTransform(order, t);
  return { legs, pins };
}

let currentMarca = null;
function drawMarcasFrame(ctx2d, mark){
  currentMarca = mark;
  drawBaseLayer(ctx2d);
  drawTitleLayer(ctx2d);
  const total = totalLegsLength(mark.legs);
  strokeLegsInRange(ctx2d, mark.legs, 0, total);
  const flat = flattenLegs(mark.legs);
  if (showText) drawRibbonAlongRange(ctx2d, flat, 20, 0, total, THEMES[currentTheme].bg);
  applyTitleNegativeMask(ctx2d, flat);
  drawPinsLayer(ctx2d, mark.pins);
  drawStatsLayer(ctx2d);
}

let marcasTimer = null;
function startMarcasPreview(){
  stopAllLoops();
  const first = buildRandomMark();
  drawMarcasFrame(ctx, first);
  marcasTimer = setInterval(() => drawMarcasFrame(ctx, buildRandomMark()), SLIDE_MS);

/* ============================================================
   tipo 2 — "circuito vivo": a cobrinha começa a se desenhar já
   saindo de um dos pontos do mapa (sem entrar de fora da tela) e,
   ao terminar, se apaga a partir do ponto onde começou — quando
   some por completo, recomeça de outro ponto aleatório.
   Desenhar continua trecho a trecho, cada um "estalando" no seu
   próprio tempo (ease-out forte, tipo elástico sendo esticado aos
   poucos). Apagar é o oposto: o circuito inteiro some de uma vez só,
   num movimento único e rápido — como o elástico já tensionado
   sendo solto de verdade, não vários pedacinhos soltando um a um.
   ============================================================ */
const LEG_DURATION = 0.32; // s — tempo de cada trecho ao desenhar (independe da distância real)
const ERASE_DURATION = 3; // s — tempo do circuito INTEIRO ao apagar, num movimento só
const CIRCUITO_RECORD_CYCLES = 3; // ao gravar vídeo, dura o equivalente a 3 circuitos completos (desenha+apaga)
function easeOutSnap(t){ return t >= 1 ? 1 : 1 - Math.pow(2, -10*t); } // dispara rápido, desacelera forte no fim

function buildTourLegs(){
  const order = shuffledIndices(PTS_TOUR.length);
  const legs = [];
  for (let i = 1; i < order.length; i++) legs.push(buildLegPath(PTS_TOUR[order[i-1]], PTS_TOUR[order[i]]));
  return legs;
}

let circuitoLegs = [];
let circuitoFlat = [];
let circuitoTotal = 0;
let circuitoLegOffsets = []; // distância acumulada até o início de cada trecho
let circuitoLegIndex = 0;
let circuitoLegElapsed = 0; // segundos decorridos no trecho atual (fase de desenho)
let circuitoEraseElapsed = 0; // segundos decorridos apagando o circuito inteiro (fase de apagar)
let circuitoProgress = 0; // distância absoluta revelada (fase de desenho)
let circuitoErase = 0;    // distância absoluta consumida a partir do início (fase de apagar)
let circuitoPhase = 'drawing'; // drawing | erasing
let circuitoRafId = null;
let circuitoLastTs = null;
let circuitoRecording = false;
let circuitoCyclesRemaining = 0; // quantos ciclos (desenha+apaga) ainda faltam gravar
let circuitoOnCycleEnd = null; // callback chamado quando termina o ÚLTIMO ciclo gravado

function startCircuitoCycle(){
  circuitoLegs = buildTourLegs();
  circuitoFlat = flattenLegs(circuitoLegs);
  circuitoTotal = totalLegsLength(circuitoLegs);
  circuitoLegOffsets = [];
  let acc = 0;
  circuitoLegs.forEach(leg => { circuitoLegOffsets.push(acc); acc += pathLength(leg); });
  circuitoLegIndex = 0;
  circuitoLegElapsed = 0;
  circuitoEraseElapsed = 0;
  circuitoProgress = 0;
  circuitoErase = 0;
  circuitoPhase = 'drawing';
  circuitoLastTs = null;
  if (!circuitoRafId) circuitoRafId = requestAnimationFrame(circuitoLoop);
}

// avança o trecho/tempo atual da fase de desenho e devolve a distância
// absoluta já revelada até agora, mais um aviso de quando o último
// trecho terminou seu estalo
function advanceLegs(dt){
  circuitoLegElapsed += dt;
  let t = Math.min(1, circuitoLegElapsed / LEG_DURATION);
  while (t >= 1 && circuitoLegIndex < circuitoLegs.length - 1){
    circuitoLegIndex++;
    circuitoLegElapsed -= LEG_DURATION;
    t = Math.min(1, Math.max(0, circuitoLegElapsed) / LEG_DURATION);
  }
  const legLen = pathLength(circuitoLegs[circuitoLegIndex]);
  const dist = circuitoLegOffsets[circuitoLegIndex] + easeOutSnap(t) * legLen;
  const finished = t >= 1 && circuitoLegIndex === circuitoLegs.length - 1;
  return { dist, finished };
}

function circuitoLoop(ts){
  circuitoRafId = requestAnimationFrame(circuitoLoop);
  if (circuitoLastTs == null) circuitoLastTs = ts;
  const dt = Math.min(0.1, (ts - circuitoLastTs) / 1000);
  circuitoLastTs = ts;

  if (circuitoPhase === 'drawing'){
    const { dist, finished } = advanceLegs(dt);
    circuitoProgress = dist;
    if (finished){
      circuitoPhase = 'erasing';
      circuitoEraseElapsed = 0;
    }
  } else {
    circuitoEraseElapsed += dt;
    const t = Math.min(1, circuitoEraseElapsed / ERASE_DURATION);
    circuitoErase = easeOutSnap(t) * circuitoTotal;
    if (t >= 1){
      if (circuitoRecording){
        circuitoCyclesRemaining--;
        if (circuitoCyclesRemaining <= 0){
          cancelAnimationFrame(circuitoRafId); circuitoRafId = null;
          circuitoErase = circuitoTotal;
          drawCircuitoFrame();
          if (circuitoOnCycleEnd) circuitoOnCycleEnd();
          return;
        }
      }
      startCircuitoCycle();
      return;
    }
  }
  drawCircuitoFrame();
}

function drawCircuitoFrame(){
  const dStart = circuitoPhase === 'erasing' ? circuitoErase : 0;
  const dEnd = circuitoPhase === 'erasing' ? circuitoTotal : circuitoProgress;
  drawBaseLayer(ctx);
  drawTitleLayer(ctx);
  strokeLegsInRange(ctx, circuitoLegs, dStart, dEnd);
  if (showText) drawRibbonAlongRange(ctx, circuitoFlat, 20, dStart, dEnd, THEMES[currentTheme].bg);
  const visible = extractRange(circuitoFlat, dStart, dEnd);
  applyTitleNegativeMask(ctx, visible);
  drawPinsLayer(ctx, PTS_TOUR);
  drawStatsLayer(ctx);

  if (circuitoPhase === 'drawing' && circuitoProgress < circuitoTotal){
    const head = pointAtDistance(circuitoFlat, circuitoProgress);
    const pulse = 1 + Math.sin(performance.now()/260) * 0.18;
    ctx.beginPath();
    ctx.arc(head.x, head.y, 11*pulse, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(head.x, head.y, 5.5, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }
}

/* ============================================================
   troca entre tipos + reinício da prévia
   ============================================================ */
function stopAllLoops(){
  if (marcasTimer){ clearInterval(marcasTimer); marcasTimer = null; }
  if (circuitoRafId){ cancelAnimationFrame(circuitoRafId); circuitoRafId = null; }
}
function redrawNow(){
  if (videoTipo === 'marcas' && currentMarca) drawMarcasFrame(ctx, currentMarca);
  // no modo circuito o próprio rAF já redesenha a cada quadro
}
function startPreview(){
  stopAllLoops();
  circuitoRecording = false;
  if (videoTipo === 'marcas') startMarcasPreview();
  else startCircuitoCycle();
}

const tipoMarcasBtn = document.getElementById('tipo-marcas');
const tipoCircuitoBtn = document.getElementById('tipo-circuito');
function setVideoTipo(t){
  videoTipo = t;
  tipoMarcasBtn.classList.toggle('active', t === 'marcas');
  tipoCircuitoBtn.classList.toggle('active', t === 'circuito');
  tipoNote.textContent = t === 'marcas'
    ? 'marcas fechadas aleatórias, trocando a cada meio segundo — como um gif.'
    : 'a cobrinha desenha o circuito real no mapa, do começo ao fim, depois se apaga a partir de onde começou e recomeça de outro ponto.';
  startPreview();
}
document.getElementById('tipo-row').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tipo]');
  if (!btn) return;
  setVideoTipo(btn.dataset.tipo);
});
const formatoQuadradoBtn = document.getElementById('formato-quadrado');
const formatoStoriesBtn = document.getElementById('formato-stories');
document.getElementById('formato-row').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-formato]');
  if (!btn || btn.dataset.formato === videoFormat) return;
  videoFormat = btn.dataset.formato;
  formatoQuadradoBtn.classList.toggle('active', videoFormat === 'quadrado');
  formatoStoriesBtn.classList.toggle('active', videoFormat === 'stories');
  stopAllLoops();
  applyCanvasFormat();
  // a projeção do mapa (zoom/origem) e o enquadramento do fit dependem do
  // formato do artboard — recalcula tudo e reinicia a prévia
  if (LOCATIONS.length) await setupFromLocations();
});

/* ============================================================
   gravação (compartilhada pelos dois tipos)
   ============================================================ */
btnGerarVideo.addEventListener('click', () => {
  if (!('MediaRecorder' in window)){
    setStatus('Este navegador não suporta gravação de vídeo (tente no Chrome ou Firefox).', true);
    return;
  }
  stopAllLoops();

  let stream, recorder, isMp4 = false;
  try{
    stream = canvas.captureStream(30);
    const mimeCandidates = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    const mimeType = mimeCandidates.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
    // bug real: todo mimeType candidato começa com "video/", então
    // `.indexOf('mp4') === 0` nunca era verdadeiro — isMp4 ficava sempre
    // false, mesmo quando o navegador gravava mp4/h264 de verdade (visto e
    // confirmado com ffprobe: bytes reais eram h264/mp4 válido, mas o Blob
    // saía marcado como "video/webm", só o nome do arquivo é que dizia
    // .mp4 — um Content-Type incoerente com o conteúdo real do arquivo)
    isMp4 = mimeType.includes('mp4');
    // bitrate alto de propósito — sem isso o MediaRecorder escolhe uma taxa
    // baixa por padrão, que borra bastante o texto fino da fita no vídeo final
    const recOptions = { videoBitsPerSecond: 16000000 };
    if (mimeType) recOptions.mimeType = mimeType;
    recorder = new MediaRecorder(stream, recOptions);
  } catch(err){
    setStatus('Não foi possível iniciar a gravação neste navegador.', true);
    return;
  }

  const chunks = [];
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    recDot.classList.remove('on');
    btnGerarVideo.disabled = false;
    // salva sempre como .mp4, mesmo nos navegadores que só gravam webm por
    // dentro (Chrome/Firefox) — testado e confirmado que sobe normal no
    // Instagram assim, sem precisar converter de verdade
    const blob = new Blob(chunks, { type: isMp4 ? 'video/mp4' : 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `circuito-video-${videoTipo}-${videoFormat}.mp4`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    setStatus('vídeo pronto (.mp4) — já dá pra postar direto no Instagram.');
    startPreview();
  };

  btnGerarVideo.disabled = true;
  recDot.classList.add('on');
  setStatus('gravando o vídeo…');

  if (videoTipo === 'marcas'){
    const slides = [];
    for (let i = 0; i < SLIDE_COUNT; i++) slides.push(buildRandomMark());
    recorder.start();
    let i = 0;
    drawMarcasFrame(ctx, slides[0]);
    const interval = setInterval(() => {
      i++;
      if (i >= SLIDE_COUNT){ clearInterval(interval); recorder.stop(); return; }
      drawMarcasFrame(ctx, slides[i]);
    }, SLIDE_MS);
  } else {
    circuitoRecording = true;
    circuitoCyclesRemaining = CIRCUITO_RECORD_CYCLES;
    circuitoOnCycleEnd = () => recorder.stop();
    recorder.start();
    startCircuitoCycle();
  }
});

/* ============================================================
   boot
   ============================================================ */
// ---------------- geocodificação automática (fallback) ----------------
// mesma lógica do index.html: endereços sem lat/lng na planilha são
// resolvidos via Nominatim (gratuito) em segundo plano, sem travar o
// carregamento inicial com o que já está disponível
async function geocodeAddress(query){
  try{
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('geocode http error ' + res.status);
    const results = await res.json();
    if (results && results.length){
      return { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) };
    }
  } catch(err){
    console.warn('Falha ao geocodificar endereço:', query, err);
  }
  return null;
}
async function resolveMissingCoordinates(){
  const pending = LOCATIONS.filter(l => (l.lat == null || l.lng == null) && !/confirmar/i.test(l.endereco));
  let resolvedAny = false;
  for (const loc of pending){
    const query = `${loc.endereco}, Centro, Rio de Janeiro, Brasil`;
    const coords = await geocodeAddress(query);
    if (coords){
      loc.lat = coords.lat;
      loc.lng = coords.lng;
      resolvedAny = true;
    }
    await new Promise(r => setTimeout(r, 1100));
  }
  // só atualiza os pontos do mapa UMA VEZ, depois de resolver todos os
  // endereços pendentes — não a cada um. Refazer o basemap (MapLibre/WebGL)
  // é pesado, e refazer isso a cada endereço travava a prévia/gravação em
  // andamento por vários segundos repetidas vezes. startNow=false: não
  // interrompe nada que já esteja rodando (ver comentário em
  // setupFromLocations) — o ponto novo entra a partir do próximo ciclo.
  if (resolvedAny) await setupFromLocations(false);
}

async function setupFromLocations(startNow = true){
  const withCoords = LOCATIONS.filter(l => l.lat != null && l.lng != null);
  if (withCoords.length < 3){
    setStatus('poucos ateliês com coordenadas preenchidas ainda — é preciso pelo menos 3 pra fechar um circuito.', true);
    return;
  }
  setStatus('');
  const bounds = {
    minLat: Math.min(...withCoords.map(l=>l.lat)),
    maxLat: Math.max(...withCoords.map(l=>l.lat)),
    minLng: Math.min(...withCoords.map(l=>l.lng)),
    maxLng: Math.max(...withCoords.map(l=>l.lng)),
  };
  // sempre carrega o mapa (mesmo com "esconder mapa" ativo) — pixelOf()
  // depende da instância viva do MapLibre pra projetar os pontos, então
  // precisamos dela de qualquer jeito; o toggle só decide se o resultado
  // aparece desenhado (ver drawBaseLayer)
  setStatus('carregando mapa…');
  await buildBasemapMapLibre(bounds, 45);
  setStatus('');

  PTS = withCoords.map(loc => ({ ...pixelOf(loc.lat, loc.lng), id: loc.id }));
  // cobrinha ("circuito vivo") usa o mesmo enquadramento do "troca de
  // marcas" — mesma escala/zoom visual nos dois tipos de vídeo
  const tourFit = computeFitTransform(PTS, MAP_BOX, 0.82);
  PTS_TOUR = applyFitTransform(PTS, tourFit);

  // numerado entre TODOS os endereços da planilha (não só os com coordenada
  // já preenchida) — mesmo critério do index.html, senão o número de um
  // ponto aqui diverge do número mostrado no site conforme endereços novos
  // vão sendo geocodificados em momentos diferentes
  const sortedForNum = [...LOCATIONS].sort((a,b) =>
    (a.local||a.endereco).localeCompare(b.local||b.endereco, 'pt-BR', {sensitivity:'base'}));
  alphaNum = {};
  sortedForNum.forEach((loc,i) => { alphaNum[loc.id] = i+1; });

  // startNow=false acontece quando um endereço termina de ser geocodificado
  // em segundo plano (resolveMissingCoordinates) bem depois do carregamento
  // inicial: só queremos que PTS/PTS_TOUR fiquem atualizados (o próximo
  // ciclo da cobrinha já passa a incluir o ponto novo), sem reiniciar nada
  // que já esteja rodando — senão uma prévia ou gravação em andamento é
  // interrompida do nada (era a causa da cobrinha "sumir" no meio do
  // circuito e do vídeo às vezes nunca terminar de gravar)
  if (startNow) setVideoTipo('circuito');
}

async function boot(){
  try{
    await Promise.all([
      document.fonts.load(`${EVT_TITLE_SIZE}px 'Instrument Serif'`),
      document.fonts.load(`italic ${EVT_TITLE_SIZE}px 'Instrument Serif'`),
      document.fonts.load(`${STATS_SIZE}px 'Instrument Serif'`),
      document.fonts.load("20px 'Instrument Serif'"),
      document.fonts.load(`${LABEL_WEIGHT} 100px 'Inter'`),
      document.fonts.load(`350 20px 'Inter'`)
    ]);
  } catch(e){}
  computeLabelSize();
  try{
    LOCATIONS = await loadLocationsFromSheet();
  } catch(err){
    console.error(err);
    setStatus('Não foi possível carregar os dados da planilha agora. Recarregue a página em instantes.', true);
    return;
  }

  numAddresses = LOCATIONS.length;
  numArtists = LOCATIONS.reduce((sum, l) => sum + l.artistas.length, 0);

  await setupFromLocations();
  resolveMissingCoordinates();
}
boot();
