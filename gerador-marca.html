<script>
/* ============================================================
   dados
   ============================================================ */
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1Zjux0r3uVJ8ua1ZXpWd68lOSP5Kj0XkU/gviz/tq?tqx=out:csv&sheet=Circuito';
const LOGICAL = 1000;
const FONT_IMPORT = "https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap";
const EVENT_TITLE = 'Circuito de Ateliês do Centro';
const EVENT_EYEBROW = 'Ateliês abertos';
const EVENT_DATES = '18 – 19 de Setembro';
const EVENT_EYEBROW_DATE = `${EVENT_EYEBROW}: ${EVENT_DATES}`;

// estimativa de largura do texto (fontes serifadas ~0.52× o tamanho por
// caractere) — só pra centralizar a composição, não precisa ser exata
const measureCanvas = document.createElement('canvas');
const measureCtx = measureCanvas.getContext('2d');
function estimateTextWidth(text, fontSize){
  measureCtx.font = `${fontSize}px 'Instrument Serif', Georgia, serif`;
  return measureCtx.measureText(text).width;
}

// marca completa — vertical: símbolo bem grande e grosso, nas mesmas
// proporções do gerador de símbolo, com o texto logo abaixo; grupo
// inteiro centralizado no artboard
const SYMBOL_V_SIZE = 640;
const SYMBOL_V_STROKE = 35;
const TITLE_SIZE_V = 64;
const EYEBROW_SIZE_V = 64;
const DATE_SIZE_V = 64;
const GAP_V = 10; // distância real entre a ponta de baixo do símbolo e a tipografia
const TITLE_LEAD_V = 62;
const DATE_GAP_V = 66;
const TEXT_BLOCK_H_V = (TITLE_SIZE_V*0.72) + TITLE_LEAD_V + DATE_GAP_V + DATE_GAP_V + (DATE_SIZE_V*0.25);
const GROUP_H_V = SYMBOL_V_SIZE + GAP_V + TEXT_BLOCK_H_V;
const GROUP_TOP_V = (LOGICAL - GROUP_H_V) / 2;
const MARK_BOX_V = { x: (LOGICAL - SYMBOL_V_SIZE)/2, y: GROUP_TOP_V, w: SYMBOL_V_SIZE, h: SYMBOL_V_SIZE };
const TITLE_X_V = MARK_BOX_V.x;
const TEXT_TOP_V = MARK_BOX_V.y + SYMBOL_V_SIZE + GAP_V;
const TITLE_V_Y1 = TEXT_TOP_V + TITLE_SIZE_V*0.72;
const TITLE_V_Y2 = TITLE_V_Y1 + TITLE_LEAD_V;
const EYEBROW_V_Y = TITLE_V_Y2 + DATE_GAP_V;
const DATE_V_Y = EYEBROW_V_Y + DATE_GAP_V;

// marca completa — horizontal: exatamente a marca vertical (mesma
// tipografia, mesmo espaçamento), só que com o símbolo 20% menor e o
// texto ao lado em vez de embaixo, os dois centralizados pela altura
// marca completa — horizontal: símbolo ligeiramente maior que o texto,
// composição inteira centralizada no artboard
const SYMBOL_H_SIZE = 380;
const SYMBOL_H_STROKE = 18;
const TITLE_SIZE_H = 56;
const DATE_SIZE_H = 44;
const GAP_H = 30;
let TEXT_W_H, TOTAL_W_H, START_X_H, MARK_BOX_H, TITLE_X_H, TITLE_Y_H, DATE_Y_H;
function computeHorizontalLayout(){
  TEXT_W_H = Math.max(estimateTextWidth(EVENT_TITLE, TITLE_SIZE_H), estimateTextWidth(EVENT_EYEBROW_DATE, TITLE_SIZE_H));
  TOTAL_W_H = SYMBOL_H_SIZE + GAP_H + TEXT_W_H;
  START_X_H = Math.max(15, (LOGICAL - TOTAL_W_H) / 2);
  MARK_BOX_H = { x: START_X_H, y: LOGICAL/2 - SYMBOL_H_SIZE/2, w: SYMBOL_H_SIZE, h: SYMBOL_H_SIZE };
  TITLE_X_H = START_X_H + SYMBOL_H_SIZE + GAP_H;
  TITLE_Y_H = LOGICAL/2 - 8;
  DATE_Y_H = TITLE_Y_H + 58;
}
computeHorizontalLayout(); // primeira estimativa (fonte de fallback), recalculado depois que a web font carrega de verdade

function parseCSV(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\r'){ /* ignore */ }
      else if (c === '\n'){ row.push(field); field = ''; rows.push(row); row = []; }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

async function loadLocationsFromSheet(){
  const res = await fetch(SHEET_CSV_URL);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const table = parseCSV(text).filter(r => r.some(c => c !== undefined && c.trim() !== ''));
  if (table.length < 2) throw new Error('planilha vazia');
  const headers = table[0].map(h => h.trim());
  const hIdx = {}; headers.forEach((h,i)=>hIdx[h]=i);
  const get = (row, name) => { const i = hIdx[name]; return (i!=null && row[i]!=null) ? row[i].trim() : ''; };
  const locMap = {}; const order = [];
  table.slice(1).forEach(row => {
    const local = get(row,'Local / Coletivo');
    const endereco = get(row,'Endereço');
    const nome = get(row,'Nome do Artista');
    if (!endereco && !nome) return;
    const latRaw = get(row,'Latitude');
    const lngRaw = get(row,'Longitude');
    const key = endereco;
    if (!locMap[key]){
      locMap[key] = {
        id: 'loc' + order.length, local, endereco,
        lat: latRaw ? parseFloat(latRaw.replace(',', '.')) : null,
        lng: lngRaw ? parseFloat(lngRaw.replace(',', '.')) : null
      };
      order.push(key);
    }
  });
  return order.map(k => locMap[k]);
}

/* ============================================================
   posiciona os pontos de acordo com as coordenadas reais — só
   geometria, sem nenhum mapa desenhado
   ============================================================ */
function project(lat, lon){
  const x = (lon + 180) / 360;
  const rad = lat * Math.PI/180;
  const y = (1 - Math.log(Math.tan(rad) + 1/Math.cos(rad)) / Math.PI) / 2;
  return { x, y };
}
function expandBounds(b, factor){
  const cLat = (b.minLat+b.maxLat)/2, cLng = (b.minLng+b.maxLng)/2;
  const spanLat = Math.max((b.maxLat-b.minLat)*factor, 0.002);
  const spanLng = Math.max((b.maxLng-b.minLng)*factor, 0.002);
  return { minLat:cLat-spanLat/2, maxLat:cLat+spanLat/2, minLng:cLng-spanLng/2, maxLng:cLng+spanLng/2 };
}
let proj = null;
function computeProjection(bounds, W, H, margin, padFactor){
  const expanded = expandBounds(bounds, padFactor);
  const p1 = project(expanded.maxLat, expanded.minLng);
  const p2 = project(expanded.minLat, expanded.maxLng);
  const worldW = p2.x - p1.x, worldH = p2.y - p1.y;
  const scale = Math.min((W - margin*2)/worldW, (H - margin*2)/worldH);
  const offsetX = (W - worldW*scale)/2, offsetY = (H - worldH*scale)/2;
  return { p1, scale, offsetX, offsetY };
}
function pixelOf(lat, lon){
  const p = project(lat, lon);
  return { x: proj.offsetX + (p.x - proj.p1.x)*proj.scale, y: proj.offsetY + (p.y - proj.p1.y)*proj.scale };
}

/* ============================================================
   caminho reto/curvo entre dois pontos
   ============================================================ */
// encaixa qualquer nuvem de pontos numa caixa alvo, centralizada
function computeFitTransform(points, box, fillFraction){
  const xs = points.map(p=>p.x), ys = points.map(p=>p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const w = (maxX-minX) || 1, h = (maxY-minY) || 1;
  const scale = Math.min(box.w*fillFraction/w, box.h*fillFraction/h);
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  const boxCx = box.x + box.w/2, boxCy = box.y + box.h/2;
  return { scale, cx, cy, boxCx, boxCy };
}
function applyFitTransform(points, t){
  return points.map(p => ({ x: t.boxCx + (p.x-t.cx)*t.scale, y: t.boxCy + (p.y-t.cy)*t.scale }));
}
function fitPointsToBox(points, box, fillFraction){
  return applyFitTransform(points, computeFitTransform(points, box, fillFraction));
}

function buildLegPath(a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  if (Math.random() < 0.35 || len < 90){
    return [ { x:a.x, y:a.y }, { x:b.x, y:b.y } ];
  }
  const nx = -dy/len, ny = dx/len;
  const side = Math.random() < 0.5 ? 1 : -1;
  const offset = len * (0.08 + Math.random()*0.14) * side;
  const mx = (a.x+b.x)/2 + nx*offset;
  const my = (a.y+b.y)/2 + ny*offset;
  const N = Math.max(18, Math.round(len/16));
  const pts = [];
  for (let i=0;i<=N;i++){
    const t = i/N;
    const it = 1-t;
    pts.push({
      x: it*it*a.x + 2*it*t*mx + t*t*b.x,
      y: it*it*a.y + 2*it*t*my + t*t*b.y
    });
  }
  return pts;
}
function pathLength(points){
  let len = 0;
  for (let i=1;i<points.length;i++) len += Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
  return len;
}
function pointAtDistance(points, dist){
  let d = 0;
  for (let i=1;i<points.length;i++){
    const seg = Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
    if (d+seg >= dist){
      const t = seg === 0 ? 0 : (dist-d)/seg;
      return {
        x: points[i-1].x + (points[i].x-points[i-1].x)*t,
        y: points[i-1].y + (points[i].y-points[i-1].y)*t,
        angle: Math.atan2(points[i].y-points[i-1].y, points[i].x-points[i-1].x)
      };
    }
    d += seg;
  }
  const last = points[points.length-1];
  return { x:last.x, y:last.y, angle:0 };
}

/* ============================================================
   medição de largura de caractere — usa um canvas escondido só
   como "régua" (nunca é desenhado nem exportado); o resultado
   final continua sendo texto SVG de verdade, vetorial
   ============================================================ */
function charWidth(ch, fontSize){
  measureCtx.font = `${fontSize}px 'Instrument Serif', Georgia, serif`;
  return measureCtx.measureText(ch).width;
}

function buildOpenPathD(points){
  if (points.length < 2) return '';
  let d = 'M' + points[0].x.toFixed(2) + ' ' + points[0].y.toFixed(2) + ' ';
  for (let i = 1; i < points.length; i++) d += 'L' + points[i].x.toFixed(2) + ' ' + points[i].y.toFixed(2) + ' ';
  return d;
}

function escapeXML(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ============================================================
   fita + texto — gera marcação SVG (path curto + <text>) por
   caractere, sempre na ordem do caminho, pra que trechos mais
   novos cubram os mais antigos nos cruzamentos
   ============================================================ */
// só a fita, sem nenhum texto por cima — cada perna vira um traço
// único e contínuo, na mesma ordem (perna nova cobre a antiga nos
// cruzamentos, igual à versão com texto)
function buildRibbonOnlySVG(legs, ribbonWidth, ribbonColor){
  let out = '';
  legs.forEach(points => {
    if (points.length < 2) return;
    let pathD = 'M' + points[0].x.toFixed(2) + ' ' + points[0].y.toFixed(2) + ' ';
    for (let i = 1; i < points.length; i++){
      pathD += 'L' + points[i].x.toFixed(2) + ' ' + points[i].y.toFixed(2) + ' ';
    }
    const stroke = currentTheme === 'degrade' ? legStrokeAttr(points[0], points[points.length-1], null) : ribbonColor;
    out += `<path d="${pathD}" fill="none" stroke="${stroke}" stroke-width="${ribbonWidth}" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  return out;
}

function buildRibbonAndTextSVG(text, legs, fontSize, ribbonWidth, ribbonColor, textColor){
  const unit = text + '   ·   ';
  let out = '';
  let charPos = 0; // continua entre pernas, pra frase não reiniciar a cada trecho

  legs.forEach(points => {
    if (points.length < 2) return;
    const total = pathLength(points);
    if (total < 4) return;

    // a fita desse trecho é um traço único e contínuo — sem costuras.
    // Pernas são desenhadas em ordem, então uma perna mais nova cobre
    // fisicamente uma mais antiga onde elas se cruzam — a sensação de
    // fita se enrolando em si mesma
    let pathD = 'M' + points[0].x.toFixed(2) + ' ' + points[0].y.toFixed(2) + ' ';
    for (let i = 1; i < points.length; i++){
      pathD += 'L' + points[i].x.toFixed(2) + ' ' + points[i].y.toFixed(2) + ' ';
    }
    const stroke = currentTheme === 'degrade' ? legStrokeAttr(points[0], points[points.length-1], null) : ribbonColor;
    out += `<path d="${pathD}" fill="none" stroke="${stroke}" stroke-width="${ribbonWidth}" stroke-linecap="round" stroke-linejoin="round"/>`;

    let d = 0, safety = 0;
    while (d < total && safety < 3000){
      const ch = unit[charPos % unit.length];
      const w = charWidth(ch, fontSize);
      if (d >= total) break;
      const pt = pointAtDistance(points, d);
      const angleDeg = (pt.angle * 180 / Math.PI).toFixed(2);
      out += `<text x="0" y="0" transform="translate(${pt.x.toFixed(2)} ${pt.y.toFixed(2)}) rotate(${angleDeg})" font-family="'Instrument Serif', Georgia, serif" font-size="${fontSize}" fill="${textColor}" text-anchor="start" dominant-baseline="middle">${escapeXML(ch)}</text>`;
      d += w;
      charPos++;
      safety++;
    }
  });

  return out;
}

/* ============================================================
   temas de cor
   ============================================================ */
const THEMES = {
  claro: { bg:'#ffffff', pin:'#111111', pinRing:'#ffffff', pinText:'#ffffff', ribbon:'#111111', text:'rgba(255,255,255,0.95)' },
  escuro:{ bg:'#111111', pin:'#ffffff', pinRing:'#111111', pinText:'#111111', ribbon:'#ffffff', text:'rgba(17,17,17,0.95)' },
  degrade:{ bg:'#ffffff', pin:'#111111', pinRing:'#ffffff', pinText:'#ffffff', ribbon:'#111111', text:'rgba(120,120,120,0.95)' }
};
let currentTheme = 'claro';

// degradê: cada trecho (perna) ganha um gradiente linear preto→branco,
// orientado do começo ao fim daquele trecho específico
let gradientDefs = [];
let gradientCounter = 0;
function resetGradients(){ gradientDefs = []; gradientCounter = 0; }
function legStrokeAttr(a, b, theme){
  if (currentTheme !== 'degrade') return theme.ribbon;
  const id = 'grad' + (gradientCounter++);
  gradientDefs.push(`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${a.x.toFixed(2)}" y1="${a.y.toFixed(2)}" x2="${b.x.toFixed(2)}" y2="${b.y.toFixed(2)}"><stop offset="0%" stop-color="#000000"/><stop offset="100%" stop-color="#ffffff"/></linearGradient>`);
  return `url(#${id})`;
}

/* ============================================================
   estado
   ============================================================ */
let LOCATIONS = [];
let PTS = [];
let alphaNum = {};
const svgEl = document.getElementById('art');
const countNote = document.getElementById('count-note');
const statusEl = document.getElementById('status');
const canvasFrame = document.getElementById('canvas-frame');
const themeClaroBtn = document.getElementById('theme-claro');
const themeEscuroBtn = document.getElementById('theme-escuro');
const themeDegradeBtn = document.getElementById('theme-degrade');

let selectedOrder = []; // sempre contém TODOS os pontos com coordenada, em ordem embaralhada
let showPins = true;
let showText = true;
let modeMarca = 'simbolo'; // simbolo | completa
let orientMarca = 'horizontal'; // vertical | horizontal
let completeMarkLegs = [];
let completeMarkPins = [];
let showPinsCompleta = true;

const textOnBtn = document.getElementById('text-on');
const textOffBtn = document.getElementById('text-off');
textOnBtn.addEventListener('click', () => { showText = true; textOnBtn.classList.add('active'); textOffBtn.classList.remove('active'); draw(); });
textOffBtn.addEventListener('click', () => { showText = false; textOffBtn.classList.add('active'); textOnBtn.classList.remove('active'); draw(); });

const pinsOnBtn = document.getElementById('pins-on');
const pinsOffBtn = document.getElementById('pins-off');
pinsOnBtn.addEventListener('click', () => { showPins = true; pinsOnBtn.classList.add('active'); pinsOffBtn.classList.remove('active'); draw(); });
pinsOffBtn.addEventListener('click', () => { showPins = false; pinsOffBtn.classList.add('active'); pinsOnBtn.classList.remove('active'); draw(); });

function setStatus(msg, isError){
  statusEl.textContent = msg || '';
  statusEl.classList.toggle('error', !!isError);
}

function setTheme(t){
  currentTheme = t;
  themeClaroBtn.classList.toggle('active', t === 'claro');
  themeEscuroBtn.classList.toggle('active', t === 'escuro');
  themeDegradeBtn.classList.toggle('active', t === 'degrade');
  canvasFrame.style.background = THEMES[t].bg;
  draw();
}
themeClaroBtn.addEventListener('click', () => setTheme('claro'));
themeEscuroBtn.addEventListener('click', () => setTheme('escuro'));
themeDegradeBtn.addEventListener('click', () => setTheme('degrade'));

function generateNewRoute(){
  const withCoords = LOCATIONS.filter(l => l.lat != null && l.lng != null);
  const shuffled = [...withCoords].sort(() => Math.random()-0.5);
  selectedOrder = shuffled.map(l => l.id);
  countNote.textContent = `${selectedOrder.length} ateliês conectados, nesta ordem`;
  draw();
}
function generateCompleteMark(){
  const order = [...PTS].sort(() => Math.random()-0.5);
  const closed = [...order, order[0]];
  const rawLegs = [];
  for (let i = 1; i < closed.length; i++){
    rawLegs.push(buildLegPath(closed[i-1], closed[i]));
  }
  const pts = [ { x: closed[0].x, y: closed[0].y } ];
  rawLegs.forEach(leg => leg.slice(1).forEach(p => pts.push(p)));

  const box = orientMarca === 'vertical' ? MARK_BOX_V : MARK_BOX_H;
  const t = computeFitTransform(pts, box, 0.97);
  completeMarkLegs = rawLegs.map(leg => applyFitTransform(leg, t));
  completeMarkPins = applyFitTransform(order, t).map((p,i) => ({ ...p, loc: order[i].loc }));
  draw();
}
document.getElementById('btn-shuffle').addEventListener('click', () => {
  if (modeMarca === 'simbolo') generateNewRoute();
  else generateCompleteMark();
});

const modeSimboloBtn = document.getElementById('mode-simbolo');
const modeCompletaBtn = document.getElementById('mode-completa');
const simboloFieldsEl = document.getElementById('simbolo-fields');
const orientFieldEl = document.getElementById('orient-field');
const orientVerticalBtn = document.getElementById('orient-vertical');
const orientHorizontalBtn = document.getElementById('orient-horizontal');
orientVerticalBtn.addEventListener('click', () => {
  orientMarca = 'vertical';
  orientVerticalBtn.classList.add('active'); orientHorizontalBtn.classList.remove('active');
  generateCompleteMark();
});
orientHorizontalBtn.addEventListener('click', () => {
  orientMarca = 'horizontal';
  orientHorizontalBtn.classList.add('active'); orientVerticalBtn.classList.remove('active');
  generateCompleteMark();
});

const completaPinsFieldEl = document.getElementById('completa-pins-field');
const completaPinsOnBtn = document.getElementById('completa-pins-on');
const completaPinsOffBtn = document.getElementById('completa-pins-off');
completaPinsOnBtn.addEventListener('click', () => { showPinsCompleta = true; completaPinsOnBtn.classList.add('active'); completaPinsOffBtn.classList.remove('active'); draw(); });
completaPinsOffBtn.addEventListener('click', () => { showPinsCompleta = false; completaPinsOffBtn.classList.add('active'); completaPinsOnBtn.classList.remove('active'); draw(); });

modeSimboloBtn.addEventListener('click', () => {
  modeMarca = 'simbolo';
  modeSimboloBtn.classList.add('active'); modeCompletaBtn.classList.remove('active');
  simboloFieldsEl.style.display = 'block';
  orientFieldEl.style.display = 'none';
  completaPinsFieldEl.style.display = 'none';
  draw();
});
modeCompletaBtn.addEventListener('click', () => {
  modeMarca = 'completa';
  modeCompletaBtn.classList.add('active'); modeSimboloBtn.classList.remove('active');
  simboloFieldsEl.style.display = 'none';
  orientFieldEl.style.display = 'block';
  completaPinsFieldEl.style.display = 'block';
  if (completeMarkLegs.length < 1) generateCompleteMark();
  draw();
});


/* ============================================================
   desenho — monta marcação SVG (texto e formas vetoriais de
   verdade, não pixel) e injeta no <svg> da tela
   ============================================================ */
function renderCompletaPins(pins, strokeWidth, theme){
  const r = strokeWidth / 2;
  const fontSize = Math.max(7, r*0.8);
  let s = '';
  pins.forEach(p => {
    s += `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${r.toFixed(2)}" fill="${theme.pin}" stroke="${theme.pinRing}" stroke-width="2"/>`;
    s += `<text x="${p.x.toFixed(2)}" y="${(p.y+0.5).toFixed(2)}" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="${fontSize.toFixed(1)}" fill="${theme.pinText}" text-anchor="middle" dominant-baseline="middle">${String(alphaNum[p.loc.id]).padStart(2,'0')}</text>`;
  });
  return s;
}

function buildContentSVG(includeBg){
  const theme = THEMES[currentTheme];
  let s = '';
  if (includeBg){
    s += `<rect x="0" y="0" width="${LOGICAL}" height="${LOGICAL}" fill="${theme.bg}"/>`;
    s += `<rect x="0.5" y="0.5" width="${LOGICAL-1}" height="${LOGICAL-1}" fill="none" stroke="${currentTheme==='claro' ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.2)'}" stroke-width="1"/>`;
  }

  if (modeMarca === 'completa'){
    resetGradients();
    let pathsOut = '';
    completeMarkLegs.forEach(points => {
      if (points.length < 2) return;
      let pathD = 'M' + points[0].x.toFixed(2) + ' ' + points[0].y.toFixed(2) + ' ';
      for (let i = 1; i < points.length; i++) pathD += 'L' + points[i].x.toFixed(2) + ' ' + points[i].y.toFixed(2) + ' ';
      const strokeW = orientMarca === 'vertical' ? SYMBOL_V_STROKE : SYMBOL_H_STROKE;
      const stroke = legStrokeAttr(points[0], points[points.length-1], theme);
      pathsOut += `<path d="${pathD}" fill="none" stroke="${stroke}" stroke-width="${strokeW}" stroke-linecap="round" stroke-linejoin="round"/>`;
    });

    let content = '';
    if (gradientDefs.length) content += `<defs>${gradientDefs.join('')}</defs>`;
    content += pathsOut;

    if (orientMarca === 'vertical'){
      content += `<text x="${TITLE_X_V}" y="${TITLE_V_Y1}" font-family="'Instrument Serif', Georgia, serif" font-size="${TITLE_SIZE_V}" fill="${theme.ribbon}">Circuito de</text>`;
      content += `<text x="${TITLE_X_V}" y="${TITLE_V_Y2}" font-family="'Instrument Serif', Georgia, serif" font-size="${TITLE_SIZE_V}" fill="${theme.ribbon}">Ateliês do Centro</text>`;
      content += `<text x="${TITLE_X_V}" y="${EYEBROW_V_Y}" font-family="'Instrument Serif', Georgia, serif" font-size="${EYEBROW_SIZE_V}" fill="${theme.ribbon}" opacity="0.65">${escapeXML(EVENT_EYEBROW)}</text>`;
      content += `<text x="${TITLE_X_V}" y="${DATE_V_Y}" font-family="'Instrument Serif', Georgia, serif" font-size="${DATE_SIZE_V}" fill="${theme.ribbon}" opacity="0.65">${escapeXML(EVENT_DATES)}</text>`;
      if (showPinsCompleta) content += renderCompletaPins(completeMarkPins, SYMBOL_V_STROKE, theme);
      s += content;
    } else {
      content += `<text x="${TITLE_X_H}" y="${TITLE_Y_H}" font-family="'Instrument Serif', Georgia, serif" font-size="${TITLE_SIZE_H}" fill="${theme.ribbon}">${escapeXML(EVENT_TITLE)}</text>`;
      content += `<text x="${TITLE_X_H}" y="${DATE_Y_H}" font-family="'Instrument Serif', Georgia, serif" font-size="${TITLE_SIZE_H}" fill="${theme.ribbon}" opacity="0.65">${escapeXML(EVENT_EYEBROW_DATE)}</text>`;
      if (showPinsCompleta) content += renderCompletaPins(completeMarkPins, SYMBOL_H_STROKE, theme);
      // só a apresentação muda aqui: a composição inteira é ampliada em
      // volta do centro do artboard, sem alterar nenhuma proporção da marca
      const fillFactor = 0.94;
      const scaleUp = Math.min(fillFactor*LOGICAL/TOTAL_W_H, fillFactor*LOGICAL/SYMBOL_H_SIZE);
      const c = LOGICAL/2;
      const pivotX = START_X_H + TOTAL_W_H/2; // centro real do conteúdo, não o do artboard —
                                               // diverge do centro quando START_X_H bate no clamp mínimo
      s += `<g transform="translate(${c} ${c}) scale(${scaleUp.toFixed(4)}) translate(${-pivotX} ${-c})">${content}</g>`;
    }
    return s;
  }

  if (selectedOrder.length >= 2){
    const selPts = selectedOrder.map(id => PTS.find(p => p.loc.id === id)).filter(Boolean);
    const legs = [];
    for (let i = 1; i < selPts.length; i++){
      legs.push(buildLegPath(selPts[i-1], selPts[i]));
    }
    resetGradients();
    const ribbonMarkup = showText
      ? buildRibbonAndTextSVG(EVENT_TITLE, legs, 24, 38, theme.ribbon, theme.text)
      : buildRibbonOnlySVG(legs, 38, theme.ribbon);
    if (gradientDefs.length) s += `<defs>${gradientDefs.join('')}</defs>`;
    s += ribbonMarkup;
  }

  if (showPins){
    PTS.forEach(p => {
      s += `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="15" fill="${theme.pin}" stroke="${theme.pinRing}" stroke-width="2"/>`;
      s += `<text x="${p.x.toFixed(2)}" y="${(p.y+0.5).toFixed(2)}" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="${theme.pinText}" text-anchor="middle" dominant-baseline="middle">${String(alphaNum[p.loc.id]).padStart(2,'0')}</text>`;
    });
  }

  return s;
}

function draw(){
  try{
    svgEl.innerHTML = buildContentSVG(true);
  } catch(err){
    console.error(err);
    setStatus('Erro ao desenhar: ' + err.message, true);
  }
}

function buildFullSVGString(scale){
  const s = scale || 1;
  const content = buildContentSVG(false); // exportação sai com fundo transparente por padrão
  return `<?xml version="1.0" encoding="UTF-8"?>\n` +
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${LOGICAL} ${LOGICAL}" width="${LOGICAL*s}" height="${LOGICAL*s}">` +
    `<defs><style>@import url('${FONT_IMPORT.replace(/&/g,'&amp;')}');</style></defs>` +
    content +
    `</svg>`;
}

/* ============================================================
   exportação — SVG (vetorial de verdade), PNG e PDF
   (PNG/PDF são rasterizados a partir do SVG, em alta resolução)
   ============================================================ */
document.getElementById('btn-download-svg').addEventListener('click', () => {
  setStatus('');
  const blob = new Blob([buildFullSVGString()], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'circuito-paralelo-marca.svg';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

function rasterizeSVG(scale){
  return new Promise((resolve, reject) => {
    const svgBlob = new Blob([buildFullSVGString(scale)], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = LOGICAL * scale;
      c.height = LOGICAL * scale;
      const cctx = c.getContext('2d');
      cctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c);
    };
    img.onerror = (err) => { URL.revokeObjectURL(url); reject(err); };
    img.src = url;
  });
}

document.getElementById('btn-download-png').addEventListener('click', async () => {
  setStatus('gerando PNG em alta resolução…');
  try{
    const c = await rasterizeSVG(3); // 3000x3000 — nítido mesmo impresso grande
    c.toBlob(blob => {
      if (!blob){ setStatus('Não foi possível gerar o PNG.', true); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'circuito-paralelo-marca.png';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      setStatus('');
    }, 'image/png');
  } catch(err){
    console.error(err);
    setStatus('Não foi possível gerar o PNG agora.', true);
  }
});

document.getElementById('btn-download-pdf').addEventListener('click', async () => {
  setStatus('gerando PDF…');
  try{
    const c = await rasterizeSVG(3);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'px', format: [LOGICAL, LOGICAL] });
    doc.addImage(c.toDataURL('image/png'), 'PNG', 0, 0, LOGICAL, LOGICAL);
    doc.save('circuito-paralelo-marca.pdf');
    setStatus('');
  } catch(err){
    console.error(err);
    setStatus('Não foi possível gerar o PDF agora — tente o SVG ou o PNG.', true);
  }
});

/* ============================================================
   boot
   ============================================================ */
async function boot(){
  try{
    await Promise.all([
      document.fonts.load("24px 'Instrument Serif'"),
      document.fonts.load(`${TITLE_SIZE_H}px 'Instrument Serif'`),
      document.fonts.load(`${DATE_SIZE_H}px 'Instrument Serif'`)
    ]);
  } catch(e){}
  // agora que a fonte de verdade carregou, recalcula a largura do texto
  // horizontal com a métrica real (antes disso, usava a fonte de fallback)
  computeHorizontalLayout();
  try{
    LOCATIONS = await loadLocationsFromSheet();
  } catch(err){
    console.error(err);
    setStatus('Não foi possível carregar os dados da planilha agora. Recarregue a página em instantes.', true);
    return;
  }

  const withCoords = LOCATIONS.filter(l => l.lat != null && l.lng != null);
  if (withCoords.length < 2){
    setStatus('poucos ateliês com coordenadas preenchidas ainda.', true);
    return;
  }
  const bounds = {
    minLat: Math.min(...withCoords.map(l=>l.lat)),
    maxLat: Math.max(...withCoords.map(l=>l.lat)),
    minLng: Math.min(...withCoords.map(l=>l.lng)),
    maxLng: Math.max(...withCoords.map(l=>l.lng)),
  };
  proj = computeProjection(bounds, LOGICAL, LOGICAL, 60, 1.0);

  PTS = withCoords.map(loc => {
    const { x, y } = pixelOf(loc.lat, loc.lng);
    return { loc, x, y };
  });

  const sortedForNum = [...withCoords].sort((a,b) =>
    (a.local||a.endereco).localeCompare(b.local||b.endereco, 'pt-BR', {sensitivity:'base'}));
  alphaNum = {};
  sortedForNum.forEach((loc,i) => { alphaNum[loc.id] = i+1; });

  generateNewRoute();
  generateCompleteMark();
}
boot();
