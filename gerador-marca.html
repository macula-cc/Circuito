<script>
/* ============================================================
   dados
   ============================================================ */
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1Zjux0r3uVJ8ua1ZXpWd68lOSP5Kj0XkU/gviz/tq?tqx=out:csv&sheet=Circuito';
const LOGICAL = 1000;
const FONT_IMPORT = "https://fonts.googleapis.com/css2?family=Geist:wght@350&family=Instrument+Serif:ital@0;1&display=swap";
const SANS_DISPLAY = "'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
const EVENT_TITLE = 'Circuito de Ateliês do Centro'; // usado só no modo "símbolo" (fita seguindo o traçado)
// marca completa: núcleo tipográfico novo — label pequeno em caixa alta
// (Geist) acima de uma linha só combinando o nome do evento (serifado,
// normal) com a data (serifado, itálico)
const EVENT_LABEL = 'CIRCUITO DE ATELIÊS DO CENTRO';
const EVENT_TAGLINE = 'Ateliês abertos';
const EVENT_DATES = '18 – 19 de Setembro';
// vertical: label quebrado em 2 linhas fixas (não é reflow automático)
const LABEL_LINE1_V = 'CIRCUITO DE';
const LABEL_LINE2_V = 'ATELIÊS DO CENTRO';

// estimativa de largura do texto (fontes serifadas ~0.52× o tamanho por
// caractere) — só pra centralizar a composição, não precisa ser exata
const measureCanvas = document.createElement('canvas');
const measureCtx = measureCanvas.getContext('2d');
function estimateTextWidth(text, fontSize){
  measureCtx.font = `${fontSize}px 'Instrument Serif', Georgia, serif`;
  return measureCtx.measureText(text).width;
}
function estimateSansWidth(text, fontSize){
  measureCtx.font = `350 ${fontSize}px ${SANS_DISPLAY}`;
  return measureCtx.measureText(text).width;
}

// marca completa — núcleo tipográfico compartilhado entre vertical e
// horizontal (mesmo tamanho de fonte nos dois — só a escala/posição do
// símbolo muda). Razão calibrada pelos valores de referência do design:
// sans 25pt / serifado 33.5pt ≈ 0,7463
const TITLE_SIZE = 64; // linha serifada "Ateliês abertos ... data"
const LABEL_SIZE = TITLE_SIZE * (25/33.5); // ≈ 47.76 — label sans-serif em caixa alta
const LABEL_GAP_BASE = 58 * 1.1; // espaço entre as duas linhas, +10% (comum às duas orientações)

// vertical: bloco de texto inteiro 20% menor que o núcleo "cheio" (label,
// linha principal e o espaço entre elas), alinhado à esquerda pela borda
// do símbolo — só o tamanho muda, a posição x é sempre MARK_BOX_V.x
const V_TEXT_SCALE = 0.8;
const LABEL_SIZE_V = LABEL_SIZE * V_TEXT_SCALE;
const TITLE_SIZE_V = TITLE_SIZE * V_TEXT_SCALE;
const LABEL_GAP_V = LABEL_GAP_BASE * V_TEXT_SCALE; // espaço entre o bloco do label e o bloco do título
const LABEL_LINE_GAP_V = LABEL_SIZE_V * 1.05; // entrelinha dentro do label (2 linhas)
const TITLE_LINE_GAP_V = TITLE_SIZE_V * 0.95; // entrelinha dentro do título (2 linhas)

// vertical: símbolo grande acima, texto embaixo (4 linhas: label em 2 linhas
// + título em 2 linhas — nome do evento / data), grupo inteiro centralizado
// no artboard
const SYMBOL_V_SIZE = 720;
const SYMBOL_V_STROKE = 38;
const GAP_V = -20; // distância real entre a ponta de baixo do símbolo e a tipografia (negativo aproxima, compensando a margem do fillFraction do traçado)
const TEXT_BLOCK_H_V = (LABEL_SIZE_V*0.72) + LABEL_LINE_GAP_V + LABEL_GAP_V + TITLE_LINE_GAP_V + (TITLE_SIZE_V*0.25);
const GROUP_H_V = SYMBOL_V_SIZE + GAP_V + TEXT_BLOCK_H_V;
const GROUP_TOP_V = (LOGICAL - GROUP_H_V) / 2;
const MARK_BOX_V = { x: (LOGICAL - SYMBOL_V_SIZE)/2, y: GROUP_TOP_V, w: SYMBOL_V_SIZE, h: SYMBOL_V_SIZE };
const TEXT_TOP_V = MARK_BOX_V.y + SYMBOL_V_SIZE + GAP_V;
const LABEL1_V_Y = TEXT_TOP_V + LABEL_SIZE_V*0.72;
const LABEL2_V_Y = LABEL1_V_Y + LABEL_LINE_GAP_V;
const TITLE1_V_Y = LABEL2_V_Y + LABEL_GAP_V;
const TITLE2_V_Y = TITLE1_V_Y + TITLE_LINE_GAP_V;
// alinhado à esquerda pela borda do símbolo (mesma posição x pras 4 linhas)
const TITLE_X_V = MARK_BOX_V.x;

// horizontal: símbolo menor ao lado, mesmo núcleo tipográfico "cheio" (só a
// vertical fica menor); composição inteira ampliada/centralizada no
// artboard no fim (scaleUp)
const SYMBOL_H_SIZE = 420;
const SYMBOL_H_STROKE = 20;
const GAP_H = 30;
let TEXT_W_H, TOTAL_W_H, START_X_H, MARK_BOX_H, TITLE_X_H, LABEL_Y_H, TITLE_Y_H;
function computeHorizontalLayout(){
  TEXT_W_H = Math.max(estimateSansWidth(EVENT_LABEL, LABEL_SIZE), estimateTextWidth(`${EVENT_TAGLINE} ${EVENT_DATES}`, TITLE_SIZE));
  TOTAL_W_H = SYMBOL_H_SIZE + GAP_H + TEXT_W_H;
  START_X_H = Math.max(15, (LOGICAL - TOTAL_W_H) / 2);
  MARK_BOX_H = { x: START_X_H, y: LOGICAL/2 - SYMBOL_H_SIZE/2, w: SYMBOL_H_SIZE, h: SYMBOL_H_SIZE };
  TITLE_X_H = START_X_H + SYMBOL_H_SIZE + GAP_H;
  LABEL_Y_H = LOGICAL/2 - 8;
  TITLE_Y_H = LABEL_Y_H + LABEL_GAP_BASE;
}
computeHorizontalLayout(); // primeira estimativa (fonte de fallback), recalculado depois que a web font carrega de verdade

function parseCSV(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\r'){ /* ignore */ }
      else if (c === '\n'){ row.push(field); field = ''; rows.push(row); row = []; }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

// alguns endereços chegam da planilha com coordenada mal digitada (ex:
// sem separador decimal, tipo "-229115" em vez de "-22,9115") — passar
// isso direto pra project()/computeProjection() gera NaN em cascata e
// quebra a marca inteira (nenhum ponto aparece). Em vez disso, tratamos
// como coordenada ainda não preenchida.
function parseCoord(raw, min, max){
  if (!raw) return null;
  const n = parseFloat(raw.replace(',', '.'));
  return (isNaN(n) || n < min || n > max) ? null : n;
}

async function loadLocationsFromSheet(){
  const res = await fetch(`${SHEET_CSV_URL}&_=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const table = parseCSV(text).filter(r => r.some(c => c !== undefined && c.trim() !== ''));
  if (table.length < 2) throw new Error('planilha vazia');
  const headers = table[0].map(h => h.trim());
  const hIdx = {}; headers.forEach((h,i)=>hIdx[h]=i);
  const get = (row, name) => { const i = hIdx[name]; return (i!=null && row[i]!=null) ? row[i].trim() : ''; };
  const locMap = {}; const order = [];
  table.slice(1).forEach(row => {
    const local = get(row,'Local / Coletivo');
    const endereco = get(row,'Endereço');
    const nome = get(row,'Nome do Artista');
    if (!endereco && !nome) return;
    const latRaw = get(row,'Latitude');
    const lngRaw = get(row,'Longitude');
    const key = endereco;
    if (!locMap[key]){
      locMap[key] = {
        id: 'loc' + order.length, local, endereco,
        lat: parseCoord(latRaw, -90, 90),
        lng: parseCoord(lngRaw, -180, 180)
      };
      order.push(key);
    }
  });
  return order.map(k => locMap[k]);
}

/* ============================================================
   posiciona os pontos de acordo com as coordenadas reais — só
   geometria, sem nenhum mapa desenhado
   ============================================================ */
function project(lat, lon){
  const x = (lon + 180) / 360;
  const rad = lat * Math.PI/180;
  const y = (1 - Math.log(Math.tan(rad) + 1/Math.cos(rad)) / Math.PI) / 2;
  return { x, y };
}
function expandBounds(b, factor){
  const cLat = (b.minLat+b.maxLat)/2, cLng = (b.minLng+b.maxLng)/2;
  const spanLat = Math.max((b.maxLat-b.minLat)*factor, 0.002);
  const spanLng = Math.max((b.maxLng-b.minLng)*factor, 0.002);
  return { minLat:cLat-spanLat/2, maxLat:cLat+spanLat/2, minLng:cLng-spanLng/2, maxLng:cLng+spanLng/2 };
}
let proj = null;
function computeProjection(bounds, W, H, margin, padFactor){
  const expanded = expandBounds(bounds, padFactor);
  const p1 = project(expanded.maxLat, expanded.minLng);
  const p2 = project(expanded.minLat, expanded.maxLng);
  const worldW = p2.x - p1.x, worldH = p2.y - p1.y;
  const scale = Math.min((W - margin*2)/worldW, (H - margin*2)/worldH);
  const offsetX = (W - worldW*scale)/2, offsetY = (H - worldH*scale)/2;
  return { p1, scale, offsetX, offsetY };
}
function pixelOf(lat, lon){
  const p = project(lat, lon);
  return { x: proj.offsetX + (p.x - proj.p1.x)*proj.scale, y: proj.offsetY + (p.y - proj.p1.y)*proj.scale };
}

/* ============================================================
   caminho reto/curvo entre dois pontos
   ============================================================ */
// encaixa qualquer nuvem de pontos numa caixa alvo, centralizada
function computeFitTransform(points, box, fillFraction){
  const xs = points.map(p=>p.x), ys = points.map(p=>p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const w = (maxX-minX) || 1, h = (maxY-minY) || 1;
  const scale = Math.min(box.w*fillFraction/w, box.h*fillFraction/h);
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  const boxCx = box.x + box.w/2, boxCy = box.y + box.h/2;
  return { scale, cx, cy, boxCx, boxCy };
}
function applyFitTransform(points, t){
  return points.map(p => ({ x: t.boxCx + (p.x-t.cx)*t.scale, y: t.boxCy + (p.y-t.cy)*t.scale }));
}
function fitPointsToBox(points, box, fillFraction){
  return applyFitTransform(points, computeFitTransform(points, box, fillFraction));
}

function buildLegPath(a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  if (Math.random() < 0.35 || len < 90){
    return [ { x:a.x, y:a.y }, { x:b.x, y:b.y } ];
  }
  const nx = -dy/len, ny = dx/len;
  const side = Math.random() < 0.5 ? 1 : -1;
  const offset = len * (0.08 + Math.random()*0.14) * side;
  const mx = (a.x+b.x)/2 + nx*offset;
  const my = (a.y+b.y)/2 + ny*offset;
  const N = Math.max(18, Math.round(len/16));
  const pts = [];
  for (let i=0;i<=N;i++){
    const t = i/N;
    const it = 1-t;
    pts.push({
      x: it*it*a.x + 2*it*t*mx + t*t*b.x,
      y: it*it*a.y + 2*it*t*my + t*t*b.y
    });
  }
  return pts;
}
function pathLength(points){
  let len = 0;
  for (let i=1;i<points.length;i++) len += Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
  return len;
}
function pointAtDistance(points, dist){
  let d = 0;
  for (let i=1;i<points.length;i++){
    const seg = Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
    if (d+seg >= dist){
      const t = seg === 0 ? 0 : (dist-d)/seg;
      return {
        x: points[i-1].x + (points[i].x-points[i-1].x)*t,
        y: points[i-1].y + (points[i].y-points[i-1].y)*t,
        angle: Math.atan2(points[i].y-points[i-1].y, points[i].x-points[i-1].x)
      };
    }
    d += seg;
  }
  const last = points[points.length-1];
  return { x:last.x, y:last.y, angle:0 };
}

/* ============================================================
   medição de largura de caractere — usa um canvas escondido só
   como "régua" (nunca é desenhado nem exportado); o resultado
   final continua sendo texto SVG de verdade, vetorial
   ============================================================ */
function charWidth(ch, fontSize, fontFamily, weight, italic){
  measureCtx.font = `${italic ? 'italic ' : ''}${weight ? weight+' ' : ''}${fontSize}px ${fontFamily || "'Instrument Serif', Georgia, serif"}`;
  return measureCtx.measureText(ch).width;
}

// mede a altura real do "x" (aproxima a altura-x) numa fonte/peso/tamanho —
// usado pra igualar visualmente o tamanho do texto sem serifa (Geist) ao
// tamanho do texto serifado (Instrument Serif) quando alternam na fita, já
// que fontes diferentes têm proporções diferentes entre o tamanho nominal
// e a altura-x de verdade
function measureXMetrics(fontSize, fontFamily, weight){
  measureCtx.font = `${weight ? weight+' ' : ''}${fontSize}px ${fontFamily}`;
  const m = measureCtx.measureText('x');
  return { ascent: m.actualBoundingBoxAscent, descent: m.actualBoundingBoxDescent };
}

function buildOpenPathD(points){
  if (points.length < 2) return '';
  let d = 'M' + points[0].x.toFixed(2) + ' ' + points[0].y.toFixed(2) + ' ';
  for (let i = 1; i < points.length; i++) d += 'L' + points[i].x.toFixed(2) + ' ' + points[i].y.toFixed(2) + ' ';
  return d;
}

function escapeXML(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ============================================================
   fita + texto — gera marcação SVG (path curto + <text>) por
   caractere, sempre na ordem do caminho, pra que trechos mais
   novos cubram os mais antigos nos cruzamentos
   ============================================================ */
// só a fita, sem nenhum texto por cima — cada perna vira um traço
// único e contínuo, na mesma ordem (perna nova cobre a antiga nos
// cruzamentos, igual à versão com texto)
function buildRibbonOnlySVG(legs, ribbonWidth, ribbonColor){
  let out = '';
  legs.forEach(points => {
    if (points.length < 2) return;
    let pathD = 'M' + points[0].x.toFixed(2) + ' ' + points[0].y.toFixed(2) + ' ';
    for (let i = 1; i < points.length; i++){
      pathD += 'L' + points[i].x.toFixed(2) + ' ' + points[i].y.toFixed(2) + ' ';
    }
    const stroke = currentTheme === 'degrade' ? legStrokeAttr(points[0], points[points.length-1], null) : ribbonColor;
    out += `<path d="${pathD}" fill="none" stroke="${stroke}" stroke-width="${ribbonWidth}" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  return out;
}

const RIBBON_SERIF_FONT = "'Instrument Serif', Georgia, serif";
const RIBBON_SEP = '   ·   ';

// alterna o nome do evento em duas tipografias (sem serifa/caixa alta, com
// serifa) — os tamanhos são calculados pra terem a MESMA altura-x visual
// (fontes diferentes têm proporções diferentes entre o tamanho nominal e a
// altura-x real), e cada um ganha um dy próprio pra ficar centralizado na
// fita, já que o "centro" de cada fonte não cai exatamente no mesmo lugar
// em relação à linha de base
function buildRibbonRuns(serifFontSize){
  const serifMetrics = measureXMetrics(serifFontSize, RIBBON_SERIF_FONT);
  const sansMetricsAtSerifSize = measureXMetrics(serifFontSize, SANS_DISPLAY, '350');
  // altura-x igualada e depois 15% menor, a pedido — fica um pouco mais
  // discreta que o texto serifado em vez de exatamente do mesmo tamanho
  const sansFontSize = serifFontSize * (serifMetrics.ascent / sansMetricsAtSerifSize.ascent) * 0.85;
  const sansMetrics = measureXMetrics(sansFontSize, SANS_DISPLAY, '350');
  const serifDy = (serifMetrics.ascent - serifMetrics.descent) / 2;
  const sansDy = (sansMetrics.ascent - sansMetrics.descent) / 2;
  return [
    { text: EVENT_LABEL, fontFamily: SANS_DISPLAY, weight:'350', fontSize: sansFontSize, dy: sansDy },
    { text: RIBBON_SEP, fontFamily: SANS_DISPLAY, weight:'350', fontSize: sansFontSize, dy: sansDy },
    { text: `${EVENT_TAGLINE} `, fontFamily: RIBBON_SERIF_FONT, weight:'400', fontSize: serifFontSize, dy: serifDy },
    { text: EVENT_DATES, fontFamily: RIBBON_SERIF_FONT, weight:'400', italic:true, fontSize: serifFontSize, dy: serifDy },
    { text: RIBBON_SEP, fontFamily: RIBBON_SERIF_FONT, weight:'400', fontSize: serifFontSize, dy: serifDy }
  ];
}

function buildRibbonAndTextSVG(runs, legs, ribbonWidth, ribbonColor, textColor){
  const chars = [];
  runs.forEach(run => { for (const ch of run.text) chars.push({ ch, run }); });
  let out = '';
  let charPos = 0; // continua entre pernas, pra frase não reiniciar a cada trecho

  legs.forEach(points => {
    if (points.length < 2) return;
    const total = pathLength(points);
    if (total < 4) return;

    // a fita desse trecho é um traço único e contínuo — sem costuras.
    // Pernas são desenhadas em ordem, então uma perna mais nova cobre
    // fisicamente uma mais antiga onde elas se cruzam — a sensação de
    // fita se enrolando em si mesma
    let pathD = 'M' + points[0].x.toFixed(2) + ' ' + points[0].y.toFixed(2) + ' ';
    for (let i = 1; i < points.length; i++){
      pathD += 'L' + points[i].x.toFixed(2) + ' ' + points[i].y.toFixed(2) + ' ';
    }
    const stroke = currentTheme === 'degrade' ? legStrokeAttr(points[0], points[points.length-1], null) : ribbonColor;
    out += `<path d="${pathD}" fill="none" stroke="${stroke}" stroke-width="${ribbonWidth}" stroke-linecap="round" stroke-linejoin="round"/>`;

    let d = 0, safety = 0;
    while (d < total && safety < 4000){
      const item = chars[charPos % chars.length];
      const w = charWidth(item.ch, item.run.fontSize, item.run.fontFamily, item.run.weight, item.run.italic);
      if (d >= total) break;
      const pt = pointAtDistance(points, d);
      const angleDeg = (pt.angle * 180 / Math.PI).toFixed(2);
      out += `<text x="0" y="${item.run.dy.toFixed(2)}" transform="translate(${pt.x.toFixed(2)} ${pt.y.toFixed(2)}) rotate(${angleDeg})" font-family="${item.run.fontFamily}" font-weight="${item.run.weight}" font-style="${item.run.italic ? 'italic' : 'normal'}" font-size="${item.run.fontSize.toFixed(2)}" fill="${textColor}" text-anchor="start">${escapeXML(item.ch)}</text>`;
      d += w;
      charPos++;
      safety++;
    }
  });

  return out;
}

const THEMES = {
  claro: { bg:'#ffffff', pin:'#111111', pinRing:'#ffffff', pinText:'#ffffff', ribbon:'#111111', text:'rgba(255,255,255,0.95)' },
  escuro:{ bg:'#111111', pin:'#ffffff', pinRing:'#111111', pinText:'#111111', ribbon:'#ffffff', text:'rgba(17,17,17,0.95)' },
  degrade:{ bg:'#ffffff', pin:'#111111', pinRing:'#ffffff', pinText:'#ffffff', ribbon:'#111111', text:'rgba(120,120,120,0.95)' }
};
let currentTheme = 'claro';

// degradê: cada trecho (perna) ganha um gradiente linear preto→branco,
// orientado do começo ao fim daquele trecho específico
let gradientDefs = [];
let gradientCounter = 0;
function resetGradients(){ gradientDefs = []; gradientCounter = 0; }
function legStrokeAttr(a, b, theme){
  if (currentTheme !== 'degrade') return theme.ribbon;
  const id = 'grad' + (gradientCounter++);
  gradientDefs.push(`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${a.x.toFixed(2)}" y1="${a.y.toFixed(2)}" x2="${b.x.toFixed(2)}" y2="${b.y.toFixed(2)}"><stop offset="0%" stop-color="#000000"/><stop offset="100%" stop-color="#ffffff"/></linearGradient>`);
  return `url(#${id})`;
}

function generateNewRoute(){
  const withCoords = LOCATIONS.filter(l => l.lat != null && l.lng != null);

  selectedOrder = shuffled.map(l => l.id);

  draw();
}
function generateCompleteMark(){
  const order = [...PTS].sort(() => Math.random()-0.5);
  const closed = [...order, order[0]];
  const rawLegs = [];
  for (let i = 1; i < closed.length; i++){
    rawLegs.push(buildLegPath(closed[i-1], closed[i]));
  }
  const pts = [ { x: closed[0].x, y: closed[0].y } ];
  rawLegs.forEach(leg => leg.slice(1).forEach(p => pts.push(p)));

  const box = orientMarca === 'vertical' ? MARK_BOX_V : MARK_BOX_H;
  const t = computeFitTransform(pts, box, 0.97);
  completeMarkLegs = rawLegs.map(leg => applyFitTransform(leg, t));
  completeMarkPins = applyFitTransform(order, t).map((p,i) => ({ ...p, loc: order[i].loc }));
  draw();
}

/* ============================================================
   desenho — monta marcação SVG (texto e formas vetoriais de
   verdade, não pixel) e injeta no <svg> da tela
   ============================================================ */
function renderCompletaPins(pins, strokeWidth, theme){
  const r = strokeWidth / 2;
  const fontSize = Math.max(7, r*0.8);
  let s = '';
  pins.forEach(p => {
    s += `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${r.toFixed(2)}" fill="${theme.pin}" stroke="${theme.pinRing}" stroke-width="2"/>`;
    s += `<text x="${p.x.toFixed(2)}" y="${(p.y+0.5).toFixed(2)}" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="${fontSize.toFixed(1)}" fill="${theme.pinText}" text-anchor="middle" dominant-baseline="middle">${String(alphaNum[p.loc.id]).padStart(2,'0')}</text>`;
  });
  return s;
}

function buildContentSVG(includeBg){
  const theme = THEMES[currentTheme];
  let s = '';
  if (includeBg){
    s += `<rect x="0" y="0" width="${LOGICAL}" height="${LOGICAL}" fill="${theme.bg}"/>`;
    s += `<rect x="0.5" y="0.5" width="${LOGICAL-1}" height="${LOGICAL-1}" fill="none" stroke="${currentTheme==='claro' ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.2)'}" stroke-width="1"/>`;
  }

  if (modeMarca === 'completa'){
    resetGradients();
    let pathsOut = '';
    completeMarkLegs.forEach(points => {
      if (points.length < 2) return;
      let pathD = 'M' + points[0].x.toFixed(2) + ' ' + points[0].y.toFixed(2) + ' ';
      for (let i = 1; i < points.length; i++) pathD += 'L' + points[i].x.toFixed(2) + ' ' + points[i].y.toFixed(2) + ' ';
      const strokeW = orientMarca === 'vertical' ? SYMBOL_V_STROKE : SYMBOL_H_STROKE;
      const stroke = legStrokeAttr(points[0], points[points.length-1], theme);
      pathsOut += `<path d="${pathD}" fill="none" stroke="${stroke}" stroke-width="${strokeW}" stroke-linecap="round" stroke-linejoin="round"/>`;
    });

    let content = '';
    if (gradientDefs.length) content += `<defs>${gradientDefs.join('')}</defs>`;
    content += pathsOut;

    if (orientMarca === 'vertical'){
      const labelLS = (LABEL_SIZE_V*-0.025).toFixed(2);
      content += `<text x="${TITLE_X_V}" y="${LABEL1_V_Y}" font-family="${SANS_DISPLAY}" font-weight="350" letter-spacing="${labelLS}" font-size="${LABEL_SIZE_V.toFixed(2)}" fill="${theme.ribbon}">${escapeXML(LABEL_LINE1_V)}</text>`;
      content += `<text x="${TITLE_X_V}" y="${LABEL2_V_Y}" font-family="${SANS_DISPLAY}" font-weight="350" letter-spacing="${labelLS}" font-size="${LABEL_SIZE_V.toFixed(2)}" fill="${theme.ribbon}">${escapeXML(LABEL_LINE2_V)}</text>`;
      content += `<text x="${TITLE_X_V}" y="${TITLE1_V_Y}" font-family="'Instrument Serif', Georgia, serif" font-size="${TITLE_SIZE_V.toFixed(2)}" fill="${theme.ribbon}">${escapeXML(EVENT_TAGLINE)}</text>`;
      content += `<text x="${TITLE_X_V}" y="${TITLE2_V_Y}" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="${TITLE_SIZE_V.toFixed(2)}" fill="${theme.ribbon}">${escapeXML(EVENT_DATES)}</text>`;
      if (showPinsCompleta) content += renderCompletaPins(completeMarkPins, SYMBOL_V_STROKE, theme);
      s += content;
    } else {
      content += `<text x="${TITLE_X_H}" y="${LABEL_Y_H}" font-family="${SANS_DISPLAY}" font-weight="350" letter-spacing="${(LABEL_SIZE*-0.025).toFixed(2)}" font-size="${LABEL_SIZE.toFixed(2)}" fill="${theme.ribbon}">${escapeXML(EVENT_LABEL)}</text>`;
      content += `<text x="${TITLE_X_H}" y="${TITLE_Y_H}" font-size="${TITLE_SIZE}" fill="${theme.ribbon}"><tspan font-family="'Instrument Serif', Georgia, serif">${escapeXML(EVENT_TAGLINE)} </tspan><tspan font-family="'Instrument Serif', Georgia, serif" font-style="italic">${escapeXML(EVENT_DATES)}</tspan></text>`;
      if (showPinsCompleta) content += renderCompletaPins(completeMarkPins, SYMBOL_H_STROKE, theme);
      // só a apresentação muda aqui: a composição inteira é ampliada em
      // volta do centro do artboard, sem alterar nenhuma proporção da marca
      const fillFactor = 0.94;
      const scaleUp = Math.min(fillFactor*LOGICAL/TOTAL_W_H, fillFactor*LOGICAL/SYMBOL_H_SIZE);
      const c = LOGICAL/2;
      const pivotX = START_X_H + TOTAL_W_H/2; // centro real do conteúdo, não o do artboard —
                                               // diverge do centro quando START_X_H bate no clamp mínimo
      s += `<g transform="translate(${c} ${c}) scale(${scaleUp.toFixed(4)}) translate(${-pivotX} ${-c})">${content}</g>`;
    }
    return s;
  }

  if (selectedOrder.length >= 2){
    const selPts = selectedOrder.map(id => PTS.find(p => p.loc.id === id)).filter(Boolean);
    const legs = [];
    for (let i = 1; i < selPts.length; i++){
      legs.push(buildLegPath(selPts[i-1], selPts[i]));
    }
    resetGradients();
    const ribbonMarkup = showText
      ? buildRibbonAndTextSVG(buildRibbonRuns(24), legs, 38, theme.ribbon, theme.text)
      : buildRibbonOnlySVG(legs, 38, theme.ribbon);
    if (gradientDefs.length) s += `<defs>${gradientDefs.join('')}</defs>`;
    s += ribbonMarkup;
  }

  if (showPins){
    PTS.forEach(p => {
      s += `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="15" fill="${theme.pin}" stroke="${theme.pinRing}" stroke-width="2"/>`;
      s += `<text x="${p.x.toFixed(2)}" y="${(p.y+0.5).toFixed(2)}" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="${theme.pinText}" text-anchor="middle" dominant-baseline="middle">${String(alphaNum[p.loc.id]).padStart(2,'0')}</text>`;
    });
  }

  return s;
}

function draw(){
  try{
    svgEl.innerHTML = buildContentSVG(true);
  } catch(err){
    console.error(err);
    setStatus('Erro ao desenhar: ' + err.message, true);

}

function buildFullSVGString(scale){
  const s = scale || 1;
  const content = buildContentSVG(false); // exportação sai com fundo transparente por padrão
  return `<?xml version="1.0" encoding="UTF-8"?>\n` +
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${LOGICAL} ${LOGICAL}" width="${LOGICAL*s}" height="${LOGICAL*s}">` +
    `<defs><style>@import url('${FONT_IMPORT.replace(/&/g,'&amp;')}');</style></defs>` +
    content +
    `</svg>`;
}

  URL.revokeObjectURL(url);

function rasterizeSVG(scale){
  return new Promise((resolve, reject) => {
    const svgBlob = new Blob([buildFullSVGString(scale)], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = LOGICAL * scale;
      c.height = LOGICAL * scale;
      const cctx = c.getContext('2d');
      cctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c);
    };
    img.onerror = (err) => { URL.revokeObjectURL(url); reject(err); };
    img.src = url;
  });
}

document.getElementById('btn-download-png').addEventListener('click', async () => {
  setStatus('gerando PNG em alta resolução…');
  try{
    const c = await rasterizeSVG(3); // 3000x3000 — nítido mesmo impresso grande
    c.toBlob(blob => {
      if (!blob){ setStatus('Não foi possível gerar o PNG.', true); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'circuito-paralelo-marca.png';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      setStatus('');
    }, 'image/png');
  } catch(err){
    console.error(err);
    setStatus('Não foi possível gerar o PNG agora.', true);
  }
});

document.getElementById('btn-download-pdf').addEventListener('click', async () => {

    const { jsPDF } = window.jspdf;

    doc.addImage(c.toDataURL('image/png'), 'PNG', 0, 0, LOGICAL, LOGICAL);

// ---------------- geocodificação automática (fallback) ----------------
// mesma lógica do index.html: endereços sem lat/lng na planilha são
// resolvidos via Nominatim (gratuito) em segundo plano, sem travar o
// carregamento inicial com o que já está disponível
async function geocodeAddress(query){
  try{
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('geocode http error ' + res.status);
    const results = await res.json();
    if (results && results.length){
      return { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) };
    }
  } catch(err){
    console.warn('Falha ao geocodificar endereço:', query, err);
  }
  return null;
}
async function resolveMissingCoordinates(){
  const pending = LOCATIONS.filter(l => (l.lat == null || l.lng == null) && !/confirmar/i.test(l.endereco));
  for (const loc of pending){
    const query = `${loc.endereco}, Centro, Rio de Janeiro, Brasil`;
    const coords = await geocodeAddress(query);
    if (coords){
      loc.lat = coords.lat;
      loc.lng = coords.lng;
      setupFromLocations();
    }
    await new Promise(r => setTimeout(r, 1100));
  }
}

/* ============================================================
   boot
   ============================================================ */
function setupFromLocations(){
  const withCoords = LOCATIONS.filter(l => l.lat != null && l.lng != null);
  if (withCoords.length < 2){
    setStatus('poucos ateliês com coordenadas preenchidas ainda.', true);
    return;
  }
  setStatus('');
  const bounds = {
    minLat: Math.min(...withCoords.map(l=>l.lat)),
    maxLat: Math.max(...withCoords.map(l=>l.lat)),
    minLng: Math.min(...withCoords.map(l=>l.lng)),
    maxLng: Math.max(...withCoords.map(l=>l.lng)),
  };
  proj = computeProjection(bounds, LOGICAL, LOGICAL, 60, 1.0);

  PTS = withCoords.map(loc => {
    const { x, y } = pixelOf(loc.lat, loc.lng);
    return { loc, x, y };
  });

  // numerado entre TODOS os endereços da planilha (não só os com coordenada
  // já preenchida) — mesmo critério do index.html, senão o número de um
  // ponto aqui diverge do número mostrado no site conforme endereços novos
  // vão sendo geocodificados em momentos diferentes
  const sortedForNum = [...LOCATIONS].sort((a,b) =>
    (a.local||a.endereco).localeCompare(b.local||b.endereco, 'pt-BR', {sensitivity:'base'}));
  alphaNum = {};
  sortedForNum.forEach((loc,i) => { alphaNum[loc.id] = i+1; });

  generateNewRoute();
  generateCompleteMark();
}

async function boot(){
  try{
    await Promise.all([
      document.fonts.load("24px 'Instrument Serif'"),
      document.fonts.load(`${TITLE_SIZE}px 'Instrument Serif'`),
      document.fonts.load(`italic ${TITLE_SIZE}px 'Instrument Serif'`),
      document.fonts.load(`350 ${LABEL_SIZE}px 'Geist'`)
    ]);
  } catch(e){}
  // agora que a fonte de verdade carregou, recalcula a largura do texto
  // horizontal com a métrica real (antes disso, usava a fonte de fallback)
  computeHorizontalLayout();
  try{
    LOCATIONS = await loadLocationsFromSheet();
  } catch(err){
    console.error(err);
    setStatus('Não foi possível carregar os dados da planilha agora. Recarregue a página em instantes.', true);
    return;
  }

  setupFromLocations();
  resolveMissingCoordinates();
}
boot();
</script>
