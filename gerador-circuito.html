<script>
/* ============================================================
   dados
   ============================================================ */
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1Zjux0r3uVJ8ua1ZXpWd68lOSP5Kj0XkU/gviz/tq?tqx=out:csv&sheet=Circuito';
const EVENT_TITLE = 'Circuito Paralelo Ateliês do Centro do Rio';
const TILE_SIZE = 256;
const TILE_URL = (z,x,y,s) => `https://${s}.basemaps.cartocdn.com/light_all/${z}/${x}/${y}.png`;

function parseCSV(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\r'){ /* ignore */ }
      else if (c === '\n'){ row.push(field); field = ''; rows.push(row); row = []; }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

async function loadLocationsFromSheet(){
  const res = await fetch(SHEET_CSV_URL);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const table = parseCSV(text).filter(r => r.some(c => c !== undefined && c.trim() !== ''));
  if (table.length < 2) throw new Error('planilha vazia');
  const headers = table[0].map(h => h.trim());
  const hIdx = {}; headers.forEach((h,i)=>hIdx[h]=i);
  const get = (row, name) => { const i = hIdx[name]; return (i!=null && row[i]!=null) ? row[i].trim() : ''; };
  const locMap = {}; const order = [];
  table.slice(1).forEach(row => {
    const local = get(row,'Local / Coletivo');
    const endereco = get(row,'Endereço');
    const nome = get(row,'Nome do Artista');
    if (!endereco && !nome) return;
    const latRaw = get(row,'Latitude');
    const lngRaw = get(row,'Longitude');
    const key = endereco;
    if (!locMap[key]){
      locMap[key] = {
        id: 'loc' + order.length, local, endereco,
        lat: latRaw ? parseFloat(latRaw.replace(',', '.')) : null,
        lng: lngRaw ? parseFloat(lngRaw.replace(',', '.')) : null,
        artistas: []
      };
      order.push(key);
    }
    if (nome) locMap[key].artistas.push(nome);
  });
  return order.map(k => locMap[k]);
}

/* ============================================================
   projeção web mercator — mesma matemática usada por qualquer
   mapa de tiles (osm/carto), pra desenhar o mapa direto no canvas
   e alinhar os pontos dos ateliês com a geografia real
   ============================================================ */
function project(lat, lon, zoom){
  const scale = Math.pow(2, zoom);
  const x = (lon + 180) / 360 * scale;
  const rad = lat * Math.PI/180;
  const y = (1 - Math.log(Math.tan(rad) + 1/Math.cos(rad)) / Math.PI) / 2 * scale;
  return { x, y };
}

function fitZoom(bounds, W, H, margin){
  for (let z = 19; z >= 2; z--){
    const p1 = project(bounds.maxLat, bounds.minLng, z);
    const p2 = project(bounds.minLat, bounds.maxLng, z);
    const pxW = (p2.x - p1.x) * TILE_SIZE;
    const pxH = (p2.y - p1.y) * TILE_SIZE;
    if (pxW <= (W - margin*2) && pxH <= (H - margin*2)) return z;
  }
  return 2;
}

function expandBounds(b, factor){
  const cLat = (b.minLat+b.maxLat)/2, cLng = (b.minLng+b.maxLng)/2;
  const spanLat = Math.max((b.maxLat-b.minLat)*factor, 0.002);
  const spanLng = Math.max((b.maxLng-b.minLng)*factor, 0.002);
  return { minLat:cLat-spanLat/2, maxLat:cLat+spanLat/2, minLng:cLng-spanLng/2, maxLng:cLng+spanLng/2 };
}

let proj = null; // { zoom, originX, originY, tile } — tile = tamanho efetivo do tile em px (com escala fracionária)
function pixelOf(lat, lon){
  const p = project(lat, lon, proj.zoom);
  return { x: (p.x - proj.originX) * proj.tile, y: (p.y - proj.originY) * proj.tile };
}

const SUBS = ['a','b','c','d'];
const OSRM_URL = 'https://routing.openstreetmap.de/routed-foot/route/v1/foot/';

// busca a rota real a pé entre dois ateliês via OSRM (servidor de demonstração
// público); se falhar ou estiver fora do ar, cai de volta pra linha reta
// nesse trecho, sem travar o resto do percurso
// suaviza os cantos de uma rota real (que segue esquinas em ângulo reto)
// sem se afastar muito do trajeto de fato — deixa o traço mais gracioso
function chaikinSmooth(points, iterations){
  let pts = points;
  for (let it = 0; it < iterations; it++){
    if (pts.length < 3) break;
    const next = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++){
      const p0 = pts[i], p1 = pts[i+1];
      next.push({ x: p0.x*0.8 + p1.x*0.2, y: p0.y*0.8 + p1.y*0.2 });
      next.push({ x: p0.x*0.2 + p1.x*0.8, y: p0.y*0.2 + p1.y*0.8 });
    }
    next.push(pts[pts.length-1]);
    pts = next;
  }
  return pts;
}

async function fetchRoute(locA, locB){
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 6000);
  try{
    const url = `${OSRM_URL}${locA.lng},${locA.lat};${locB.lng},${locB.lat}?overview=full&geometries=geojson`;
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.routes || !data.routes.length) throw new Error('sem rota retornada');
    const raw = data.routes[0].geometry.coordinates.map(([lon,lat]) => pixelOf(lat, lon));
    return chaikinSmooth(raw, 2);
  } catch(err){
    clearTimeout(timeoutId);
    console.warn('Rota indisponível para este trecho, usando linha reta:', err);
    return [pixelOf(locA.lat, locA.lng), pixelOf(locB.lat, locB.lng)];
  }
}
async function buildBasemap(bounds, W, H, margin){
  const expanded = expandBounds(bounds, 1.0);
  const zoom = fitZoom(expanded, W, H, margin);

  // zoom é um número inteiro (tiles só existem em potências de 2), mas isso
  // quase sempre deixa uma folga em volta da área — para o enquadramento
  // realmente preencher o quadro de ponta a ponta, calculamos uma escala
  // fracionária extra por cima do zoom inteiro escolhido (mesmo princípio do
  // zoomSnap:0 do Leaflet, só que feito manualmente aqui)
  const p1 = project(expanded.maxLat, expanded.minLng, zoom);
  const p2 = project(expanded.minLat, expanded.maxLng, zoom);
  const pxW = (p2.x - p1.x) * TILE_SIZE;
  const pxH = (p2.y - p1.y) * TILE_SIZE;
  const scale = Math.min(8, Math.max(1, Math.min((W - margin*2)/pxW, (H - margin*2)/pxH)));
  const tile = TILE_SIZE * scale;

  const cLat = (expanded.minLat+expanded.maxLat)/2, cLng = (expanded.minLng+expanded.maxLng)/2;
  const center = project(cLat, cLng, zoom);
  const originX = center.x - (W/2)/tile;
  const originY = center.y - (H/2)/tile;
  proj = { zoom, originX, originY, tile };

  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const octx = off.getContext('2d');
  octx.fillStyle = '#e9e9e9'; octx.fillRect(0,0,W,H);

  const txStart = Math.floor(originX), txEnd = Math.floor(originX + W/tile);
  const tyStart = Math.floor(originY), tyEnd = Math.floor(originY + H/tile);
  const maxTile = Math.pow(2, zoom);

  const jobs = [];
  for (let tx = txStart; tx <= txEnd; tx++){
    for (let ty = tyStart; ty <= tyEnd; ty++){
      if (ty < 0 || ty >= maxTile) continue;
      const wrappedX = ((tx % maxTile) + maxTile) % maxTile;
      const sub = SUBS[Math.abs(tx+ty) % SUBS.length];
      const url = TILE_URL(zoom, wrappedX, ty, sub);
      const px = (tx - originX) * tile;
      const py = (ty - originY) * tile;
      jobs.push(new Promise(resolve => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => { try{ octx.drawImage(img, px, py, tile, tile); }catch(e){} resolve(); };
        img.onerror = () => resolve();
        img.src = url;
      }));
    }
  }
  await Promise.all(jobs);

  // tom de cinza, igual ao tratamento do mapa no index.html
  try{
    const imgData = octx.getImageData(0,0,W,H);
    const d = imgData.data;
    for (let i=0;i<d.length;i+=4){
      const v = d[i]*0.3 + d[i+1]*0.59 + d[i+2]*0.11;
      const c = Math.min(255, (v-128)*1.08+128*1.03);
      d[i]=d[i+1]=d[i+2]=c;
    }
    octx.putImageData(imgData,0,0);
  } catch(e){
    console.warn('Não foi possível aplicar o tom de cinza (possível restrição de CORS dos tiles):', e);
  }
  return off;
}

/* ============================================================
   estado
   ============================================================ */
let LOCATIONS = [];
let PTS = [];
let alphaNum = {}; // loc.id -> número na ordem alfabética (mesma numeração em todo lugar)
let basemapCanvas = null;
const canvas = document.getElementById('art');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const statusEl = document.getElementById('status');
const locSelect = document.getElementById('loc-select');
const btnRestart = document.getElementById('btn-restart');
const btnRecord = document.getElementById('btn-record');
const btnStatic = document.getElementById('btn-static');
const btnDownload = document.getElementById('btn-download');
const recDot = document.getElementById('rec-dot');

function setStatus(msg, isError){
  statusEl.textContent = msg || '';
  statusEl.classList.toggle('error', !!isError);
}

/* ---- state machine da cobrinha ---- */
let tourOrder = [];
let legRoutes = []; // legRoutes[i] = pontos (px) da rota até tourOrder[i]
let fetchingLegs = new Set();
let visitedIdx = [];
let trail = [];
let head = { x:0, y:0 };
let targetIdx = 0;
let subIdx = 1; // próximo waypoint dentro de legRoutes[targetIdx]
let mode = 'idle'; // idle | moving | paused | finished | static
let pauseUntil = 0;
let activeCardLoc = null;
let rafId = null;
let lastTs = null;
const SPEED = 230; // px por segundo
const SAMPLE_DIST = 5;
const PAUSE_MS = 2800;

let mediaRecorder = null;
let recordedChunks = [];

function shuffledIndices(n){
  const arr = Array.from({length:n}, (_,i)=>i);
  for (let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

// busca a rota do trecho i em segundo plano, sem bloquear a animação —
// chamado com um trecho de folga, enquanto a cobrinha ainda está andando
// no trecho anterior
function ensureLegFetching(i){
  if (i >= tourOrder.length || legRoutes[i] || fetchingLegs.has(i)) return;
  fetchingLegs.add(i);
  const locA = PTS[tourOrder[i-1]].loc;
  const locB = PTS[tourOrder[i]].loc;
  fetchRoute(locA, locB).then(route => { legRoutes[i] = route; fetchingLegs.delete(i); });
}

async function startTour(){
  if (PTS.length < 2){ setStatus('não há ateliês suficientes com coordenadas.', true); return; }
  tourOrder = shuffledIndices(PTS.length);
  visitedIdx = [];
  legRoutes = [];
  fetchingLegs = new Set();
  activeCardLoc = null;

  // a cobrinha sempre entra pela margem inferior do quadro — lado da
  // Marina da Glória — esse primeiro trecho não tem rota real, então é
  // sempre reto e já está pronto de cara; a próxima rota é buscada em
  // segundo plano enquanto ela já está andando, sem tela de espera
  const spawn = { x: W/2, y: H + 30 };
  legRoutes[0] = [ { ...spawn }, { x: PTS[tourOrder[0]].x, y: PTS[tourOrder[0]].y } ];
  ensureLegFetching(1);

  trail = [{ ...spawn }];
  head = { ...spawn };
  targetIdx = 0;
  subIdx = 1;
  mode = 'moving';
  pauseUntil = 0;
  lastTs = null;
  setStatus('');
  if (!rafId) rafId = requestAnimationFrame(loop);
}

function loop(ts){
  rafId = requestAnimationFrame(loop);
  if (mode === 'static' || mode === 'idle') return;
  if (lastTs == null) lastTs = ts;
  const dt = (ts - lastTs) / 1000;
  lastTs = ts;

  if (mode === 'paused'){
    if (ts >= pauseUntil){
      if (targetIdx >= tourOrder.length){
        mode = 'finished';
        activeCardLoc = null;
        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
      } else {
        if (!legRoutes[targetIdx]){
          // a rota real ainda não chegou — segue de linha reta nesse trecho
          // pra não travar a animação esperando
          const locA = PTS[tourOrder[targetIdx-1]].loc;
          const locB = PTS[tourOrder[targetIdx]].loc;
          legRoutes[targetIdx] = [pixelOf(locA.lat, locA.lng), pixelOf(locB.lat, locB.lng)];
        }
        ensureLegFetching(targetIdx + 1);
        mode = 'moving';
        activeCardLoc = null;
      }
    }
    drawFrame();
    return;
  }

  if (mode === 'moving'){
    const route = legRoutes[targetIdx];
    const wp = route[subIdx];
    const dx = wp.x - head.x, dy = wp.y - head.y;
    const dist = Math.hypot(dx, dy);
    const step = SPEED * dt;
    if (dist <= step || dist < 0.5){
      head = { x: wp.x, y: wp.y };
      trail.push({ ...head });
      if (subIdx < route.length - 1){
        subIdx++;
      } else {
        // chegou no ateliê — fim deste trecho
        visitedIdx.push(tourOrder[targetIdx]);
        activeCardLoc = PTS[tourOrder[targetIdx]].loc;
        mode = 'paused';
        pauseUntil = ts + PAUSE_MS;
        targetIdx++;
        subIdx = 1;
      }
    } else {
      head = { x: head.x + dx/dist*step, y: head.y + dy/dist*step };
      const last = trail[trail.length-1];
      if (Math.hypot(head.x-last.x, head.y-last.y) >= SAMPLE_DIST) trail.push({ ...head });
    }
  }
  drawFrame();
}

document.getElementById('btn-restart').addEventListener('click', () => {
  mode = 'idle';
  startTour();
});

/* ============================================================
   desenho
   ============================================================ */
function pathLength(points){
  let len = 0;
  for (let i=1;i<points.length;i++) len += Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
  return len;
}
function pointAtDistance(points, dist){
  let d = 0;
  for (let i=1;i<points.length;i++){
    const seg = Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
    if (d+seg >= dist){
      const t = seg === 0 ? 0 : (dist-d)/seg;
      return {
        x: points[i-1].x + (points[i].x-points[i-1].x)*t,
        y: points[i-1].y + (points[i].y-points[i-1].y)*t,
        angle: Math.atan2(points[i].y-points[i-1].y, points[i].x-points[i-1].x)
      };
    }
    d += seg;
  }
  const last = points[points.length-1];
  return { x:last.x, y:last.y, angle:0 };
}
function drawTextAlongPath(text, points, fontSize, color, fadeZone){
  if (points.length < 2) return;
  const total = pathLength(points);
  if (total < fontSize) return;
  ctx.font = `${fontSize}px 'Instrument Serif', Georgia, serif`;
  const unit = text + '   ·   ';
  let d = 0, safety = 0;
  while (d < total && safety < 4000){
    for (const ch of unit){
      if (d >= total) break;
      const w = ctx.measureText(ch).width;
      const dEnd = d + w;
      let alpha = 1;
      if (fadeZone > 0){
        alpha = Math.max(0, Math.min(1, (total - d) / fadeZone));
      }
      const pt = pointAtDistance(points, d);
      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(pt.angle);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.fillText(ch, 0, 0);
      ctx.restore();
      d = dEnd;
      safety++;
    }
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawCard(loc){
  if (!loc) return;
  const artistas = loc.artistas || [];
  const rows = Math.ceil(artistas.length / 2);
  const cardX = 60, cardY = 60, cardW = 620, radius = 22;
  const headerH = 210;
  const rowH = 54;
  const cardH = artistas.length ? headerH + rows*rowH + 30 : headerH - 20;

  // fundo desfocado, igual ao efeito glass do drawer/lightbox do index.html
  ctx.save();
  roundRect(cardX, cardY, cardW, cardH, radius);
  ctx.clip();
  try{
    ctx.filter = 'blur(22px) saturate(1.1)';
    ctx.drawImage(basemapCanvas || canvas, -20, -20, W+40, H+40);
    ctx.filter = 'none';
  } catch(e){}
  ctx.restore();

  // painel translúcido + sombra suave + borda clara — mesma linguagem do
  // .drawer / .list-modal / .lightbox-modal do site
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.28)';
  ctx.shadowBlur = 46;
  ctx.shadowOffsetY = 18;
  roundRect(cardX, cardY, cardW, cardH, radius);
  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  ctx.fill();
  ctx.restore();

  ctx.save();
  roundRect(cardX, cardY, cardW, cardH, radius);
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.stroke();
  ctx.restore();

  const px = cardX + 40;
  let y = cardY + 76;

  // nome do espaço — mesma família e proporção do .drawer-title do site
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#111';
  ctx.font = "46px 'Instrument Serif', Georgia, serif";
  ctx.fillText(loc.local || loc.endereco, px, y);

  // endereço, direto embaixo do nome — mono e cinza, igual ao .drawer-addr
  y += 38;
  ctx.fillStyle = '#6b6b6b';
  ctx.font = "20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
  ctx.fillText(loc.endereco, px, y);

  if (artistas.length){
    y += 62;
    ctx.fillStyle = '#6b6b6b';
    ctx.font = "18px 'Instrument Serif', Georgia, serif";
    ctx.fillText('Artistas', px, y);
    y += 46;
    const col2X = px + (cardW - 80)/2;
    artistas.forEach((nome, i) => {
      const col = i % 2, rowN = Math.floor(i/2);
      const x = col === 0 ? px : col2X;
      const ry = y + rowN*rowH;
      ctx.fillStyle = '#111';
      // nomes dos artistas — família serif do site (.artist-name), o maior texto do bloco
      ctx.font = "34px 'Instrument Serif', Georgia, serif";
      ctx.fillText(nome, x, ry);
    });
  }
}

function drawFrame(){
  ctx.clearRect(0,0,W,H);
  if (basemapCanvas) ctx.drawImage(basemapCanvas, 0, 0);
  else { ctx.fillStyle = '#e9e9e9'; ctx.fillRect(0,0,W,H); }

  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5,0.5,W-1,H-1);

  const fadeZone = mode === 'moving' ? 60 : 0;
  drawTextAlongPath(EVENT_TITLE, trail, 30, 'rgba(17,17,17,0.92)', fadeZone);

  // marca da "cabeça" — reforça a sensação de que algo está andando,
  // não só um texto se desenhando sozinho
  if (mode === 'moving' || mode === 'paused'){
    const pulse = 1 + Math.sin(performance.now()/260) * 0.18;
    ctx.beginPath();
    ctx.arc(head.x, head.y, 11*pulse, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(17,17,17,0.10)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(head.x, head.y, 5.5, 0, Math.PI*2);
    ctx.fillStyle = '#111';
    ctx.fill();
  }

  // todos os pontos dos ateliês já ficam visíveis desde o início, com o
  // mesmo visual de pino do site — numerados em ordem alfabética, sempre
  // com o mesmo número (não é a ordem em que a cobrinha visita)
  PTS.forEach((p) => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 15, 0, Math.PI*2);
    ctx.fillStyle = '#111';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#fff';
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = "12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(alphaNum[p.loc.id]).padStart(2,'0'), p.x, p.y + 0.5);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  });

  if (activeCardLoc) drawCard(activeCardLoc);
}

/* ============================================================
   imagem estática de um espaço específico
   ============================================================ */
async function buildStaticRoute(targetLocId){
  const targetPtIdx = PTS.findIndex(p => p.loc.id === targetLocId);
  if (targetPtIdx < 0) return;
  const others = shuffledIndices(PTS.length).filter(i => i !== targetPtIdx);
  const n = Math.min(others.length, 3 + Math.floor(Math.random()*3)); // 3 a 5 antes do alvo
  const route = [...others.slice(0, n), targetPtIdx];

  setStatus('calculando o caminho pelas ruas…');
  const spawn = { x: W/2, y: H + 30 };
  const segments = [[ { ...spawn }, { x: PTS[route[0]].x, y: PTS[route[0]].y } ]];
  const fetches = [];
  for (let i = 1; i < route.length; i++){
    fetches.push(fetchRoute(PTS[route[i-1]].loc, PTS[route[i]].loc).then(r => { segments[i] = r; }));
  }
  await Promise.all(fetches);

  trail = [];
  segments.forEach(seg => { seg.forEach(p => trail.push({ ...p })); });
  visitedIdx = route;
  activeCardLoc = PTS[targetPtIdx].loc;
  mode = 'static';
  setStatus('imagem estática gerada — use "baixar PNG" ao lado.');
  drawFrame();
}

/* ============================================================
   UI
   ============================================================ */
function renderLocSelect(){
  locSelect.innerHTML = '';
  const sorted = [...PTS].sort((a,b) =>
    (a.loc.local||a.loc.endereco).localeCompare(b.loc.local||b.loc.endereco, 'pt-BR', {sensitivity:'base'}));
  sorted.forEach((p) => {
    const opt = document.createElement('option');
    opt.value = p.loc.id;
    opt.textContent = `${String(alphaNum[p.loc.id]).padStart(2,'0')} — ${p.loc.local || p.loc.endereco}`;
    locSelect.appendChild(opt);
  });
}

btnStatic.addEventListener('click', () => {
  if (!locSelect.value) return;
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  recDot.classList.remove('on');
  buildStaticRoute(locSelect.value);
});

btnDownload.addEventListener('click', () => {
  try{
    canvas.toBlob(blob => {
      if (!blob){ setStatus('Não foi possível gerar o PNG.', true); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'circuito-paralelo-vivo.png';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }, 'image/png');
  } catch(err){
    console.error(err);
    setStatus('Exportação bloqueada — provavelmente os tiles do mapa não liberam CORS para exportação de canvas. Tente novamente ou avise que ajustamos a fonte do mapa.', true);
  }
});

btnRecord.addEventListener('click', () => {
  if (!('MediaRecorder' in window)){
    setStatus('Este navegador não suporta gravação de vídeo (tente no Chrome ou Firefox).', true);
    return;
  }
  let stream;
  try{
    stream = canvas.captureStream(30);
  } catch(err){
    setStatus('Não foi possível capturar o canvas para vídeo.', true);
    return;
  }
  const mimeCandidates = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mimeType = mimeCandidates.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  try{
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  } catch(err){
    setStatus('Não foi possível iniciar a gravação neste navegador.', true);
    return;
  }
  recordedChunks = [];
  mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    recDot.classList.remove('on');
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'circuito-paralelo-vivo.webm';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    setStatus('vídeo pronto — download iniciado (.webm).');
  };
  setStatus('gravando… o vídeo é baixado automaticamente quando o percurso terminar.');
  recDot.classList.add('on');
  mediaRecorder.start();
  startTour();
});

/* ============================================================
   boot
   ============================================================ */
async function boot(){
  try{
    await Promise.all([
      document.fonts.load("30px 'Instrument Serif'"),
      document.fonts.load("34px 'Instrument Serif'")
    ]);
  } catch(e){}

  try{
    LOCATIONS = await loadLocationsFromSheet();
  } catch(err){
    console.error(err);
    setStatus('Não foi possível carregar os dados da planilha agora. Recarregue a página em instantes.', true);
    return;
  }

  const withCoords = LOCATIONS.filter(l => l.lat != null && l.lng != null);
  if (withCoords.length < 2){
    setStatus('poucos ateliês com coordenadas preenchidas ainda — volte quando a planilha tiver mais endereços geocodificados.', true);
    return;
  }
  const bounds = {
    minLat: Math.min(...withCoords.map(l=>l.lat)),
    maxLat: Math.max(...withCoords.map(l=>l.lat)),
    minLng: Math.min(...withCoords.map(l=>l.lng)),
    maxLng: Math.max(...withCoords.map(l=>l.lng)),
  };

  setStatus('carregando mapa…');
  try{
    basemapCanvas = await buildBasemap(bounds, W, H, 30);
  } catch(err){
    console.warn('Mapa indisponível, seguindo com fundo neutro:', err);
  }
  setStatus('');

  PTS = withCoords.map(loc => {
    const { x, y } = pixelOf(loc.lat, loc.lng);
    return { loc, x, y };
  });

  const sortedForNum = [...withCoords].sort((a,b) =>
    (a.local||a.endereco).localeCompare(b.local||b.endereco, 'pt-BR', {sensitivity:'base'}));
  alphaNum = {};
  sortedForNum.forEach((loc,i) => { alphaNum[loc.id] = i+1; });

  renderLocSelect();
  startTour();
}
boot();
</script>
