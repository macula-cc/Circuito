<style>
  :root{
    --serif: 'Instrument Serif', Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --ink:#111; --line: rgba(0,0,0,0.15); --gray:#6b6b6b; --hover:#f0f0f0; --paper:#fff;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; color:var(--ink); font-family:var(--sans); background:var(--paper); }
  a{ color:inherit; text-decoration:none; }
  button, select{ font:inherit; touch-action:manipulation; }

  .nav{ display:flex; gap:2px; font-family:var(--mono); font-size:0.75rem;
        background:#f4f4f4; border:1px solid var(--line); border-radius:999px; padding:3px; width:max-content; margin-bottom:1.6rem; }
  .nav a{ padding:0.5rem 0.9rem; border-radius:999px; color:var(--gray); }
  .nav a.active{ background:#111; color:#fff; }
  .nav a:not(.active):hover{ background:var(--hover); color:var(--ink); }

  .wrap{ display:grid; grid-template-columns:400px 1fr; min-height:100vh; }
  @media (max-width:900px){ .wrap{ grid-template-columns:1fr; } }

  .panel{ padding:calc(1.6rem + env(safe-area-inset-top)) 1.6rem 2rem; border-right:1px solid var(--line);
          overflow-y:auto; max-height:100vh; }
  @media (max-width:900px){ .panel{ border-right:none; border-bottom:1px solid var(--line); max-height:none; } }

  h1{ font-family:var(--serif); font-weight:400; font-size:2.1rem; line-height:1.05; margin:0 0 0.2rem; }
  .sub{ font-family:var(--mono); font-size:0.79rem; color:var(--gray); margin-bottom:1.6rem; }

  .field{ margin-bottom:1.6rem; }
  .field label{ display:block; font-family:var(--mono); font-size:0.73rem; text-transform:uppercase;
                letter-spacing:0.04em; color:var(--gray); margin-bottom:0.5rem; }
  select{ width:100%; padding:0.65rem 0.7rem; border:1px solid var(--ink); border-radius:0; background:#fff;
          color:var(--ink); font-family:var(--sans); font-size:0.94rem; }

  .row-btns{ display:flex; gap:0.5rem; flex-wrap:wrap; }
  .btn{ font-family:var(--mono); font-size:0.79rem; background:#fff; color:var(--ink); border:1px solid var(--ink);
        padding:0.6rem 0.9rem; cursor:pointer; border-radius:0; transition:background 0.15s ease, color 0.15s ease; }
  .btn:hover{ background:var(--ink); color:#fff; }
  .btn.active{ background:var(--ink); color:#fff; }
  .btn.primary{ background:var(--ink); color:#fff; flex:1; padding:0.85rem; font-size:0.83rem; }
  .btn.primary:hover{ opacity:0.8; }
  .btn:disabled{ opacity:0.35; cursor:default; pointer-events:none; }

  .status{ font-family:var(--mono); font-size:0.75rem; color:var(--gray); margin-top:0.9rem; min-height:1.2em; line-height:1.4; }
  .status.error{ color:#9A3324; }
  .note{ font-family:var(--mono); font-size:0.73rem; color:var(--gray); line-height:1.4; }

const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1Zjux0r3uVJ8ua1ZXpWd68lOSP5Kj0XkU/gviz/tq?tqx=out:csv&sheet=Circuito';

// layout — post do artista: uma faixa de marquee em cima e outra embaixo
// (sempre no mesmo cinza/preto, independente do tema de fundo escolhido —
// mesmo princípio do .event-marquee/.map-dim do site), foto em sangria
// total no meio, nome + endereço em Inter logo abaixo da foto
const MARQUEE_BAR_H = 80;
const MARGIN = 44;
const PHOTO_BOX = { x: 0, y: MARQUEE_BAR_H, w: LOGICAL, h: 620 };
const NAME_SIZE = 76;
const ADDR_SIZE = 27;
const NAME_Y = PHOTO_BOX.y + PHOTO_BOX.h + 92;
const ADDR_Y = NAME_Y + 48;
// nome que não cabe numa linha só (ex: "Francisco 'Chiko' Guimarães") quebra
// em até duas linhas, no MESMO tamanho de fonte (NAME_SIZE) — não encolhe,
// só quebra — reaproveitando o mesmo espaço vertical reservado entre a foto
// e a faixa de baixo, com entrelinha mais justa pra caber sem encostar em nada
const NAME_WRAP_LINE_GAP = NAME_SIZE * 0.92; // entrelinha justa entre as duas linhas do nome
const NAME_WRAP_ADDR_GAP = 46; // última linha do nome → endereço
// margem de cima (foto → topo visual da 1ª linha do nome) igual à margem
// de baixo (base visual do endereço → faixa debaixo). NAME_WRAP_GAP0 mede
// da foto até a BASELINE do nome, não até o topo visível da letra — só
// igualar essa distância à distância endereço→faixa deixava a margem de
// cima bem menor na prática, porque o nome (76px) tem uma letra bem mais
// alta acima da baseline do que o endereço (27px) tem abaixo dela. Por
// isso essa conta só fecha de verdade depois que as fontes carregam de
// vez (ver computeNameWrapGap0(), chamada no boot() com métrica real de
// ascent/descent — não dá pra confiar em medir com a fonte de fallback)
let NAME_WRAP_GAP0 = 60; // valor inicial de segurança, substituído no boot()
function computeNameWrapGap0(){
  // actualBoundingBoxAscent/Descent de um texto de exemplo REALISTA (não
  // fontBoundingBox — essa métrica da fonte inclui uma folga própria do
  // desenho da fonte que, testado, não bate com o espaço em branco que o
  // olho realmente vê em volta da letra; e não o pior caso possível tipo
  // "Áç" — isso ficava consistente mas puxava a margem de cima bem mais
  // funda que o necessário pra nomes comuns sem acento)
  ectx.font = `500 ${NAME_SIZE}px ${SANS_DISPLAY}`;
  const nameAscent = ectx.measureText('Guimarães').actualBoundingBoxAscent;
  ectx.font = `400 ${ADDR_SIZE}px ${SANS_DISPLAY}`;
  const addrDescent = ectx.measureText('Praça XV de Novembro').actualBoundingBoxDescent;
  const totalSpace = (LOGICAL - MARQUEE_BAR_H) - (PHOTO_BOX.y + PHOTO_BOX.h);
  NAME_WRAP_GAP0 = (totalSpace - NAME_WRAP_LINE_GAP - NAME_WRAP_ADDR_GAP - addrDescent + nameAscent) / 2;
}

const EVT_LABEL_L = 'CIRCUITO DE ATELIÊS DO CENTRO';

// tamanho calculado a partir da altura de caixa alta do serifado das
// estatísticas (ver computeEvtLabelSize, chamada no boot() depois que a
// fonte de verdade carrega) — 0.85x o match exato, que ficou grande/pesado
// demais visualmente (sans em caixa alta "pesa" mais que serifado na mesma
// altura de caixa)
const EVT_LABEL_SIZE_FACTOR = 0.85;
let EVT_LABEL_SIZE = 26;
const EVT_LABEL_Y = 930; // mesma margem inferior que as estatísticas tinham antes
const EVT_STATS_Y = EVT_LABEL_Y - 44; // acima do label
function computeEvtLabelSize(){
  ectx.font = `${EVT_STATS_SIZE}px 'Instrument Serif', Georgia, serif`;
  const serifCap = ectx.measureText('E').actualBoundingBoxAscent;
  ectx.font = `${EVT_LABEL_WEIGHT} 100px ${SANS_DISPLAY}`;
  const sansCapPer100 = ectx.measureText('E').actualBoundingBoxAscent / 100;
  EVT_LABEL_SIZE = (serifCap / sansCapPer100) * EVT_LABEL_SIZE_FACTOR;
}

function parseCSV(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\r'){ /* ignore */ }
      else if (c === '\n'){ row.push(field); field = ''; rows.push(row); row = []; }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

// alguns endereços chegam da planilha com coordenada mal digitada (ex:
// sem separador decimal, tipo "-229115" em vez de "-22,9115") — passar
// isso direto pro MapLibre derruba o mapa inteiro (ele lança exceção e
// nenhum pino aparece, nem os de outros endereços válidos). Em vez disso,
// tratamos como coordenada ainda não preenchida.
// valida o FORMATO inteiro (não só o valor numérico) antes de aceitar: sem
// isso, algo como "-22.917.173" (pontos demais, geralmente formatação de
// milhar aplicada por engano em cima de uma vírgula decimal original) passa
// pelo parseFloat, que lê só até o segundo ponto e trunca silenciosamente
// pra "-22.917" — um valor plausível mas ERRADO, que fica dentro do
// intervalo válido e por isso não seria pego pelo teste de min/max sozinho.
function parseCoord(raw, min, max){
  if (!raw) return null;
  const normalized = raw.trim().replace(',', '.');
  if (!/^-?\d{1,3}(\.\d+)?$/.test(normalized)) return null;
  const n = parseFloat(normalized);
  return (isNaN(n) || n < min || n > max) ? null : n;
}

const EXCLUDE_FROM_MARK = new Set([

// muitos artistas colam o link de "Compartilhar" do Google Drive (que abre
// o visualizador em HTML, exige login, não é uma imagem de verdade) em vez
// de uma URL de imagem direta. drive.google.com/thumbnail?id=... resolve a
// imagem certa, mas faz isso via um redirect (302) que não carrega CORS no
// próprio redirect — só no destino final — e isso é suficiente pra travar
// o navegador quando a imagem entra num <canvas> (nosso caso: SVG vira PNG/
// PDF). lh3.googleusercontent.com/d/{id}=w1000 é o destino final desse
// redirect, chamado direto: uma única resposta, sem redirect, com CORS
// liberado (testado e confirmado: canvas.toDataURL() funciona sem taint).
function resolveDrivePhotoURL(url){
  const m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}=w1000` : url;
}

async function loadLocationsFromSheet(){
  const res = await fetch(`${SHEET_CSV_URL}&_=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const table = parseCSV(text).filter(r => r.some(c => c !== undefined && c.trim() !== ''));
  if (table.length < 2) throw new Error('planilha vazia');
  const headers = table[0].map(h => h.trim());
  const hIdx = {}; headers.forEach((h,i)=>hIdx[h]=i);
  const get = (row, name) => { const i = hIdx[name]; return (i!=null && row[i]!=null) ? row[i].trim() : ''; };
  const locMap = {}; const order = [];
  table.slice(1).forEach(row => {
    const local = get(row,'Local / Coletivo');
    const endereco = get(row,'Endereço');
    const nome = get(row,'Nome do Artista');
    if (!endereco && !nome) return;
    const instagram = get(row,'Instagram').replace(/^@/, '');
    const foto = resolveDrivePhotoURL(get(row,'Foto do trabalho (URL)'));
    const latRaw = get(row,'Latitude');
    const lngRaw = get(row,'Longitude');
    const key = endereco;
    if (!locMap[key]){
      locMap[key] = {
        id: 'loc' + order.length, local, endereco,
        lat: CURATED_COORDS[endereco] ? CURATED_COORDS[endereco].lat : parseCoord(latRaw, -90, 90),
        lng: CURATED_COORDS[endereco] ? CURATED_COORDS[endereco].lng : parseCoord(lngRaw, -180, 180),
        artistas: []
      };
      order.push(key);
    }
    locMap[key].artistas.push({ nome, instagram, foto });
  });
  return order.map(k => locMap[k]);
}

function initials(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

function expandBounds(b, factor){
  const cLat = (b.minLat+b.maxLat)/2, cLng = (b.minLng+b.maxLng)/2;
  const spanLat = Math.max((b.maxLat-b.minLat)*factor, 0.002);
  const spanLng = Math.max((b.maxLng-b.minLng)*factor, 0.002);
  return { minLat:cLat-spanLat/2, maxLat:cLat+spanLat/2, minLng:cLng-spanLng/2, maxLng:cLng+spanLng/2 };
}
function computeFitTransform(points, box, fillFraction){
  const xs = points.map(p=>p.x), ys = points.map(p=>p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const w = (maxX-minX) || 1, h = (maxY-minY) || 1;
  const scale = Math.min(box.w*fillFraction/w, box.h*fillFraction/h);
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  const boxCx = box.x + box.w/2, boxCy = box.y + box.h/2;
  return { scale, cx, cy, boxCx, boxCy };
}
function applyFitTransform(points, t){
  return points.map(p => ({ ...p, x: t.boxCx + (p.x-t.cx)*t.scale, y: t.boxCy + (p.y-t.cy)*t.scale }));
}
/* ============================================================
   mapa real (MapLibre GL, mesmo estilo xerox do index.html) — usado no
   post do evento. Renderizado fora da tela num container escondido, e
   serve pra duas coisas: (1) fonte da imagem de fundo
   (buildEvtBasemapMapLibre) e (2) fonte da projeção geográfica exata dos
   pontos (mlMap.project), garantindo por construção que os pinos caiam
   exatamente em cima das ruas certas — sem reimplementar a matemática de
   projeção Mercator/zoom de tiles à mão.
   ============================================================ */

// mesma paleta/lógica de recoloração do index.html — ver comentários lá
const MONO_COLORS = {
  background: '#ececec', water: '#f8f8f8', landuse: '#ececec',
  building: '#ececec', buildingOutline: '#ececec',
  road: '#ffffff', roadCasing: '#ffffff', boundary: '#cccccc',
  text: '#111111', textHalo: '#ffffff'
};
function applyMonochromeStyle(mlMap){
  const layers = mlMap.getStyle().layers || [];
  let buildingSource = null, buildingSourceLayer = null;
  let firstSymbolId = null;
  layers.forEach(layer => {
    const id = layer.id.toLowerCase();
    const sl = (layer['source-layer'] || '').toLowerCase();
    const isWater = id.includes('water') || sl.includes('water');
    const isBuilding = sl === 'building' || id.includes('building');
    const isRoad = sl === 'transportation' && layer.type === 'line';
    const isCasing = id.includes('casing');
    const isBoundary = sl === 'boundary';
    if (isBuilding && layer.type === 'fill'){ buildingSource = layer.source; buildingSourceLayer = layer['source-layer']; }
    if (layer.type === 'symbol' && firstSymbolId === null){ firstSymbolId = layer.id; }
    try{
      if (layer.type === 'fill-extrusion'){
        mlMap.setLayoutProperty(layer.id, 'visibility', 'none');
      } else if (layer.type === 'background'){
        mlMap.setPaintProperty(layer.id, 'background-color', MONO_COLORS.background);
      } else if (layer.type === 'fill'){
        const color = isWater ? MONO_COLORS.water : (isBuilding ? MONO_COLORS.building : MONO_COLORS.landuse);
        mlMap.setPaintProperty(layer.id, 'fill-color', color);
      } else if (layer.type === 'line'){
        let color = MONO_COLORS.landuse;
        if (isWater) color = MONO_COLORS.water;
        else if (isBoundary) color = MONO_COLORS.boundary;
        else if (isRoad) color = isCasing ? MONO_COLORS.roadCasing : MONO_COLORS.road;
        mlMap.setPaintProperty(layer.id, 'line-color', color);
      } else if (layer.type === 'symbol'){
        const isGenericPoi = sl === 'poi' && /^poi_r\d+$/.test(id);
        const isTransitPoi = id === 'poi_transit';
        if (isGenericPoi || isTransitPoi){
          mlMap.setLayoutProperty(layer.id, 'visibility', 'none');
          return;
        }
        mlMap.setPaintProperty(layer.id, 'text-color', MONO_COLORS.text);
        mlMap.setPaintProperty(layer.id, 'text-halo-color', MONO_COLORS.textHalo);
        mlMap.setPaintProperty(layer.id, 'icon-opacity', 0);
      }
    } catch(e){ /* propriedade pode não existir nessa camada específica — ignora */ }
  });
  if (buildingSource && !mlMap.getLayer('building_outline_xerox')){
    mlMap.addLayer({
      id: 'building_outline_xerox', type: 'line',
      source: buildingSource, 'source-layer': buildingSourceLayer,
      paint: { 'line-color': MONO_COLORS.buildingOutline, 'line-width': 1 }
    }, firstSymbolId || undefined);
  }
}

let mlMap = null; // instância MapLibre viva — pixelOfEvt() projeta através dela
function pixelOfEvt(lat, lon){
  const p = mlMap.project([lon, lat]);
  return { x: EVT_MAP_BOX.x + p.x, y: EVT_MAP_BOX.y + p.y };
}

let evtBasemapCanvas = null;
let evtBasemapLoading = false;
async function buildEvtBasemapMapLibre(bounds, margin){
  if (evtBasemapLoading) return;
  evtBasemapLoading = true;
  const expanded = expandBounds(bounds, 1.0);
  if (mlMap){ mlMap.remove(); mlMap = null; }

  const container = document.getElementById('map-offscreen');
  container.style.width = EVT_MAP_BOX.w + 'px';
  container.style.height = EVT_MAP_BOX.h + 'px';
  container.innerHTML = '';

  mlMap = new maplibregl.Map({
    container,
    style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [(expanded.minLng+expanded.maxLng)/2, (expanded.minLat+expanded.maxLat)/2],
    zoom: 15,
    pitch: 0,
    maxPitch: 0,
    attributionControl: false,
    interactive: false,
    // sem isso o WebGL limpa o buffer de desenho antes da gente conseguir
    // ler os pixels via drawImage — necessário pra capturar o canvas depois
    preserveDrawingBuffer: true
  });

  await new Promise(resolve => mlMap.on('load', resolve));
  applyMonochromeStyle(mlMap);
  mlMap.fitBounds(
    [[expanded.minLng, expanded.minLat], [expanded.maxLng, expanded.maxLat]],
    { padding: margin, duration: 0 }
  );
  // 'idle' garante que o estilo recolorido E o enquadramento (fitBounds)
  // já renderizaram pelo menos um quadro antes da gente projetar pontos
  // (pixelOfEvt) ou capturar o canvas
  await new Promise(resolve => mlMap.once('idle', resolve));

  const off = document.createElement('canvas');
  off.width = EVT_MAP_BOX.w; off.height = EVT_MAP_BOX.h;
  const octx = off.getContext('2d');
  octx.drawImage(mlMap.getCanvas(), 0, 0, EVT_MAP_BOX.w, EVT_MAP_BOX.h);
  evtBasemapCanvas = off;
  evtBasemapLoading = false;
}

/* ============================================================
   caminho reto/curvo entre dois pontos, comprimento, sub-trecho
   ============================================================ */
function buildLegPath(a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  if (Math.random() < 0.35 || len < 0.09){
    return [ { x:a.x, y:a.y }, { x:b.x, y:b.y } ];
  }
  const nx = -dy/len, ny = dx/len;
  const side = Math.random() < 0.5 ? 1 : -1;
  const offset = len * (0.08 + Math.random()*0.14) * side;
  const mx = (a.x+b.x)/2 + nx*offset;
  const my = (a.y+b.y)/2 + ny*offset;
  const N = 16;
  const pts = [];
  for (let i=0;i<=N;i++){
    const t = i/N;
    const it = 1-t;
    pts.push({
      x: it*it*a.x + 2*it*t*mx + t*t*b.x,
      y: it*it*a.y + 2*it*t*my + t*t*b.y
    });
  }
  return pts;
}
function pathLength(points){
  let len = 0;
  for (let i=1;i<points.length;i++) len += Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
  return len;
}
function pointAtDistance(points, dist){
  let d = 0;
  for (let i = 1; i < points.length; i++){
    const seg = Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
    if (d + seg >= dist){
      const t = seg === 0 ? 0 : (dist-d)/seg;
      return {
        x: points[i-1].x + (points[i].x-points[i-1].x)*t,
        y: points[i-1].y + (points[i].y-points[i-1].y)*t,
        angle: Math.atan2(points[i].y-points[i-1].y, points[i].x-points[i-1].x)
      };
    }
    d += seg;
  }
  const last = points[points.length-1];
  return { x:last.x, y:last.y, angle:0 };
}
// texto seguindo o caminho da marca — mesmo estilo alternado (sans em caixa
// alta / serifado com a data em itálico) da fita do gerador de marca, só
// que em canvas em vez de SVG
const RIBBON_SEP = '   ·   ';
function buildRibbonRuns(serifFontSize){
  function xAscent(fontSize, fontFamily, weight){
    ectx.font = `${weight ? weight+' ' : ''}${fontSize}px ${fontFamily}`;
    return ectx.measureText('x').actualBoundingBoxAscent;
  }
  const serifFamily = "'Instrument Serif', Georgia, serif";
  const serifAscent = xAscent(serifFontSize, serifFamily, '400');
  const sansAscentAtSerifSize = xAscent(serifFontSize, SANS_DISPLAY, '350');
  const sansFontSize = serifFontSize * (serifAscent / sansAscentAtSerifSize) * 0.85;
  const sansLabel = EVT_LABEL_L;
  return [
    { text: sansLabel, fontFamily: SANS_DISPLAY, weight:'350', fontSize: sansFontSize },
    { text: RIBBON_SEP, fontFamily: SANS_DISPLAY, weight:'350', fontSize: sansFontSize },
    { text: `${EVENT_EYEBROW} `, fontFamily: serifFamily, weight:'400', fontSize: serifFontSize },
    { text: EVENT_DATES, fontFamily: serifFamily, weight:'400', fontSize: serifFontSize, italic:true },
    { text: RIBBON_SEP, fontFamily: serifFamily, weight:'400', fontSize: serifFontSize }
  ];
}
function drawRibbonAlongPath(ctx2d, points, serifFontSize, color){
  const total = pathLength(points);
  if (total < serifFontSize) return;
  const runs = buildRibbonRuns(serifFontSize);
  const chars = [];
  runs.forEach(run => { for (const ch of run.text) chars.push({ ch, run }); });
  ctx2d.fillStyle = color;
  ctx2d.textAlign = 'left'; ctx2d.textBaseline = 'middle';
  let d = 0, charPos = 0, safety = 0;
  while (d < total && safety < 4000){
    const item = chars[charPos % chars.length];
    const run = item.run;
    ctx2d.font = `${run.italic ? 'italic ' : ''}${run.weight ? run.weight+' ' : ''}${run.fontSize}px ${run.fontFamily}`;
    const w = ctx2d.measureText(item.ch).width;
    const pt = pointAtDistance(points, d);
    ctx2d.save();
    ctx2d.translate(pt.x, pt.y);
    ctx2d.rotate(pt.angle);
    ctx2d.fillText(item.ch, 0, 0);
    ctx2d.restore();
    d += w;
    charPos++;
    safety++;
  }
}
function subPathUpTo(points, dist){
  const out = [points[0]];
  let d = 0;
  for (let i = 1; i < points.length; i++){
    const seg = Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
    if (d + seg >= dist){
      const t = seg === 0 ? 0 : (dist-d)/seg;
      out.push({ x: points[i-1].x + (points[i].x-points[i-1].x)*t, y: points[i-1].y + (points[i].y-points[i-1].y)*t });
      return out;
    }
    out.push(points[i]);
    d += seg;
  }
  return out;
}
function escapeXML(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// faixa de marquee (mesmo texto/hierarquia do .event-marquee do site: rótulo
// sans maiúsculo + "Ateliês abertos" serifado com a data em itálico) — cor
// fixa (cinza claro + tinta preta), igual em cima/embaixo, independente do
// tema de fundo escolhido. Usa `ectx` (canvas escondido já existente no
// arquivo) só pra medir largura de texto e encadear os pedaços lado a lado.
// calcula tamanhos/larguras dos 3 pedaços do marquee (rótulo + data),
// escalados pra usar a largura disponível inteira — única fonte de verdade
// desse cálculo, usada tanto pelo SVG (prévia) quanto pelo canvas (export)
function computeMarqueeLayout(h){
  const labelTxt = EVENT_TITLE.toUpperCase();
  const eyebrowTxt = EVENT_EYEBROW + ' ';
  const available = LOGICAL - MARGIN*2;

  function measure(lblSize, dtSize){
    ectx.letterSpacing = `${(lblSize*-0.025).toFixed(2)}px`; // .marquee-item: letter-spacing:-0.025em
    ectx.font = `350 ${lblSize.toFixed(2)}px ${SANS_DISPLAY}`; // .marquee-item: font-weight:350
    const labelW = ectx.measureText(labelTxt).width;
    ectx.letterSpacing = '0px';
    ectx.font = `${dtSize.toFixed(2)}px 'Instrument Serif', Georgia, serif`;
    const eyebrowW = ectx.measureText(eyebrowTxt).width;
    ectx.font = `italic ${dtSize.toFixed(2)}px 'Instrument Serif', Georgia, serif`;
    const dateW = ectx.measureText(EVENT_DATES).width;
    const gap = lblSize * 0.35; // aproxima os dois blocos (rótulo e data)
    return { labelW, eyebrowW, dateW, gap, total: labelW + gap + eyebrowW + dateW };
  }

  let labelSize = h * 0.4;
  let dateSize = labelSize * (2.2/1.75); // mesma proporção do .marquee-item/.marquee-date do site
  let m = measure(labelSize, dateSize);
  // sempre escala pra usar a largura disponível inteira (cresce ou encolhe,
  // mantendo a proporção entre rótulo e data), terminando exatamente na
  // mesma margem usada do lado esquerdo (MARGIN) — sem deixar o texto
  // passar da altura da própria faixa
  let scale = available / m.total;
  const maxLabelSize = h * 0.7;
  if (labelSize * scale > maxLabelSize) scale = maxLabelSize / labelSize;
  labelSize *= scale; dateSize *= scale;
  m = measure(labelSize, dateSize);

  return { labelTxt, eyebrowTxt, labelSize, dateSize, m };
}
// prévia (SVG ao vivo, dentro do próprio documento — fontes da página
// carregam normal, sem risco nenhum de blob isolado)
function buildMarqueeBarSVG(y, h, opts){
  const skipText = opts && opts.skipText;
  const midY = (y + h/2 + h*0.06).toFixed(2); // pequeno ajuste: dominant-baseline="middle" tende a subir um pouco visualmente
  // fundo cinza (#d8d8d6) some contra um artboard cinza (mesmo tom) — nesse
  // caso o marquee vira branco pra manter contraste
  const marqueeBg = currentTheme === 'cinza' ? '#ffffff' : '#d8d8d6';
  let s = `<rect x="0" y="${y.toFixed(2)}" width="${LOGICAL}" height="${h.toFixed(2)}" fill="${marqueeBg}"/>`;
  if (skipText) return s; // exportação: o texto é desenhado depois, direto no canvas (ver drawMarqueeBarCanvas)

  const { labelTxt, eyebrowTxt, labelSize, dateSize, m } = computeMarqueeLayout(h);
  let x = MARGIN;
  const labelLS = (labelSize*-0.025).toFixed(2);

  s += `<text x="${x.toFixed(2)}" y="${midY}" font-family="${SANS_DISPLAY}" font-weight="350" letter-spacing="${labelLS}" font-size="${labelSize.toFixed(2)}" fill="#111111" dominant-baseline="middle">${escapeXML(labelTxt)}</text>`;
  x += m.labelW + m.gap;

  s += `<text x="${x.toFixed(2)}" y="${midY}" font-family="'Instrument Serif', Georgia, serif" font-size="${dateSize.toFixed(2)}" fill="#111111" dominant-baseline="middle">${escapeXML(eyebrowTxt)}</text>`;
  x += m.eyebrowW;

  s += `<text x="${x.toFixed(2)}" y="${midY}" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="${dateSize.toFixed(2)}" fill="#111111" dominant-baseline="middle">${escapeXML(EVENT_DATES)}</text>`;

  return s;
}
// exportação: desenha o mesmo marquee direto no canvas de destino (bitmap
// de verdade, não SVG) — ver comentário grande em rasterizeSVG sobre por
// que isso é necessário
function drawMarqueeBarCanvas(cctx, y, h){
  const midY = y + h/2 + h*0.06;
  const { labelTxt, eyebrowTxt, labelSize, dateSize, m } = computeMarqueeLayout(h);
  cctx.textBaseline = 'middle';
  cctx.fillStyle = '#111111';
  let x = MARGIN;

  cctx.font = `350 ${labelSize.toFixed(2)}px ${SANS_DISPLAY}`;
  try{ cctx.letterSpacing = `${(labelSize*-0.025).toFixed(2)}px`; }catch(e){}
  cctx.fillText(labelTxt, x, midY);
  try{ cctx.letterSpacing = '0px'; }catch(e){}
  x += m.labelW + m.gap;

  cctx.font = `${dateSize.toFixed(2)}px 'Instrument Serif', Georgia, serif`;
  cctx.fillText(eyebrowTxt, x, midY);
  x += m.eyebrowW;

  cctx.font = `italic ${dateSize.toFixed(2)}px 'Instrument Serif', Georgia, serif`;
  cctx.fillText(EVENT_DATES, x, midY);
  cctx.textBaseline = 'alphabetic';
}
// nome do artista: usa NAME_SIZE numa linha só sempre que couber (caso
// comum, layout igual ao de sempre); quando não cabe, quebra em até duas
// linhas — sempre no MESMO tamanho de fonte (não encolhe), reposicionando
// o endereço logo abaixo da última linha
function computeNameLayout(name){
  const availableW = LOGICAL - MARGIN*2;
  ectx.font = `500 ${NAME_SIZE}px ${SANS_DISPLAY}`;
  if (ectx.measureText(name).width <= availableW){
    return { size: NAME_SIZE, lines: [name], baseline0: NAME_Y, lineGap: 0, addrY: ADDR_Y };
  }
  const words = name.split(/\s+/).filter(Boolean);
  let line1 = words[0] || name;
  let i = 1;
  for (; i < words.length; i++){
    const test = line1 + ' ' + words[i];
    if (ectx.measureText(test).width > availableW) break;
    line1 = test;
  }
  const rest = words.slice(i).join(' ');
  const lines = rest ? [line1, rest] : [line1];
  const baseline0 = PHOTO_BOX.y + PHOTO_BOX.h + NAME_WRAP_GAP0;
  const lastBaseline = baseline0 + (lines.length - 1) * NAME_WRAP_LINE_GAP;
  return { size: NAME_SIZE, lines, baseline0, lineGap: NAME_WRAP_LINE_GAP, addrY: lastBaseline + NAME_WRAP_ADDR_GAP };
}
function computeAddrLine(){
  return currentArtist
    ? (currentArtist.loc.local ? `${currentArtist.loc.local} — ${currentArtist.loc.endereco}` : currentArtist.loc.endereco)
    : '—';
}
function buildContentSVG(opts){
  // forExport: nenhum <text> entra no SVG — fundo/foto-placeholder ficam
  // (só cor sólida, sem fonte nenhuma envolvida), mas TODO o texto de
  // verdade (marquees, nome, endereço, iniciais) é desenhado depois, direto
  // no canvas de destino (ver rasterizeSVG). Ver o comentário grande lá
  // pra entender por quê.
  const forExport = opts && opts.forExport;
  const theme = THEMES[currentTheme];
  let s = '';
  s += `<rect x="0" y="0" width="${LOGICAL}" height="${LOGICAL}" fill="${theme.bg}"/>`;

  const hasPhoto = currentArtist && currentArtist.foto && photoOk;
  if (hasPhoto && forExport){
    s += `<rect x="${PHOTO_BOX.x}" y="${PHOTO_BOX.y}" width="${PHOTO_BOX.w}" height="${PHOTO_BOX.h}" fill="${theme.bg}"/>`;
  } else if (hasPhoto){
    // prévia (SVG ao vivo, dentro do próprio documento — sem esse risco de
    // blob isolado): usa a cópia local (data URL) sempre que existir, senão
    // cai pra URL externa com crossorigin="anonymous" (necessário pro
    // canvas não ficar "tainted" depois)
    const href = photoDataURL || currentArtist.foto;
    const corsAttr = photoDataURL ? '' : ' crossorigin="anonymous"';
    s += `<image href="${href}"${corsAttr} x="${PHOTO_BOX.x}" y="${PHOTO_BOX.y}" width="${PHOTO_BOX.w}" height="${PHOTO_BOX.h}" preserveAspectRatio="xMidYMid slice"/>`;
  } else {
    s += `<rect x="${PHOTO_BOX.x}" y="${PHOTO_BOX.y}" width="${PHOTO_BOX.w}" height="${PHOTO_BOX.h}" fill="#000000"/>`;
    if (!forExport){
      s += `<text x="${PHOTO_BOX.x+PHOTO_BOX.w/2}" y="${PHOTO_BOX.y+PHOTO_BOX.h/2}" font-family="${SANS_DISPLAY}" font-size="48" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">${currentArtist ? initials(currentArtist.nome) : '—'}</text>`;
    }
  }

  s += buildMarqueeBarSVG(0, MARQUEE_BAR_H, { skipText: forExport });
  s += buildMarqueeBarSVG(LOGICAL - MARQUEE_BAR_H, MARQUEE_BAR_H, { skipText: forExport });

  if (!forExport){
    const nameLayout = computeNameLayout(currentArtist ? currentArtist.nome : '—');
    nameLayout.lines.forEach((line, i) => {
      const y = nameLayout.baseline0 + i * nameLayout.lineGap;
      s += `<text x="${MARGIN}" y="${y}" font-family="${SANS_DISPLAY}" font-weight="500" font-size="${nameLayout.size}" fill="${theme.ink}">${escapeXML(line)}</text>`;
    });
    s += `<text x="${MARGIN}" y="${nameLayout.addrY}" font-family="${SANS_DISPLAY}" font-weight="400" font-size="${ADDR_SIZE}" fill="${theme.ink}">${escapeXML(computeAddrLine())}</text>`;
  }

  return s;
}
function draw(){
  svgEl.innerHTML = buildContentSVG();
}
// recorte "cover" (mesmo efeito do preserveAspectRatio="xMidYMid slice"/
// object-fit:cover): preenche a caixa de destino cortando o excesso da
// imagem fonte, mantendo a proporção, centralizado
function coverDrawParams(imgW, imgH, boxW, boxH){
  const imgRatio = imgW / imgH, boxRatio = boxW / boxH;
  if (imgRatio > boxRatio){
    const sh = imgH, sw = imgH * boxRatio;
    return { sx: (imgW - sw) / 2, sy: 0, sw, sh };
  }
  const sw = imgW, sh = imgW / boxRatio;
  return { sx: 0, sy: (imgH - sh) / 2, sw, sh };
}

// forExport:true não deixa nenhum <text> no SVG (ver buildContentSVG) — sem
// texto nenhum, não precisa de nenhum @import/@font-face aqui: todo o
// desenho de fonte acontece depois, direto no canvas (ver rasterizeSVG)
function buildFullSVGString(scale){
  const s = scale || 1;
  const content = buildContentSVG({ forExport: true });
  return `<?xml version="1.0" encoding="UTF-8"?>\n` +
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${LOGICAL} ${LOGICAL}" width="${LOGICAL*s}" height="${LOGICAL*s}">` +
    content +
    `</svg>`;
}
async function rasterizeSVG(scale){
  return new Promise((resolve, reject) => {
    const svgBlob = new Blob([buildFullSVGString(scale)], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = LOGICAL * scale;
      c.height = LOGICAL * scale;
      const cctx = c.getContext('2d');
      try{
        cctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        // desenha a foto de verdade por cima, direto no canvas — não passou
        // pelo SVG (ver buildContentSVG/forExport), então não depende
        // de nenhum carregamento assíncrono aqui: loadedImg já está
        // totalmente decodificada desde que carregou em setArtist()
        const hasPhoto = currentArtist && currentArtist.foto && photoOk;
        if (hasPhoto && loadedImg){
          const { sx, sy, sw, sh } = coverDrawParams(loadedImg.naturalWidth, loadedImg.naturalHeight, PHOTO_BOX.w, PHOTO_BOX.h);
          cctx.drawImage(loadedImg, sx, sy, sw, sh, PHOTO_BOX.x*scale, PHOTO_BOX.y*scale, PHOTO_BOX.w*scale, PHOTO_BOX.h*scale);
        }

        // todo o texto (marquees, nome, endereço, iniciais) é desenhado
        // AQUI, bitmap de verdade, direto no canvas de destino — não dentro
        // do SVG. Um <text> num SVG carregado como blob/<img> depende do
        // navegador respeitar a fonte custom (mesmo embutida como data URL)
        // nesse contexto isolado, o que se mostrou pouco confiável no
        // Safari do celular — o texto saía com a fonte de fallback errada,
        // sobrepondo tudo (mesmo depois de embutir a fonte via
        // buildEmbeddedFontsCSS). canvas.fillText() usa as fontes já
        // carregadas na PÁGINA de verdade — sem esse risco, WYSIWYG com a
        // prévia em qualquer navegador.
        const theme = THEMES[currentTheme];
        cctx.save();
        cctx.scale(scale, scale);
        drawMarqueeBarCanvas(cctx, 0, MARQUEE_BAR_H);
        drawMarqueeBarCanvas(cctx, LOGICAL - MARQUEE_BAR_H, MARQUEE_BAR_H);
        if (!hasPhoto){
          cctx.fillStyle = '#ffffff';
          cctx.font = `48px ${SANS_DISPLAY}`;
          cctx.textAlign = 'center'; cctx.textBaseline = 'middle';
          cctx.fillText(currentArtist ? initials(currentArtist.nome) : '—', PHOTO_BOX.x+PHOTO_BOX.w/2, PHOTO_BOX.y+PHOTO_BOX.h/2);
          cctx.textAlign = 'left'; cctx.textBaseline = 'alphabetic';
        }
        const nameLayout = computeNameLayout(currentArtist ? currentArtist.nome : '—');
        cctx.fillStyle = theme.ink;
        nameLayout.lines.forEach((line, i) => {
          const y = nameLayout.baseline0 + i * nameLayout.lineGap;
          cctx.font = `500 ${nameLayout.size}px ${SANS_DISPLAY}`;
          cctx.fillText(line, MARGIN, y);
        });
        cctx.font = `400 ${ADDR_SIZE}px ${SANS_DISPLAY}`;
        cctx.fillText(computeAddrLine(), MARGIN, nameLayout.addrY);
        cctx.restore();

        resolve(c);
      } catch(err){
        URL.revokeObjectURL(url);
        reject(err);
      }
    };
    img.onerror = (err) => { URL.revokeObjectURL(url); reject(err); };
    img.src = url;
  });
}

/* ============================================================
   post do evento
   ============================================================ */
// mapa (mostrar/esconder) virou uma das opções do Fundo compartilhado (ver
// bgBtns.mapa); "com/sem texto" e "mostrar/esconder pontos" não são mais
// escolhas do usuário — sempre sem texto, sempre com os pontos visíveis
// (ver showTextEvt/showPinsEvt, const's lá em cima)

function generateNewEventMark(){
  const order = [...PTS_EVT].sort(() => Math.random()-0.5);
  const closed = [...order, order[0]];
  const rawLegs = [];
  for (let i = 1; i < closed.length; i++) rawLegs.push(buildLegPath(closed[i-1], closed[i]));
  const pts = [ { x: closed[0].x, y: closed[0].y } ];
  rawLegs.forEach(leg => leg.slice(1).forEach(p => pts.push(p)));
  const t = computeFitTransform(pts, EVT_MAP_BOX, 0.82);
  evtMarkLegs = rawLegs.map(leg => applyFitTransform(leg, t));
  evtMarkPins = applyFitTransform(order, t);
  redrawEvent();
}
document.getElementById('btn-evt-new-mark').addEventListener('click', generateNewEventMark);

// desenha um quadro completo do post do evento — assume que o contexto
// já tem a escala/transformação aplicada (pra funcionar tanto na prévia
// em tela quanto na exportação em alta resolução)
function totalLegsLength(legs){
  return legs.reduce((s,leg) => s + pathLength(leg), 0);
}
// concatena os pontos já revelados, cruzando as pernas — usado pro texto
// na fita e pra máscara do "negativo", que não precisam saber onde uma
// perna termina e a outra começa
function revealedFlatPoints(legs, dist){
  let remaining = dist;
  const out = [];
  for (const leg of legs){
    if (remaining <= 0) break;
    const legLen = pathLength(leg);
    if (remaining >= legLen){
      out.push(...leg);
    } else {
      out.push(...subPathUpTo(leg, remaining));
      remaining = 0;
      break;
    }
    remaining -= legLen;
  }
  return out;
}

function drawEventFrame(ctx2d, dMark, markPath){
  const theme = THEMES[currentTheme];
  ctx2d.clearRect(0, 0, LOGICAL, LOGICAL);
  ctx2d.fillStyle = theme.bg;
  ctx2d.fillRect(0, 0, LOGICAL, LOGICAL);

  if (showMapEvt && evtBasemapCanvas){
    ctx2d.drawImage(evtBasemapCanvas, EVT_MAP_BOX.x, EVT_MAP_BOX.y, EVT_MAP_BOX.w, EVT_MAP_BOX.h);
  }

  ctx2d.textAlign = 'center'; ctx2d.textBaseline = 'alphabetic';
  ctx2d.fillStyle = theme.ink;
  ctx2d.font = `${EVT_TITLE_SIZE}px 'Instrument Serif', Georgia, serif`;
  ctx2d.fillText(EVT_TITLE_L1, EVT_TITLE_X, EVT_TITLE_Y1);
  ctx2d.font = `italic ${EVT_TITLE_SIZE}px 'Instrument Serif', Georgia, serif`;
  ctx2d.fillText(EVT_TITLE_L2, EVT_TITLE_X, EVT_TITLE_Y2);
  ctx2d.textAlign = 'left';

  if (markPath && markPath.length){
    let remaining = dMark;
    for (const leg of markPath){
      if (remaining <= 0) break;
      const legLen = pathLength(leg);
      const drawLen = Math.min(remaining, legLen);
      const sub = drawLen >= legLen ? leg : subPathUpTo(leg, drawLen);
      if (sub.length >= 2){
        ctx2d.lineWidth = EVT_MARK_WIDTH;
        ctx2d.lineCap = 'round';
        ctx2d.lineJoin = 'round';
        if (markFill === 'degrade'){
          const a = leg[0], b = leg[leg.length-1];
          const grad = ctx2d.createLinearGradient(a.x, a.y, b.x, b.y);
          grad.addColorStop(0, '#000000');
          grad.addColorStop(1, '#ffffff');
          ctx2d.strokeStyle = grad;
        } else {
          ctx2d.strokeStyle = theme.mark;
        }
        ctx2d.beginPath();
        sub.forEach((p, i) => { if (i === 0) ctx2d.moveTo(p.x, p.y); else ctx2d.lineTo(p.x, p.y); });
        ctx2d.stroke();
      }
      remaining -= legLen;
    }

    const flatRevealed = revealedFlatPoints(markPath, dMark);

    if (showTextEvt && flatRevealed.length >= 2){
      drawRibbonAlongPath(ctx2d, flatRevealed, 20, theme.bg);
    }

    // "negativo": onde a linha cruza o título, revela o título na cor
    // do fundo — como se a linha fosse uma máscara pra uma versão
    // invertida do texto por baixo dela
    if (flatRevealed.length >= 2){
      const off = document.createElement('canvas');
      off.width = LOGICAL; off.height = LOGICAL;
      const octx = off.getContext('2d');
      octx.fillStyle = theme.bg;
      octx.textAlign = 'center'; octx.textBaseline = 'alphabetic';
      octx.font = `${EVT_TITLE_SIZE}px 'Instrument Serif', Georgia, serif`;
      octx.fillText(EVT_TITLE_L1, EVT_TITLE_X, EVT_TITLE_Y1);
      octx.font = `italic ${EVT_TITLE_SIZE}px 'Instrument Serif', Georgia, serif`;
      octx.fillText(EVT_TITLE_L2, EVT_TITLE_X, EVT_TITLE_Y2);
      octx.globalCompositeOperation = 'destination-in';
      octx.lineWidth = EVT_MARK_WIDTH;
      octx.lineCap = 'round';
      octx.lineJoin = 'round';
      octx.strokeStyle = '#000';
      octx.beginPath();
      flatRevealed.forEach((p, i) => { if (i === 0) octx.moveTo(p.x, p.y); else octx.lineTo(p.x, p.y); });
      octx.stroke();
      ctx2d.drawImage(off, 0, 0, LOGICAL, LOGICAL);
    }
  }

  if (showPinsEvt){
    // mesmo tratamento visual do .pin/.pin::before do site (index.html): sem
    // anel/contorno sólido — miolo com borda suave via blur, na mesma
    // proporção do CSS (inset:2px + blur:2px numa base de 24px de
    // diâmetro/12px de raio), escalada pro raio de cada pino aqui (r=15)
    const rEvt = 15, coreREvt = rEvt * (10/12), blurPxEvt = rEvt * (2/12);
    (evtMarkPins.length ? evtMarkPins : PTS_EVT).forEach((p) => {
      ctx2d.save();
      ctx2d.filter = `blur(${blurPxEvt.toFixed(2)}px)`;
      ctx2d.beginPath();
      ctx2d.arc(p.x, p.y, coreREvt, 0, Math.PI*2);
      ctx2d.fillStyle = theme.mark;
      ctx2d.fill();
      ctx2d.restore();
      ctx2d.fillStyle = theme.bg;
      ctx2d.font = "12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
      ctx2d.textAlign = 'center'; ctx2d.textBaseline = 'middle';
      ctx2d.fillText(String(alphaNumEvt[p.id]).padStart(2,'0'), p.x, p.y+0.5);
      ctx2d.textAlign = 'left'; ctx2d.textBaseline = 'alphabetic';
    });
  }

  ctx2d.textAlign = 'center';
  ctx2d.fillStyle = theme.ink;
  ctx2d.font = `${EVT_LABEL_WEIGHT} ${EVT_LABEL_SIZE}px ${SANS_DISPLAY}`;
  ctx2d.fillText(EVT_LABEL_L, LOGICAL/2, EVT_LABEL_Y);
  ctx2d.textAlign = 'left';
}

function redrawEvent(){
  const full = markPathForFrame();
  drawEventFrame(ectx, full ? totalLegsLength(full) : 0, full);
}
function markPathForFrame(){
  return evtMarkLegs.length >= 1 ? evtMarkLegs : null;
}

// ---------------- geocodificação automática (fallback) ----------------
// mesma lógica do index.html: endereços sem lat/lng na planilha são
// resolvidos via Nominatim (gratuito) em segundo plano, sem travar o
// carregamento inicial com o que já está disponível
async function geocodeAddress(query){
  try{
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('geocode http error ' + res.status);
    const results = await res.json();
    if (results && results.length){
      return { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) };
    }
  } catch(err){
    console.warn('Falha ao geocodificar endereço:', query, err);
  }
  return null;
}
async function resolveMissingCoordinates(){
  const pending = LOCATIONS.filter(l => (l.lat == null || l.lng == null) && !/confirmar/i.test(l.endereco));
  let resolvedAny = false;
  for (const loc of pending){
    const query = `${loc.endereco}, Centro, Rio de Janeiro, Brasil`;
    const coords = await geocodeAddress(query);
    if (coords){
      loc.lat = coords.lat;
      loc.lng = coords.lng;
      resolvedAny = true;
    }
    await new Promise(r => setTimeout(r, 1100));
  }
  // só atualiza os pontos UMA VEZ, no final, e sem gerar uma marca nova
  // (startNow=false) — antes, cada endereço resolvido em segundo plano
  // chamava setupFromLocations() de novo, que sempre terminava com
  // generateNewEventMark() (embaralha a ordem) — a marca do post do evento
  // "mudava sozinha" na tela, sem clique nenhum em "gerar nova marca".
  if (resolvedAny) await setupFromLocations(false);
}

// mostra os dois números quando não batem (endereços com coordenada válida
// vs total da planilha) — sem isso, "39 endereços" parecia dizer que o
// mapa/marca tem 39 pontos, quando na real só os que têm coordenada
// preenchida (e válida — ver parseCoord) entram no traçado. Fica óbvio na
// hora se algum endereço quebrar de novo no futuro.
function updateEvtStatsNote(){
  const withCoordsCount = LOCATIONS.filter(l => l.lat != null && l.lng != null).length;
  const suffix = withCoordsCount === numAddresses ? '' : ` (${withCoordsCount} no mapa agora)`;
  document.getElementById('evt-stats-note').textContent = `${numAddresses} endereços${suffix} · ${numArtists} artistas (direto da planilha)`;
}

   boot
   ============================================================ */
async function setupFromLocations(startNow = true){
  updateEvtStatsNote();
  const withCoords = LOCATIONS.filter(l => l.lat != null && l.lng != null);
  if (withCoords.length < 3){
    setStatus('poucos ateliês com coordenadas preenchidas ainda — é preciso pelo menos 3 pra fechar uma forma.', true);
    return;
  }
  setStatus('');
  const bounds = {
    minLat: Math.min(...withCoords.map(l=>l.lat)),
    maxLat: Math.max(...withCoords.map(l=>l.lat)),
    minLng: Math.min(...withCoords.map(l=>l.lng)),
    maxLng: Math.max(...withCoords.map(l=>l.lng)),
  };

  // post do evento — sempre carrega o mapa (mesmo com "esconder mapa"
  // ativo): pixelOfEvt() depende da instância viva do MapLibre pra
  // projetar os pontos, então precisamos dela de qualquer jeito; o botão
  // só decide se o resultado aparece desenhado (ver drawEventFrame)
  setStatus('carregando mapa…');
  await buildEvtBasemapMapLibre(bounds, 45);
  setStatus('');
  // PTS_EVT alimenta só o traçado decorativo da marca (generateNewEventMark)
  // — exclui EXCLUDE_FROM_MARK aqui, mas NÃO no bounds acima: o mapa de
  // fundo continua mostrando a área geográfica completa normalmente, só o
  // traçado/pontos da marca em cima dele que pulam esse endereço
  PTS_EVT = withCoords
    .filter(l => !EXCLUDE_FROM_MARK.has(l.endereco))
    .map(loc => ({ ...pixelOfEvt(loc.lat, loc.lng), id: loc.id }));

  // numerado entre TODOS os endereços da planilha (não só os com coordenada
  // já preenchida) — mesmo critério do index.html, senão o número de um
  // ponto aqui diverge do número mostrado no site conforme endereços novos
  // vão sendo geocodificados em momentos diferentes
  const sortedForNum = [...LOCATIONS].sort((a,b) =>
    (a.local||a.endereco).localeCompare(b.local||b.endereco, 'pt-BR', {sensitivity:'base'}));
  alphaNumEvt = {};
  sortedForNum.forEach((loc,i) => { alphaNumEvt[loc.id] = i+1; });

  if (startNow) generateNewEventMark();
}

async function boot(){
  try{
    await Promise.all([
      document.fonts.load(`500 ${NAME_SIZE}px 'Inter'`),
      document.fonts.load(`400 ${ADDR_SIZE}px 'Inter'`),
      document.fonts.load(`600 32px 'Inter'`), // rótulo da faixa de marquee
      document.fonts.load(`italic 40px 'Instrument Serif'`), // data da faixa de marquee
      document.fonts.load(`${EVT_TITLE_SIZE}px 'Instrument Serif'`),
      document.fonts.load(`italic ${EVT_TITLE_SIZE}px 'Instrument Serif'`),
      document.fonts.load(`${EVT_STATS_SIZE}px 'Instrument Serif'`),
      document.fonts.load(`${EVT_LABEL_WEIGHT} 100px 'Inter'`),
      document.fonts.load(`350 20px 'Inter'`)
    ]);
  } catch(e){}
  computeEvtLabelSize();
  computeNameWrapGap0();
  try{
    LOCATIONS = await loadLocationsFromSheet();
  } catch(err){
    console.error(err);
    setStatus('Não foi possível carregar os dados da planilha agora. Recarregue a página em instantes.', true);
    return;
  }

  numAddresses = LOCATIONS.length;
  numArtists = LOCATIONS.reduce((sum, l) => sum + l.artistas.filter(a => a.nome).length, 0);
  updateEvtStatsNote();

  LOCATIONS.forEach(loc => loc.artistas.forEach(art => {
    if (art.nome) FLAT_ARTISTS.push({ ...art, loc });
  }));
  FLAT_ARTISTS.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{sensitivity:'base'}));
  renderArtistSelect();

  await setupFromLocations();
  resolveMissingCoordinates();
}
boot();
</script>
