  a{ color:inherit; text-decoration:none; }
  button, select{ font:inherit; touch-action:manipulation; }

          overflow-y:auto; max-height:100vh; }

  h1{ font-family:var(--serif); font-weight:400; font-size:2.1rem; line-height:1.05; margin:0 0 0.2rem; }

  .field{ margin-bottom:1.6rem; }
  .field label{ display:block; font-family:var(--mono); font-size:0.73rem; text-transform:uppercase;
                letter-spacing:0.04em; color:var(--gray); margin-bottom:0.5rem; }
  select{ width:100%; padding:0.65rem 0.7rem; border:1px solid var(--ink); border-radius:0; background:#fff;
          color:var(--ink); font-family:var(--sans); font-size:0.94rem; }

  .btn{ font-family:var(--mono); font-size:0.79rem; background:#fff; color:var(--ink); border:1px solid var(--ink);
        padding:0.6rem 0.9rem; cursor:pointer; border-radius:0; transition:background 0.15s ease, color 0.15s ease; }
  .btn:hover{ background:var(--ink); color:#fff; }

                 box-shadow:0 12px 40px rgba(0,0,0,0.08); background:#fff; }

<body>

<script>
/* ============================================================
   dados
   ============================================================ */
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1Zjux0r3uVJ8ua1ZXpWd68lOSP5Kj0XkU/gviz/tq?tqx=out:csv&sheet=Circuito';
const LOGICAL = 1000;
const FONT_IMPORT = "https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap";
const EVENT_TITLE = 'Circuito de Ateliês do Centro';
const EVENT_DATES = '18 – 19 de Setembro';

const MARGIN = 60;
const NAME_Y = 110;      // nome bem mais pra cima, cap-height quase encostando na margem
const ADDR_Y = 162;
const MARK_BOX = { x: MARGIN, y: LOGICAL - MARGIN - 120, w: 120, h: 120 }; // bottom = LOGICAL - MARGIN
const PHOTO_BOX = { x: MARGIN, y: ADDR_Y + 50, w: LOGICAL - MARGIN*2, h: MARK_BOX.y - 50 - (ADDR_Y + 50) };
const NAME_SIZE = 64;
const ADDR_SIZE = 24;
const TITLE_SIZE = 36;

function parseCSV(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\r'){ /* ignore */ }
      else if (c === '\n'){ row.push(field); field = ''; rows.push(row); row = []; }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

async function loadLocationsFromSheet(){
  const res = await fetch(SHEET_CSV_URL);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const table = parseCSV(text).filter(r => r.some(c => c !== undefined && c.trim() !== ''));
  if (table.length < 2) throw new Error('planilha vazia');
  const headers = table[0].map(h => h.trim());
  const hIdx = {}; headers.forEach((h,i)=>hIdx[h]=i);
  const get = (row, name) => { const i = hIdx[name]; return (i!=null && row[i]!=null) ? row[i].trim() : ''; };
  const locMap = {}; const order = [];
  table.slice(1).forEach(row => {
    const local = get(row,'Local / Coletivo');
    const endereco = get(row,'Endereço');
    const nome = get(row,'Nome do Artista');
    if (!endereco && !nome) return;
    const instagram = get(row,'Instagram').replace(/^@/, '');
    const foto = get(row,'Foto do trabalho (URL)');
    const latRaw = get(row,'Latitude');
    const lngRaw = get(row,'Longitude');
    const key = endereco;
    if (!locMap[key]){
      locMap[key] = {
        id: 'loc' + order.length, local, endereco,
        lat: latRaw ? parseFloat(latRaw.replace(',', '.')) : null,
        lng: lngRaw ? parseFloat(lngRaw.replace(',', '.')) : null,
        artistas: []
      };
      order.push(key);
    }
    locMap[key].artistas.push({ nome, instagram, foto });
  });
  return order.map(k => locMap[k]);
}

function initials(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

/* ============================================================
   geometria — projeta as coordenadas reais num referencial livre
   (não preso a nenhuma caixa específica); cada uso (máscara, marca)
   encaixa esse mesmo formato relativo na caixa que precisar
   ============================================================ */
function project(lat, lon){
  const x = (lon + 180) / 360;
  const rad = lat * Math.PI/180;
  const y = (1 - Math.log(Math.tan(rad) + 1/Math.cos(rad)) / Math.PI) / 2;
  return { x, y };
}
function expandBounds(b, factor){
  const cLat = (b.minLat+b.maxLat)/2, cLng = (b.minLng+b.maxLng)/2;
  const spanLat = Math.max((b.maxLat-b.minLat)*factor, 0.002);
  const spanLng = Math.max((b.maxLng-b.minLng)*factor, 0.002);
  return { minLat:cLat-spanLat/2, maxLat:cLat+spanLat/2, minLng:cLng-spanLng/2, maxLng:cLng+spanLng/2 };
}
let proj = null;
function computeProjection(bounds, W, H, padFactor){
  const expanded = expandBounds(bounds, padFactor);
  const p1 = project(expanded.maxLat, expanded.minLng);
  const p2 = project(expanded.minLat, expanded.maxLng);
  const worldW = p2.x - p1.x, worldH = p2.y - p1.y;
  const scale = Math.min(W/worldW, H/worldH);
  const offsetX = (W - worldW*scale)/2, offsetY = (H - worldH*scale)/2;
  return { p1, scale, offsetX, offsetY };
}
function pixelOf(lat, lon){
  const p = project(lat, lon);
  return { x: proj.offsetX + (p.x - proj.p1.x)*proj.scale, y: proj.offsetY + (p.y - proj.p1.y)*proj.scale };
}

// encaixa qualquer nuvem de pontos numa caixa alvo, centralizada, ocupando
// a fração informada da caixa — usado tanto pra máscara quanto pra marca
function fitPointsToBox(points, box, fillFraction){
  const xs = points.map(p=>p.x), ys = points.map(p=>p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const w = (maxX-minX) || 1, h = (maxY-minY) || 1;
  const scale = Math.min(box.w*fillFraction/w, box.h*fillFraction/h);
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  const boxCx = box.x + box.w/2, boxCy = box.y + box.h/2;
  return points.map(p => ({ x: boxCx + (p.x-cx)*scale, y: boxCy + (p.y-cy)*scale }));
}

/* ============================================================
   caminho reto/curvo entre dois pontos
   ============================================================ */
function buildLegPath(a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  if (Math.random() < 0.35 || len < 0.09){
    return [ { x:a.x, y:a.y }, { x:b.x, y:b.y } ];
  }
  const nx = -dy/len, ny = dx/len;
  const side = Math.random() < 0.5 ? 1 : -1;
  const offset = len * (0.08 + Math.random()*0.14) * side;
  const mx = (a.x+b.x)/2 + nx*offset;
  const my = (a.y+b.y)/2 + ny*offset;
  const N = 16;
  const pts = [];
  for (let i=0;i<=N;i++){
    const t = i/N;
    const it = 1-t;
    pts.push({
      x: it*it*a.x + 2*it*t*mx + t*t*b.x,
      y: it*it*a.y + 2*it*t*my + t*t*b.y
    });
  }
  return pts;
}

function pathLength(points){
  let len = 0;
  for (let i=1;i<points.length;i++) len += Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
  return len;
}
// retorna os pontos do caminho até uma certa distância acumulada — usado
// pra desenhar a marca progressivamente, quadro a quadro, no vídeo
function subPathUpTo(points, dist){
  const out = [points[0]];
  let d = 0;
  for (let i = 1; i < points.length; i++){
    const seg = Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
    if (d + seg >= dist){
      const t = seg === 0 ? 0 : (dist-d)/seg;
      out.push({ x: points[i-1].x + (points[i].x-points[i-1].x)*t, y: points[i-1].y + (points[i].y-points[i-1].y)*t });
      return out;
    }
    out.push(points[i]);
    d += seg;
  }
  return out;
}


function escapeXML(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ============================================================
   temas de fundo — todas as cores dos elementos se adaptam
   ============================================================ */
const THEMES = {
  branco: { bg:'#ffffff', ink:'#111111', sub:'#6b6b6b', mark:'#111111' },
  cinza:  { bg:'#d8d8d6', ink:'#111111', sub:'#55524f', mark:'#111111' },
  preto:  { bg:'#111111', ink:'#ffffff', sub:'#b5b5b3', mark:'#ffffff' }
};
let currentTheme = 'branco';

/* ============================================================
   estado
   ============================================================ */
let LOCATIONS = [];
let PTS = [];
let FLAT_ARTISTS = [];
let currentArtist = null;
let photoOk = false;
let loadedImg = null;
let markPoints = [];

const svgEl = document.getElementById('art');
const artistSelect = document.getElementById('artist-select');
const statusEl = document.getElementById('status');
const canvasFrame = document.getElementById('canvas-frame');
const bgBtns = { branco: document.getElementById('bg-branco'), cinza: document.getElementById('bg-cinza'), preto: document.getElementById('bg-preto') };

function setStatus(msg, isError){
  statusEl.textContent = msg || '';
  statusEl.classList.toggle('error', !!isError);
}


Object.keys(bgBtns).forEach(key => {
  bgBtns[key].addEventListener('click', () => {
    currentTheme = key;
    Object.keys(bgBtns).forEach(k => bgBtns[k].classList.toggle('active', k === key));
    canvasFrame.style.background = THEMES[key].bg;
    draw();
  });
});

function renderArtistSelect(){
  artistSelect.innerHTML = '';
  FLAT_ARTISTS.forEach((a, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${a.nome} — ${a.loc.local || a.loc.endereco}`;
    artistSelect.appendChild(opt);
  });
  if (FLAT_ARTISTS.length){ artistSelect.value = 0; setArtist(0); }
}
function setArtist(idx){
  currentArtist = FLAT_ARTISTS[idx];
  photoOk = false;
  loadedImg = null;
  if (currentArtist && currentArtist.foto){
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { photoOk = true; loadedImg = img; draw(); };
    img.onerror = () => { photoOk = false; loadedImg = null; draw(); };
    img.src = currentArtist.foto;
  } else {
    draw();
  }
}
artistSelect.addEventListener('change', () => setArtist(parseInt(artistSelect.value, 10)));


function generateNewMark(){
  const order = [...PTS].sort(() => Math.random()-0.5);
  const closed = [...order, order[0]];
  const pts = [ { x: closed[0].x, y: closed[0].y } ];
  for (let i = 1; i < closed.length; i++){
    buildLegPath(closed[i-1], closed[i]).slice(1).forEach(p => pts.push(p));
  }
  markPoints = fitPointsToBox(pts, MARK_BOX, 0.9);
  draw();
}
document.getElementById('btn-new-mark').addEventListener('click', generateNewMark);

/* ============================================================
   video do post — o post inteiro (nome, endereco, foto, titulo,
   data) fica igual ao estatico; so a marca se desenha, dando duas
   voltas completas por todos os pontos, em ~10s. Gravado a partir
   de um canvas dedicado (o SVG nao serve pra isso, precisa ser
   canvas pra capturar video)
   ============================================================ */
const videoCanvas = document.getElementById('video-canvas');
const vctx = videoCanvas.getContext('2d');
const btnMarkVideo = document.getElementById('btn-mark-video');
const DURATION_MS = 10000;

function buildDoubleLapMarkPath(){
  const pass1 = [...PTS].sort(() => Math.random()-0.5);
  const pass2 = [...PTS].sort(() => Math.random()-0.5);
  const order = [...pass1, ...pass2];
  const raw = [ { x: order[0].x, y: order[0].y } ];
  for (let i = 1; i < order.length; i++){
    buildLegPath(order[i-1], order[i]).slice(1).forEach(p => raw.push(p));
  }
  return fitPointsToBox(raw, MARK_BOX, 0.9);
}

function drawCoverImage(ctx2d, img, box){
  const ir = img.width / img.height;
  const br = box.w / box.h;
  let dw, dh, dx, dy;
  if (ir > br){ dh = box.h; dw = dh * ir; dx = box.x - (dw-box.w)/2; dy = box.y; }
  else { dw = box.w; dh = dw / ir; dx = box.x; dy = box.y - (dh-box.h)/2; }
  ctx2d.drawImage(img, dx, dy, dw, dh);
}

// desenha um quadro completo do post no canvas — igual ao SVG estatico,
// so que a marca so vai ate a distancia "dMark" (usada pra animar)
function drawPostFrameToCanvas(ctx2d, dMark, markPath){
  const theme = THEMES[currentTheme];
  ctx2d.clearRect(0, 0, LOGICAL, LOGICAL);
  ctx2d.fillStyle = theme.bg;
  ctx2d.fillRect(0, 0, LOGICAL, LOGICAL);

  ctx2d.textAlign = 'left'; ctx2d.textBaseline = 'alphabetic';
  ctx2d.fillStyle = theme.ink;
  ctx2d.font = `${NAME_SIZE}px 'Instrument Serif', Georgia, serif`;
  ctx2d.fillText(currentArtist ? currentArtist.nome : '—', MARGIN, NAME_Y);

  const addrLine = currentArtist
    ? (currentArtist.loc.local ? `${currentArtist.loc.local} — ${currentArtist.loc.endereco}` : currentArtist.loc.endereco)
    : '—';
  ctx2d.fillStyle = theme.sub;
  ctx2d.font = "24px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
  ctx2d.fillText(addrLine, MARGIN, ADDR_Y);

  if (loadedImg && photoOk){
    ctx2d.save();
    ctx2d.beginPath();
    ctx2d.rect(PHOTO_BOX.x, PHOTO_BOX.y, PHOTO_BOX.w, PHOTO_BOX.h);
    ctx2d.clip();
    drawCoverImage(ctx2d, loadedImg, PHOTO_BOX);
    ctx2d.restore();
  } else {
    ctx2d.fillStyle = currentTheme === 'preto' ? '#2a2a2a' : '#e4e4e4';
    ctx2d.fillRect(PHOTO_BOX.x, PHOTO_BOX.y, PHOTO_BOX.w, PHOTO_BOX.h);
    ctx2d.fillStyle = theme.sub;
    ctx2d.font = "48px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
    ctx2d.textAlign = 'center'; ctx2d.textBaseline = 'middle';
    ctx2d.fillText(currentArtist ? initials(currentArtist.nome) : '—', PHOTO_BOX.x+PHOTO_BOX.w/2, PHOTO_BOX.y+PHOTO_BOX.h/2);
    ctx2d.textAlign = 'left'; ctx2d.textBaseline = 'alphabetic';
  }

  const sub = subPathUpTo(markPath, dMark);
  ctx2d.strokeStyle = theme.mark;
  ctx2d.lineWidth = 2.4;
  ctx2d.lineCap = 'round';
  ctx2d.lineJoin = 'round';
  ctx2d.beginPath();
  sub.forEach(function(p, i){ if (i === 0) ctx2d.moveTo(p.x, p.y); else ctx2d.lineTo(p.x, p.y); });
  ctx2d.stroke();

  const textX = MARK_BOX.x + MARK_BOX.w + 26;
  ctx2d.fillStyle = theme.ink;
  ctx2d.font = `${TITLE_SIZE}px 'Instrument Serif', Georgia, serif`;
  ctx2d.fillText(EVENT_TITLE, textX, MARK_BOX.y+52);
  ctx2d.fillStyle = theme.sub;
  ctx2d.fillText(EVENT_DATES, textX, MARK_BOX.y+98);
}

btnMarkVideo.addEventListener('click', () => {
  if (!('MediaRecorder' in window)){
    setStatus('Este navegador nao suporta gravacao de video (tente no Chrome ou Firefox).', true);
    return;
  }
  const markPath = buildDoubleLapMarkPath();
  const totalLen = pathLength(markPath);
  const speed = totalLen / (DURATION_MS/1000);

  svgEl.style.display = 'none';
  videoCanvas.style.display = 'block';

  let stream, recorder;
  try{
    stream = videoCanvas.captureStream(30);
    const mimeCandidates = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    const mimeType = mimeCandidates.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
    recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  } catch(err){
    setStatus('Nao foi possivel iniciar a gravacao neste navegador.', true);
    svgEl.style.display = 'block';
    videoCanvas.style.display = 'none';
    return;
  }

  const chunks = [];
  recorder.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = function(){
    const blob = new Blob(chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'circuito-post.webm';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    svgEl.style.display = 'block';
    videoCanvas.style.display = 'none';
    setStatus('video pronto - download iniciado (.webm).');
  };

  setStatus('gravando o video do post...');
  recorder.start();

  let startTs = null;
  function frame(ts){
    if (startTs == null) startTs = ts;
    const elapsed = (ts - startTs) / 1000;
    const d = Math.min(totalLen, elapsed * speed);

    drawPostFrameToCanvas(vctx, d, markPath);

    if (elapsed < DURATION_MS/1000){
      requestAnimationFrame(frame);
    } else {
      recorder.stop();
    }
  }
  requestAnimationFrame(frame);
});

function buildOpenPathD(points){
  if (points.length < 2) return '';
  let d = 'M' + points[0].x.toFixed(2) + ' ' + points[0].y.toFixed(2) + ' ';
  for (let i = 1; i < points.length; i++) d += 'L' + points[i].x.toFixed(2) + ' ' + points[i].y.toFixed(2) + ' ';
  return d;
}

/* ============================================================
   desenho
   ============================================================ */
function buildContentSVG(){
  const theme = THEMES[currentTheme];
  let s = '';
  s += `<rect x="0" y="0" width="${LOGICAL}" height="${LOGICAL}" fill="${theme.bg}"/>`;

  // nome do artista + endereço, no topo
  s += `<text x="${MARGIN}" y="${NAME_Y}" font-family="'Instrument Serif', Georgia, serif" font-size="${NAME_SIZE}" fill="${theme.ink}">${escapeXML(currentArtist ? currentArtist.nome : '—')}</text>`;
  const addrLine = currentArtist
    ? (currentArtist.loc.local ? `${currentArtist.loc.local} — ${currentArtist.loc.endereco}` : currentArtist.loc.endereco)
    : '—';
  s += `<text x="${MARGIN}" y="${ADDR_Y}" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="${ADDR_SIZE}" fill="${theme.sub}">${escapeXML(addrLine)}</text>`;

  // foto — sempre em retângulo
  const hasPhoto = currentArtist && currentArtist.foto && photoOk;
  if (hasPhoto){
    s += `<image href="${currentArtist.foto}" x="${PHOTO_BOX.x}" y="${PHOTO_BOX.y}" width="${PHOTO_BOX.w}" height="${PHOTO_BOX.h}" preserveAspectRatio="xMidYMid slice"/>`;
  } else {
    s += `<rect x="${PHOTO_BOX.x}" y="${PHOTO_BOX.y}" width="${PHOTO_BOX.w}" height="${PHOTO_BOX.h}" fill="${currentTheme==='preto' ? '#2a2a2a' : '#e4e4e4'}"/>`;
    s += `<text x="${PHOTO_BOX.x+PHOTO_BOX.w/2}" y="${PHOTO_BOX.y+PHOTO_BOX.h/2}" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="48" fill="${theme.sub}" text-anchor="middle" dominant-baseline="middle">${currentArtist ? initials(currentArtist.nome) : '—'}</text>`;
  }

  // marca (linha só, sem texto) + título/data do evento, lado a lado
  if (markPoints.length >= 2){
    s += `<path d="${buildOpenPathD(markPoints)}" fill="none" stroke="${theme.mark}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  const textX = MARK_BOX.x + MARK_BOX.w + 26;
  s += `<text x="${textX}" y="${MARK_BOX.y+52}" font-family="'Instrument Serif', Georgia, serif" font-size="${TITLE_SIZE}" fill="${theme.ink}">${escapeXML(EVENT_TITLE)}</text>`;
  s += `<text x="${textX}" y="${MARK_BOX.y+98}" font-family="'Instrument Serif', Georgia, serif" font-size="${TITLE_SIZE}" fill="${theme.sub}">${escapeXML(EVENT_DATES)}</text>`;

  return s;
}

function draw(){
  svgEl.innerHTML = buildContentSVG();
}

function buildFullSVGString(){
  const content = buildContentSVG();
  return `<?xml version="1.0" encoding="UTF-8"?>\n` +
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${LOGICAL} ${LOGICAL}" width="${LOGICAL}" height="${LOGICAL}">` +
    `<defs><style>@import url('${FONT_IMPORT.replace(/&/g,'&amp;')}');</style></defs>` +
    content +
    `</svg>`;
}

/* ============================================================
   exportação
   ============================================================ */
document.getElementById('btn-download-svg').addEventListener('click', () => {
  setStatus('');
  const blob = new Blob([buildFullSVGString()], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'circuito-paralelo-post.svg';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

function rasterizeSVG(scale){
  return new Promise((resolve, reject) => {
    const svgBlob = new Blob([buildFullSVGString()], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = LOGICAL * scale;
      c.height = LOGICAL * scale;
      const cctx = c.getContext('2d');
      try{
        cctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c);
      } catch(err){
        URL.revokeObjectURL(url);
        reject(err);
      }
    };
    img.onerror = (err) => { URL.revokeObjectURL(url); reject(err); };
    img.src = url;
  });
}

document.getElementById('btn-download-png').addEventListener('click', async () => {
  setStatus('gerando PNG em alta resolução…');
  try{
    const c = await rasterizeSVG(3);
    c.toBlob(blob => {
      if (!blob){ setStatus('Não foi possível gerar o PNG.', true); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'circuito-paralelo-post.png';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      setStatus('');
    }, 'image/png');
  } catch(err){
    console.error(err);
    setStatus('Exportação bloqueada — provavelmente a foto deste artista não libera CORS. Tente outro artista, ou baixe o SVG.', true);
  }
});

document.getElementById('btn-download-pdf').addEventListener('click', async () => {
  setStatus('gerando PDF…');
  try{
    const c = await rasterizeSVG(3);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'px', format: [LOGICAL, LOGICAL] });
    doc.addImage(c.toDataURL('image/png'), 'PNG', 0, 0, LOGICAL, LOGICAL);
    doc.save('circuito-paralelo-post.pdf');
    setStatus('');
  } catch(err){
    console.error(err);
    setStatus('Não foi possível gerar o PDF agora — tente o SVG.', true);
  }
});

/* ============================================================
   boot
   ============================================================ */
async function boot(){
  try{
    await Promise.all([
      document.fonts.load(`${NAME_SIZE}px 'Instrument Serif'`),
      document.fonts.load(`${TITLE_SIZE}px 'Instrument Serif'`)
    ]);
  } catch(e){}
  try{
    LOCATIONS = await loadLocationsFromSheet();
  } catch(err){
    console.error(err);
    setStatus('Não foi possível carregar os dados da planilha agora. Recarregue a página em instantes.', true);
    return;
  }

  const withCoords = LOCATIONS.filter(l => l.lat != null && l.lng != null);
  if (withCoords.length < 3){
    setStatus('poucos ateliês com coordenadas preenchidas ainda — é preciso pelo menos 3 pra fechar uma forma.', true);
    return;
  }
  const bounds = {
    minLat: Math.min(...withCoords.map(l=>l.lat)),
    maxLat: Math.max(...withCoords.map(l=>l.lat)),
    minLng: Math.min(...withCoords.map(l=>l.lng)),
    maxLng: Math.max(...withCoords.map(l=>l.lng)),
  };
  proj = computeProjection(bounds, LOGICAL, LOGICAL, 1.0);

  PTS = withCoords.map(loc => pixelOf(loc.lat, loc.lng));

  LOCATIONS.forEach(loc => loc.artistas.forEach(art => {
    if (art.nome) FLAT_ARTISTS.push({ ...art, loc });
  }));
  FLAT_ARTISTS.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{sensitivity:'base'}));

  renderArtistSelect();
  generateNewMark();
}
boot();
