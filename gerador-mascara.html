<script>
/* ============================================================

   ============================================================ */
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1Zjux0r3uVJ8ua1ZXpWd68lOSP5Kj0XkU/gviz/tq?tqx=out:csv&sheet=Circuito';
const LOGICAL = 1000;
const FONT_IMPORT = "https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap";
const EVENT_TITLE = 'Circuito de Ateliês do Centro';
const EVENT_DATES = '18 – 19 de Setembro';

// layout — post do artista
const MARGIN = 60;
const NAME_Y = 110;
const ADDR_Y = 162;
const MARK_BOX = { x: MARGIN, y: LOGICAL - MARGIN - 120, w: 120, h: 120 };
const PHOTO_BOX = { x: MARGIN, y: ADDR_Y + 50, w: LOGICAL - MARGIN*2, h: MARK_BOX.y - 50 - (ADDR_Y + 50) };
const NAME_SIZE = 64;
const ADDR_SIZE = 24;
const TITLE_SIZE = 36;

// layout — post do evento
const EVT_TITLE_L1 = 'Circuito de';
const EVT_TITLE_L2 = 'Ateliês do Centro';
const EVT_TITLE_SIZE = 92;
const EVT_TITLE_Y1 = 126;
const EVT_TITLE_Y2 = 213;
const EVT_MAP_BOX = { x: 0, y: 0, w: LOGICAL, h: LOGICAL };
const EVT_MARK_WIDTH = 30;
const EVT_STATS_SIZE = 40;
const EVT_STATS_Y1 = 884;
const EVT_STATS_Y2 = 930;
const EVT_DATE_Y = EVT_STATS_Y2;

function parseCSV(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; } }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ''; }
      else if (c === '\r'){ /* ignore */ }
      else if (c === '\n'){ row.push(field); field = ''; rows.push(row); row = []; }
      else { field += c; }
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

async function loadLocationsFromSheet(){
  const res = await fetch(SHEET_CSV_URL);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  const table = parseCSV(text).filter(r => r.some(c => c !== undefined && c.trim() !== ''));
  if (table.length < 2) throw new Error('planilha vazia');
  const headers = table[0].map(h => h.trim());
  const hIdx = {}; headers.forEach((h,i)=>hIdx[h]=i);
  const get = (row, name) => { const i = hIdx[name]; return (i!=null && row[i]!=null) ? row[i].trim() : ''; };
  const locMap = {}; const order = [];
  table.slice(1).forEach(row => {
    const local = get(row,'Local / Coletivo');
    const endereco = get(row,'Endereço');
    const nome = get(row,'Nome do Artista');
    if (!endereco && !nome) return;
    const instagram = get(row,'Instagram').replace(/^@/, '');
    const foto = get(row,'Foto do trabalho (URL)');
    const latRaw = get(row,'Latitude');
    const lngRaw = get(row,'Longitude');
    const key = endereco;
    if (!locMap[key]){
      locMap[key] = {
        id: 'loc' + order.length, local, endereco,
        lat: latRaw ? parseFloat(latRaw.replace(',', '.')) : null,
        lng: lngRaw ? parseFloat(lngRaw.replace(',', '.')) : null,
        artistas: []
      };
      order.push(key);
    }
    locMap[key].artistas.push({ nome, instagram, foto });
  });
  return order.map(k => locMap[k]);
}

function initials(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}

/* ============================================================
   geometria genérica (sem mapa) — usada no post do artista pra
   posicionar os pontos da marca pequena
   ============================================================ */
function project(lat, lon){
  const x = (lon + 180) / 360;
  const rad = lat * Math.PI/180;
  const y = (1 - Math.log(Math.tan(rad) + 1/Math.cos(rad)) / Math.PI) / 2;
  return { x, y };
}
function expandBounds(b, factor){
  const cLat = (b.minLat+b.maxLat)/2, cLng = (b.minLng+b.maxLng)/2;
  const spanLat = Math.max((b.maxLat-b.minLat)*factor, 0.002);
  const spanLng = Math.max((b.maxLng-b.minLng)*factor, 0.002);
  return { minLat:cLat-spanLat/2, maxLat:cLat+spanLat/2, minLng:cLng-spanLng/2, maxLng:cLng+spanLng/2 };
}
let proj = null;
function computeProjection(bounds, W, H, padFactor){
  const expanded = expandBounds(bounds, padFactor);
  const p1 = project(expanded.maxLat, expanded.minLng);
  const p2 = project(expanded.minLat, expanded.maxLng);
  const worldW = p2.x - p1.x, worldH = p2.y - p1.y;
  const scale = Math.min(W/worldW, H/worldH);
  const offsetX = (W - worldW*scale)/2, offsetY = (H - worldH*scale)/2;
  return { p1, scale, offsetX, offsetY };
}
function pixelOf(lat, lon){
  const p = project(lat, lon);
  return { x: proj.offsetX + (p.x - proj.p1.x)*proj.scale, y: proj.offsetY + (p.y - proj.p1.y)*proj.scale };
}
function fitPointsToBox(points, box, fillFraction){
  const xs = points.map(p=>p.x), ys = points.map(p=>p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const w = (maxX-minX) || 1, h = (maxY-minY) || 1;
  const scale = Math.min(box.w*fillFraction/w, box.h*fillFraction/h);
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  const boxCx = box.x + box.w/2, boxCy = box.y + box.h/2;
  return points.map(p => ({ x: boxCx + (p.x-cx)*scale, y: boxCy + (p.y-cy)*scale }));
}

/* ============================================================
   geometria com mapa real (mercator + tiles) — usada no post do
   evento, pra que a posição dos pontos faça sentido geograficamente
   ============================================================ */
const TILE_SIZE = 256;
const TILE_URL = (z,x,y,s) => `https://${s}.basemaps.cartocdn.com/light_all/${z}/${x}/${y}.png`;
const SUBS_EVT = ['a','b','c','d'];

function mercProject(lat, lon, zoom){
  const scale = Math.pow(2, zoom);
  const x = (lon + 180) / 360 * scale;
  const rad = lat * Math.PI/180;
  const y = (1 - Math.log(Math.tan(rad) + 1/Math.cos(rad)) / Math.PI) / 2 * scale;
  return { x, y };
}
function fitZoomEvt(bounds, boxW, boxH, margin){
  for (let z = 19; z >= 2; z--){
    const p1 = mercProject(bounds.maxLat, bounds.minLng, z);
    const p2 = mercProject(bounds.minLat, bounds.maxLng, z);
    const pxW = (p2.x - p1.x) * TILE_SIZE;
    const pxH = (p2.y - p1.y) * TILE_SIZE;
    if (pxW <= (boxW - margin*2) && pxH <= (boxH - margin*2)) return z;
  }
  return 2;
}
let evtProj = null; // { zoom, originX, originY, tile }
function computeEvtProjection(bounds){
  const expanded = expandBounds(bounds, 1.0);
  const zoom = fitZoomEvt(expanded, EVT_MAP_BOX.w, EVT_MAP_BOX.h, 45);
  const p1 = mercProject(expanded.maxLat, expanded.minLng, zoom);
  const p2 = mercProject(expanded.minLat, expanded.maxLng, zoom);
  const pxW = (p2.x - p1.x) * TILE_SIZE;
  const pxH = (p2.y - p1.y) * TILE_SIZE;
  const scale = Math.min(8, Math.max(1, Math.min((EVT_MAP_BOX.w-90)/pxW, (EVT_MAP_BOX.h-90)/pxH)));
  const tile = TILE_SIZE * scale;
  const cLat = (expanded.minLat+expanded.maxLat)/2, cLng = (expanded.minLng+expanded.maxLng)/2;
  const center = mercProject(cLat, cLng, zoom);
  const originX = center.x - (EVT_MAP_BOX.w/2)/tile;
  const originY = center.y - (EVT_MAP_BOX.h/2)/tile;
  evtProj = { zoom, originX, originY, tile };
}
function pixelOfEvt(lat, lon){
  const p = mercProject(lat, lon, evtProj.zoom);
  return { x: EVT_MAP_BOX.x + (p.x - evtProj.originX)*evtProj.tile, y: EVT_MAP_BOX.y + (p.y - evtProj.originY)*evtProj.tile };
}

let evtBasemapCanvas = null;
let evtBasemapLoading = false;
async function fetchEvtBasemapTiles(){
  if (evtBasemapCanvas || evtBasemapLoading) return;
  evtBasemapLoading = true;
  const { zoom, originX, originY, tile } = evtProj;
  const off = document.createElement('canvas');
  off.width = EVT_MAP_BOX.w; off.height = EVT_MAP_BOX.h;
  const octx = off.getContext('2d');
  octx.fillStyle = '#e9e9e9'; octx.fillRect(0,0,EVT_MAP_BOX.w,EVT_MAP_BOX.h);

  const txStart = Math.floor(originX), txEnd = Math.floor(originX + EVT_MAP_BOX.w/tile);
  const tyStart = Math.floor(originY), tyEnd = Math.floor(originY + EVT_MAP_BOX.h/tile);
  const maxTile = Math.pow(2, zoom);
  const jobs = [];
  for (let tx = txStart; tx <= txEnd; tx++){
    for (let ty = tyStart; ty <= tyEnd; ty++){
      if (ty < 0 || ty >= maxTile) continue;
      const wrappedX = ((tx % maxTile) + maxTile) % maxTile;
      const sub = SUBS_EVT[Math.abs(tx+ty) % SUBS_EVT.length];
      const url = TILE_URL(zoom, wrappedX, ty, sub);
      const px = (tx - originX) * tile - EVT_MAP_BOX.x;
      const py = (ty - originY) * tile - EVT_MAP_BOX.y;
      jobs.push(new Promise(resolve => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => { try{ octx.drawImage(img, px + EVT_MAP_BOX.x, py + EVT_MAP_BOX.y, tile, tile); }catch(e){} resolve(); };
        img.onerror = () => resolve();
        img.src = url;
      }));
    }
  }
  await Promise.all(jobs);
  try{
    const imgData = octx.getImageData(0,0,EVT_MAP_BOX.w,EVT_MAP_BOX.h);
    const d = imgData.data;
    for (let i=0;i<d.length;i+=4){
      const v = d[i]*0.3 + d[i+1]*0.59 + d[i+2]*0.11;
      const c = Math.min(255, (v-128)*1.08+128*1.03);
      d[i]=d[i+1]=d[i+2]=c;
    }
    octx.putImageData(imgData,0,0);
  } catch(e){
    console.warn('Não foi possível aplicar o tom de cinza (possível restrição de CORS dos tiles):', e);
  }
  evtBasemapCanvas = off;
  evtBasemapLoading = false;
}

/* ============================================================
   caminho reto/curvo entre dois pontos, comprimento, sub-trecho
   ============================================================ */
function buildLegPath(a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  if (Math.random() < 0.35 || len < 0.09){
    return [ { x:a.x, y:a.y }, { x:b.x, y:b.y } ];
  }
  const nx = -dy/len, ny = dx/len;
  const side = Math.random() < 0.5 ? 1 : -1;
  const offset = len * (0.08 + Math.random()*0.14) * side;
  const mx = (a.x+b.x)/2 + nx*offset;
  const my = (a.y+b.y)/2 + ny*offset;
  const N = 16;
  const pts = [];
  for (let i=0;i<=N;i++){
    const t = i/N;
    const it = 1-t;
    pts.push({
      x: it*it*a.x + 2*it*t*mx + t*t*b.x,
      y: it*it*a.y + 2*it*t*my + t*t*b.y
    });
  }
  return pts;
}
function pathLength(points){
  let len = 0;
  for (let i=1;i<points.length;i++) len += Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
  return len;
}
function subPathUpTo(points, dist){
  const out = [points[0]];
  let d = 0;
  for (let i = 1; i < points.length; i++){
    const seg = Math.hypot(points[i].x-points[i-1].x, points[i].y-points[i-1].y);
    if (d + seg >= dist){
      const t = seg === 0 ? 0 : (dist-d)/seg;
      out.push({ x: points[i-1].x + (points[i].x-points[i-1].x)*t, y: points[i-1].y + (points[i].y-points[i-1].y)*t });
      return out;
    }
    out.push(points[i]);
    d += seg;
  }
  return out;
}
function escapeXML(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let photoOk = false;

/* ---- troca de modo ---- */

/* ============================================================

   ============================================================ */
function renderArtistSelect(){
  artistSelect.innerHTML = '';
  FLAT_ARTISTS.forEach((a, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${a.nome} — ${a.loc.local || a.loc.endereco}`;
    artistSelect.appendChild(opt);
  });
  if (FLAT_ARTISTS.length){ artistSelect.value = 0; setArtist(0); }
}
function setArtist(idx){
  currentArtist = FLAT_ARTISTS[idx];
  photoOk = false;
  loadedImg = null;
  if (currentArtist && currentArtist.foto){
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { photoOk = true; loadedImg = img; draw(); };
    img.onerror = () => { photoOk = false; loadedImg = null; draw(); };
    img.src = currentArtist.foto;
  } else {
    draw();
  }
}
artistSelect.addEventListener('change', () => setArtist(parseInt(artistSelect.value, 10)));

function generateNewMark(){
  const order = [...PTS].sort(() => Math.random()-0.5);
  const closed = [...order, order[0]];
  const pts = [ { x: closed[0].x, y: closed[0].y } ];
  for (let i = 1; i < closed.length; i++){
    buildLegPath(closed[i-1], closed[i]).slice(1).forEach(p => pts.push(p));
  }
  markPoints = fitPointsToBox(pts, MARK_BOX, 0.9);
  draw();
}
document.getElementById('btn-new-mark').addEventListener('click', generateNewMark);

function buildOpenPathD(points){
  if (points.length < 2) return '';
  let d = 'M' + points[0].x.toFixed(2) + ' ' + points[0].y.toFixed(2) + ' ';
  for (let i = 1; i < points.length; i++) d += 'L' + points[i].x.toFixed(2) + ' ' + points[i].y.toFixed(2) + ' ';
  return d;
}

function buildContentSVG(){
  const theme = THEMES[currentTheme];
  let s = '';
  s += `<rect x="0" y="0" width="${LOGICAL}" height="${LOGICAL}" fill="${theme.bg}"/>`;

  s += `<text x="${MARGIN}" y="${NAME_Y}" font-family="'Instrument Serif', Georgia, serif" font-size="${NAME_SIZE}" fill="${theme.ink}">${escapeXML(currentArtist ? currentArtist.nome : '—')}</text>`;
  const addrLine = currentArtist
    ? (currentArtist.loc.local ? `${currentArtist.loc.local} — ${currentArtist.loc.endereco}` : currentArtist.loc.endereco)
    : '—';
  s += `<text x="${MARGIN}" y="${ADDR_Y}" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="${ADDR_SIZE}" fill="${theme.sub}">${escapeXML(addrLine)}</text>`;

  const hasPhoto = currentArtist && currentArtist.foto && photoOk;
  if (hasPhoto){
    s += `<image href="${currentArtist.foto}" x="${PHOTO_BOX.x}" y="${PHOTO_BOX.y}" width="${PHOTO_BOX.w}" height="${PHOTO_BOX.h}" preserveAspectRatio="xMidYMid slice"/>`;
  } else {
    s += `<rect x="${PHOTO_BOX.x}" y="${PHOTO_BOX.y}" width="${PHOTO_BOX.w}" height="${PHOTO_BOX.h}" fill="${currentTheme==='preto' ? '#2a2a2a' : '#e4e4e4'}"/>`;
    s += `<text x="${PHOTO_BOX.x+PHOTO_BOX.w/2}" y="${PHOTO_BOX.y+PHOTO_BOX.h/2}" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="48" fill="${theme.sub}" text-anchor="middle" dominant-baseline="middle">${currentArtist ? initials(currentArtist.nome) : '—'}</text>`;
  }

  if (markPoints.length >= 2){
    s += `<path d="${buildOpenPathD(markPoints)}" fill="none" stroke="${theme.mark}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  const textX = MARK_BOX.x + MARK_BOX.w + 26;
  s += `<text x="${textX}" y="${MARK_BOX.y+52}" font-family="'Instrument Serif', Georgia, serif" font-size="${TITLE_SIZE}" fill="${theme.ink}">${escapeXML(EVENT_TITLE)}</text>`;
  s += `<text x="${textX}" y="${MARK_BOX.y+98}" font-family="'Instrument Serif', Georgia, serif" font-size="${TITLE_SIZE}" fill="${theme.sub}">${escapeXML(EVENT_DATES)}</text>`;

  return s;
}
function draw(){
  svgEl.innerHTML = buildContentSVG();
}
function buildFullSVGString(){
  const content = buildContentSVG();
  return `<?xml version="1.0" encoding="UTF-8"?>\n` +
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${LOGICAL} ${LOGICAL}" width="${LOGICAL}" height="${LOGICAL}">` +
    `<defs><style>@import url('${FONT_IMPORT.replace(/&/g,'&amp;')}');</style></defs>` +
    content +
    `</svg>`;
}
function rasterizeSVG(scale){
  return new Promise((resolve, reject) => {
    const svgBlob = new Blob([buildFullSVGString()], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = LOGICAL * scale;
      c.height = LOGICAL * scale;
      const cctx = c.getContext('2d');
      try{
        cctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c);
      } catch(err){
        URL.revokeObjectURL(url);
        reject(err);
      }
    };
    img.onerror = (err) => { URL.revokeObjectURL(url); reject(err); };
    img.src = url;
  });
}

function generateNewEventMark(){

// desenha um quadro completo do post do evento — assume que o contexto
// já tem a escala/transformação aplicada (pra funcionar tanto na prévia
// em tela quanto na exportação em alta resolução)
function drawEventFrame(ctx2d, dMark, markPath){
  const theme = THEMES[currentTheme];
  ctx2d.clearRect(0, 0, LOGICAL, LOGICAL);
  ctx2d.fillStyle = theme.bg;
  ctx2d.fillRect(0, 0, LOGICAL, LOGICAL);

  if (showMapEvt && evtBasemapCanvas){
    ctx2d.drawImage(evtBasemapCanvas, EVT_MAP_BOX.x, EVT_MAP_BOX.y, EVT_MAP_BOX.w, EVT_MAP_BOX.h);
  }

  ctx2d.textAlign = 'left'; ctx2d.textBaseline = 'alphabetic';
  ctx2d.fillStyle = theme.ink;
  ctx2d.font = `${EVT_TITLE_SIZE}px 'Instrument Serif', Georgia, serif`;
  ctx2d.fillText(EVT_TITLE_L1, MARGIN, EVT_TITLE_Y1);
  ctx2d.fillText(EVT_TITLE_L2, MARGIN, EVT_TITLE_Y2);

  if (markPath && markPath.length >= 2){
    const sub = subPathUpTo(markPath, dMark);
    ctx2d.strokeStyle = theme.mark;
    ctx2d.lineWidth = EVT_MARK_WIDTH;
    ctx2d.lineCap = 'round';
    ctx2d.lineJoin = 'round';
    ctx2d.beginPath();
    sub.forEach((p, i) => { if (i === 0) ctx2d.moveTo(p.x, p.y); else ctx2d.lineTo(p.x, p.y); });
    ctx2d.stroke();

    // "negativo": onde a linha cruza o título, revela o título na cor
    // do fundo — como se a linha fosse uma máscara pra uma versão
    // invertida do texto por baixo dela
    const off = document.createElement('canvas');
    off.width = LOGICAL; off.height = LOGICAL;
    const octx = off.getContext('2d');
    octx.fillStyle = theme.bg;
    octx.textAlign = 'left'; octx.textBaseline = 'alphabetic';
    octx.font = `${EVT_TITLE_SIZE}px 'Instrument Serif', Georgia, serif`;
    octx.fillText(EVT_TITLE_L1, MARGIN, EVT_TITLE_Y1);
    octx.fillText(EVT_TITLE_L2, MARGIN, EVT_TITLE_Y2);
    octx.globalCompositeOperation = 'destination-in';
    octx.lineWidth = EVT_MARK_WIDTH;
    octx.lineCap = 'round';
    octx.lineJoin = 'round';
    octx.strokeStyle = '#000';
    octx.beginPath();
    sub.forEach((p, i) => { if (i === 0) octx.moveTo(p.x, p.y); else octx.lineTo(p.x, p.y); });
    octx.stroke();
    ctx2d.drawImage(off, 0, 0, LOGICAL, LOGICAL);
  }

  if (showPinsEvt){
    PTS_EVT.forEach((p) => {
      ctx2d.beginPath();
      ctx2d.arc(p.x, p.y, 15, 0, Math.PI*2);
      ctx2d.fillStyle = theme.mark;
      ctx2d.fill();
      ctx2d.lineWidth = 2.2;
      ctx2d.strokeStyle = theme.bg;
      ctx2d.stroke();
      ctx2d.fillStyle = theme.bg;
      ctx2d.font = "12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
      ctx2d.textAlign = 'center'; ctx2d.textBaseline = 'middle';
      ctx2d.fillText(String(alphaNumEvt[p.id]).padStart(2,'0'), p.x, p.y+0.5);
      ctx2d.textAlign = 'left'; ctx2d.textBaseline = 'alphabetic';
    });
  }

  ctx2d.textAlign = 'left';
  ctx2d.fillStyle = theme.ink;
  ctx2d.font = `${EVT_STATS_SIZE}px 'Instrument Serif', Georgia, serif`;
  ctx2d.fillText(`${numAddresses} Endereços`, MARGIN, EVT_STATS_Y1);
  ctx2d.fillText(`${numArtists} Artistas`, MARGIN, EVT_STATS_Y2);

  ctx2d.textAlign = 'right';
  ctx2d.fillStyle = theme.sub;
  ctx2d.fillText(EVENT_DATES, LOGICAL - MARGIN, EVT_DATE_Y);
  ctx2d.textAlign = 'left';
}

function redrawEvent(){
  const full = markPathForFrame();
  drawEventFrame(ectx, full ? pathLength(full) : 0, full);
}
function markPathForFrame(){
  return evtMarkPoints.length >= 2 ? evtMarkPoints : null;
}

/* ---- vídeo do post do evento: anda ponto a ponto, sem modais, uma
   volta só, no ritmo real (sem duração fixa) ---- */
const btnEvtVideo = document.getElementById('btn-evt-video');
const EVT_DURATION_MS = 4000; // duração alvo do vídeo — bem mais rápido

btnEvtVideo.addEventListener('click', () => {
  if (!('MediaRecorder' in window)){
    setStatus('Este navegador não suporta gravação de vídeo (tente no Chrome ou Firefox).', true);
    return;
  }
  const order = [...PTS_EVT].sort(() => Math.random()-0.5);
  const raw = [ { x: order[0].x, y: order[0].y } ];
  for (let i = 1; i < order.length; i++){
    buildLegPath(order[i-1], order[i]).slice(1).forEach(p => raw.push(p));
  }
  const totalLen = pathLength(raw);
  const durationSec = EVT_DURATION_MS / 1000;
  const evtSpeed = totalLen / durationSec;

  let stream, recorder;
  try{
    stream = eventCanvas.captureStream(30);
    const mimeCandidates = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    const mimeType = mimeCandidates.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
    recorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  } catch(err){
    setStatus('Não foi possível iniciar a gravação neste navegador.', true);
    return;
  }

  const chunks = [];
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'circuito-post-evento.webm';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    setStatus('vídeo pronto — download iniciado (.webm).');
    redrawEvent();
  };

  setStatus('gravando o vídeo do evento…');
  recorder.start();

  let startTs = null;
  function frame(ts){
    if (startTs == null) startTs = ts;
    const elapsed = (ts - startTs) / 1000;
    const d = Math.min(totalLen, elapsed * evtSpeed);
    drawEventFrame(ectx, d, raw);
    if (elapsed < durationSec){
      requestAnimationFrame(frame);
    } else {
      recorder.stop();
    }
  }
  requestAnimationFrame(frame);
});

/* ============================================================
   exportação (compartilhada — ramifica por modo)

svgDownloadBtn.addEventListener('click', () => {
  if (mode !== 'artista') return;
  setStatus('');
  const blob = new Blob([buildFullSVGString()], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'circuito-post-artista.svg';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});

document.getElementById('btn-download-png').addEventListener('click', async () => {
  setStatus('gerando PNG em alta resolução…');
  try{
    if (mode === 'artista'){
      const c = await rasterizeSVG(3);
      c.toBlob(blob => {
        if (!blob){ setStatus('Não foi possível gerar o PNG.', true); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'circuito-post-artista.png';
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        setStatus('');
      }, 'image/png');
    } else {
      const scale = 3;
      const c = document.createElement('canvas');
      c.width = LOGICAL*scale; c.height = LOGICAL*scale;
      const cctx = c.getContext('2d');
      cctx.scale(scale, scale);
      const full = markPathForFrame();
      drawEventFrame(cctx, full ? pathLength(full) : 0, full);
      c.toBlob(blob => {
        if (!blob){ setStatus('Não foi possível gerar o PNG.', true); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'circuito-post-evento.png';
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        setStatus('');
      }, 'image/png');
    }
  } catch(err){
    console.error(err);
    setStatus('Exportação bloqueada — provavelmente a foto (ou o mapa) não libera CORS. Tente novamente.', true);
  }
});

document.getElementById('btn-download-pdf').addEventListener('click', async () => {
  setStatus('gerando PDF…');
  try{
    let dataUrl;
    if (mode === 'artista'){
      const c = await rasterizeSVG(3);
      dataUrl = c.toDataURL('image/png');
    } else {
      const scale = 3;
      const c = document.createElement('canvas');
      c.width = LOGICAL*scale; c.height = LOGICAL*scale;
      const cctx = c.getContext('2d');
      cctx.scale(scale, scale);
      const full = markPathForFrame();
      drawEventFrame(cctx, full ? pathLength(full) : 0, full);
      dataUrl = c.toDataURL('image/png');
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'px', format: [LOGICAL, LOGICAL] });
    doc.addImage(dataUrl, 'PNG', 0, 0, LOGICAL, LOGICAL);
    doc.save(mode === 'artista' ? 'circuito-post-artista.pdf' : 'circuito-post-evento.pdf');
    setStatus('');
  } catch(err){
    console.error(err);
    setStatus('Não foi possível gerar o PDF agora.', true);
  }
});

/* ============================================================
   boot
   ============================================================ */
async function boot(){
  try{
    await Promise.all([
      document.fonts.load(`${NAME_SIZE}px 'Instrument Serif'`),
      document.fonts.load(`${TITLE_SIZE}px 'Instrument Serif'`),
      document.fonts.load(`${EVT_TITLE_SIZE}px 'Instrument Serif'`),
      document.fonts.load(`${EVT_STATS_SIZE}px 'Instrument Serif'`)
    ]);
  } catch(e){}
  try{
    LOCATIONS = await loadLocationsFromSheet();
  } catch(err){
    console.error(err);
    setStatus('Não foi possível carregar os dados da planilha agora. Recarregue a página em instantes.', true);
    return;
  }

  const withCoords = LOCATIONS.filter(l => l.lat != null && l.lng != null);
  if (withCoords.length < 3){
    setStatus('poucos ateliês com coordenadas preenchidas ainda — é preciso pelo menos 3 pra fechar uma forma.', true);
    return;
  }
  const bounds = {
    minLat: Math.min(...withCoords.map(l=>l.lat)),
    maxLat: Math.max(...withCoords.map(l=>l.lat)),
    minLng: Math.min(...withCoords.map(l=>l.lng)),
    maxLng: Math.max(...withCoords.map(l=>l.lng)),
  };

  // post do artista
  proj = computeProjection(bounds, LOGICAL, LOGICAL, 1.0);
  PTS = withCoords.map(loc => pixelOf(loc.lat, loc.lng));

  // post do evento
  computeEvtProjection(bounds);
  PTS_EVT = withCoords.map(loc => ({ ...pixelOfEvt(loc.lat, loc.lng), id: loc.id }));
  if (showMapEvt){
    setStatus('carregando mapa…');
    fetchEvtBasemapTiles().then(() => { setStatus(''); redrawEvent(); });
  }
  const sortedForNum = [...withCoords].sort((a,b) =>
    (a.local||a.endereco).localeCompare(b.local||b.endereco, 'pt-BR', {sensitivity:'base'}));
  alphaNumEvt = {};
  sortedForNum.forEach((loc,i) => { alphaNumEvt[loc.id] = i+1; });

  numAddresses = LOCATIONS.length;
  numArtists = LOCATIONS.reduce((sum, l) => sum + l.artistas.filter(a => a.nome).length, 0);
  document.getElementById('evt-stats-note').textContent = `${numAddresses} endereços · ${numArtists} artistas (direto da planilha)`;

  LOCATIONS.forEach(loc => loc.artistas.forEach(art => {
    if (art.nome) FLAT_ARTISTS.push({ ...art, loc });
  }));
  FLAT_ARTISTS.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{sensitivity:'base'}));

  renderArtistSelect();
  generateNewMark();
  generateNewEventMark();
}
boot();
